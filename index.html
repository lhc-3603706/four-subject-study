const COURSES=[{"code": "04851", "name": "产品设计程序与方法", "file": "产品设计程序与方法（04851）(1).pdf", "pages": 4, "pageText": ["产品设计程序与方法\n(04851)知识点\n命题来源:围绕学科的基本概念、原理、特点、内容。\n答题攻略:\n(1)不能像名词解释那样简单，也不能像论述题那样长篇大论，但需要加以简要扩展。\n(2)答案内容要简明、概括、准确，即得分的关键内容一定要写清楚。\n(3)答案表述要有层次性，列出要点，分点分条作答，不要写成一段:\n(4)如果对于考题内容完全不知道，利用选择题找灵感，找到相近的内容，联系起来进行作\n答。\n考点 1:简述新艺术运动的特征\n1.强调手工艺，反对工业化\n2.摒弃传统，开创自然装饰新风\n3.设计中避免直线，追求自然形态，但尚未实现功能与形式的统一\n装饰受东方尤其是日本江户时期风格影响:同时探索新材料与技术带来的艺术可能\n考点 2:简述德国工业同盟的宗旨\n1.结合艺术、工业、手工业\n2.提升设计水平与合作\n3.倡导功能主义与标准化生产:反对装饰。\n考点 3:简述俄国构成主义的特点\n1.非具象简单造型\n2.新技术新材料应用\n3.理性结构表达\n考点 4:简述芝加哥学派的风格特征\n1.注重内部功能，大胆使用新材料\n2.强调结构的逻辑表现:立面简洁、明确，采用整齐排列的大片玻璃窗\n3.突破了传统建筑的沉闷之感，形式服从功能\n考点 5:简述美国工业设计职业化的代表人物\n1)沃尔特·提格，柯达公司设计了“班腾”照相机\n2)雷蒙德·罗维，把流线型运用到交通工具的设计，降低了能耗:为可口可乐公司进行系列\n设计\n3)亨利·德雷福斯，在设计中强调产品的高度舒适性，提出了“从内而外”的设计原则\n考点 6:简述意大利现代设计的发展三阶段\n1.萌芽期:受欧洲现代主义影响，意大利于 20 世纪初步入现代设计\n2.重建期:战后，设计融合美国元素与意大利文化，强化人文主义，奠定后现代与多元个性\n化基础\n3.反主流与后现代期:反现代主义兴起，以装饰性、社会影响力为核心，反对大规模生产与\n技术时尚\n考点 7:简述设计的门类\n1)视觉与媒体设计\n2)工业设计\n3)环境与景观设计\n4)服装设计", "5)手工艺设计\n6)信息与交互设计\n考点 8:简述 IDEO 设计思维模型的设计方法\n1.了解现状\n2.用户研究\n3.构思新观念\n4.评估提炼模型\n5.商业化创新\n考点 9:简述代尔夫特设计策略\n1.基本设计周期模型\n2.产品创新流程模型\n3.谷歌设计冲刺模型\n4.通用产品设计程序\n考点 10:简述设计定义的方法\n1.意向板\n2.问题界定\n3.要求清单\n4.市场营销组合\n5.5W1H 分析法\n6.常态分配\n7.满意法\n考点 11:简述设计表达方法\n1.原型设计\n2.初稿设计\n3.实体模型\n4.弹性建模\n5.设计手绘\n6.技术文档\n7.影像视觉\n考点 12:简述商业创新评估中的成本售价定性预估\n1.比较分析法\n2.材料与技术考量\n3.产量与成本平衡\n考点 13:简述产品语义学核心研究内容\n1.功能语义\n2.情感语义\n3.象征语义\n考点 14:简述产品符号学的三大分支\n1.符形学\n2.符义学\n3.符用学\n考点 15:简述形体的轴线与比例关系\n1.主次关系\n2.轴线布置", "3.实践提升\n考点 16:简述设计几何学\n1.黄金比例\n2.斐波那契数列\n3.自然界比例\n4.勒·柯布西耶辅助线\n考点 17:简述平面设计软件\n1.Adobe Photoshop(简称“Ps”):专长图像编辑处理。\n2.Adobe lllustrator(简称“AI”):专长专业矢量图形设计。\n3.Core IDRAW:专长:绘图及排版软件。\n考点 18:简述色彩三要素\n1.色相(Hue)\n2.饱和度(Saturation)\n3.明度(Value)\n考点 19:简述色彩搭配影响\n1.明度影响层次与空间\n2.纯度对比影响视觉效果\n3.冷暖对比决定整体色调\n考点 20:简述产品成型工艺类型\n1.加法成型(增材制造)\n2.减法成型(减材制造)\n3.塑性成型(等材制造)\n考点 21:简述玻璃成型工艺\n1.切割工艺\n2.热弯工艺\n3.彩绘玻璃\n4.喷砂和蚀刻\n5.彩色釉面玻璃\n6.雕刻\n7.镀膜\n考点 22:简述产品结构设计总原则\n1.合理选材\n2.结构合理\n3.简化模具结构\n考点 23:简述服务设计流程应遵循的基本法则\n①关注体验\n②创新文化的构  3.明度(Value)", "n": 18}, {"q": "简述色彩搭配影响", "a": "1.明度影响层次与空间 2.纯度对比影响视觉效果 3.冷暖对比决定整体色调", "n": 19}, {"q": "简述产品成型工艺类型", "a": "1.加法成型(增材制造) 2.减法成型(减材制造) 3.塑性成型(等材制造)", "n": 20}, {"q": "简述玻璃成型工艺", "a": "1.切割工艺 2.热弯工艺 3.彩绘玻璃 4.喷砂和蚀刻 5.彩色釉面玻璃 6.雕刻 7.镀膜", "n": 21}, {"q": "简述产品结构设计总原则", "a": "1.合理选材 2.结构合理 3.简化模具结构", "n": 22}, {"q": "简述服务设计流程应遵循的基本法则", "a": "①关注体验 ②创新文化的构建 ③基于系统的创新", "n": 23}, {"q": "简述服务设计流程主要阶段", "a": "1.情景研究 2.服务创新与设计 3.组织实施", "n": 24}, {"q": "简述系统设计的特点", "a": "(1)系统具有独立的功能 (2)系统具有整体性 (3)系统具有相对性 (4)系统设计的普适性", "n": 25}, {"q": "简述系统设计的主要步骤", "a": "(1)确定设计任务 (2)确定系统整体功能性 (3)子功能的确定 (4)子功能分析与方案解决 (5)整体方案的协调统一", "n": 26}, {"q": "简述设计管理主要功能", "a": "(1)一致性与融入 (2)企业形象与竞争力 (3)激发与监督 (4)范围和内容", "n": 27}, {"q": "简述设计管理过程", "a": "(1)计划设计 (2)组织设计 (3)监督设计 (4)控制设计", "n": 28}]}, {"code": "04842", "name": "产品系统化设计", "file": "产品系统化设计（04842）(1).pdf", "pages": 29, "pageText": ["《产品系统化设计》知识点汇总\n绪 论\n一、现代产品设计系统观\n1、产品是系统的；\n2、产品的生命周期是系统的；\n3、产品设计的过程是系统的；\n二、现代产品的系统化特征\n产品系统设计是从整体上把握过程中各要素间的关系，通过一定的结构形式，使产品\n系统达到既定的功能。\n产品设计是实现产品系统的过程：\n这一过程是由相互作用、相互依赖的若干组成部分结合而成、具有特定作用、达到同一\n目的的有机整体，从而形成产品设计系统，其从属于产品系统。\n1、产品信息化\n1）产品制造正步入信息化的时代\n2）产品的发展方向趋向信息化（多功能化、复合化、短小轻薄化、智能化、精神化）\n3）产品开发设计信息化（并行设计的新方法）\n2、产品系列化\n我们通常把相互关联的成组成套的产品称做系列产品。有以下几种形式：\n1）品牌性系列在一个品牌之下的多种独立的产品。\n2）成套系列：由多种独立功能产品组成一个产品系统。", "3）单元系列：单元产品之间具有某种相关性和依存关系，构成完整的产品系列。\n系列化产品的意义：\n1）对于商业的意义：系列产品的开发是提高市场竞争力的重要策略。\n2）对于生产的意义：\n刚性生产方式：是指传统的固定式自动化生产方式。\n柔性生产方式：是指能够灵活多样的小批量生产多种产品的生产方式。\n3、产品商品化（产品与商品的区别）\n4、产品生态化：把产品这一人造系统与自然生态系统视为命运共同的认识即是产品生态观。\n而将这一观念付诸实现的过程就是产品生态化。\n绿色产品的基本特征是：\n立足于产品或产品的部分可重复使用；\n立足于产品或产品的部分可回收翻新多次使用；\n产品在使用寿命完结时可安全进行处理。\n绿色产品的概念：绿色产品就是在其生命周期全程中，符合特定的环境保护要求，对生态环\n境无害或危害极小，资源利用率极高，能源消耗最低的产品。\n第一章 产品系统设计\n（系统 产品系统 产品设计系统）\n第一节 系统的基本概念\n（1）定义：系统是由若干要素以一定结构形式联结构成的具有某种功能的有机整体。\n（2）核心思想：整体的观念。\n要素间的关联性；整体功能不等于局部功能；强目的性；相对性\n（3）重点：处理好要素与要素，要素与系统，系统与环境三方面的关系。", "（4）发展：贝塔朗菲创立系统论；对事物观测由“实物”为中心转向“系统中”\n第二节 产品系统概念\n产品系统的含义：是由若干相互联系的要素构成、具有一定功能的集合体。\n（1）二层含义：\nA 一类产品：由各种品种的产品按一定的类型学分类构成的具有相关功能的系列化产品。\nB 一件产品：\n一 个与集：产品，设计师\n二 种与类：系列化产品\n三 因素：\n要素：产品实体（部件，元件，构件）\n关联事物（功能，形态，色彩，美学）\n结构：结构是若干要素相互联系相互作用的关系。\n功能：把系统与外部环境之间相互联系和作用过程的秩序和能力称为系统的功能。\n包含的关系：个与集；种与类。", "第三节 产品设计系统\n一、系统设计方法\n将对象实物当作一个完整的系统加以研究，从全局出发，将各组成部分看成子系统或要", "素，通过整合，建立起相互之间有机的联系，以及系统和外界环境之间的有机关系。\n设计目标和方向\n途径\n策略手段\n运用的工具和手段\n为有效运用工具所必需遵循的程序方法\n纵向和横向的产品系统\n把产品技术、技能、结构、界面、材质、人因、形态等构成因素集成一体的设计观和设计评\n价观\n二 过程系统\n第四节 设计方法系统模式\n一 O-R-O 模式：即客体，联系，产出的系统模式。\n二 串行模式：将设计过程中的各个环节视为系统的要素，而要素之间的构成关系是按一定\n顺序进行的，所构成的系统即是串行系统。\n三 并行模式：是对产品及相关过程进行集成，并行设计的系统化的设计模式。", "第二章 产品设计要素解析\n功能要素\n结构要素\n人因要素\n形态要素\n色彩要素\n环境要素\n第一节 功能要素\n一、功能分析（从需求、功能入手）：\nA 定义功能：将产品和部件或构成要素的效用加以区分和限定。\n方法：语句陈诉法\nB 功能分类：需求性质：使用功能、精神功能\n重要性：主要功能、附属功能\n作用：必要功能、不必要功能\n需求满意度：不足功能、过剩功能、适度功能\n相互关系：上位功能、下位功能、同位功能\nC 功能系统图\n从基本功能出发，根据之间目的手段关系建立功能系统骨架。", "D 功能整理：目的—手段关系，多余功能、多余部件，验证功能定义。\n（2）产品功能设计\n具体实现功能目标的设计过程就是功能设计。\n第二节 结构要素\n一 、 产品结构的含义：\n产品要素之间相互作用、联系的方式。\n有序性：各要素以矩阵、树形或网络结构规律组合\n整体性：各要素无法孤立存在的性质和功能\n稳定性：各要素间性能的动态平衡\nA 外部结构：外观造型和整体结构。\n分：不承担核心功能和承担核心功能结构\nB 核心结构：技术原理结构。\nC 系统结构：产品与产品之间的关系结构。\n分：分体结构、系列结构、网络结构\nD 空间结构：产品在空间上（周围环境）的构成关系。\n二 、 产品结构的设计要点：整体性", "第三节 人因要素\n对象：生产者、营销者、使用者、运输者、回收者等。\n相关知识：人类工程学、设计心理学、消费心理学\n社会属性：社会关系学、文化、宗教、伦理、习俗、价值观、职业性等。\n第四节 形态要素\n一、形态的概念：一般指事物在一定条件下的表现形式。\n二、 形态的分类：\n三、形态的意义：\n四、形态的表现：\n形态的分类\n概念形态：在设计基础教学中，通常将空间所规定的形态归结为概念形态。\n现实形态：现实形态就是实际存在的形态。\n1、自然形态\n2、人为形态\n形态的意义\n1、 产品语意学\n2、 传达意义的形态\n3、 诠释设计的形态\n形态与识别\n形态与操作\n形态与使用\n形态与环境", "形态与记忆\n形态的表现\n1、形态的表现风格：\n功能主义(现代主义)：功能至上\n历史主义：尊重传统和地方文化\n新现代主义：结构与解构\n高技派：高新技术、智能化，概念产品\n有机主义：机体主义和生态主义\n功能主义\n20 世纪 20 年代，现代设计领域的一个重要派别--现代主义设计最终形成。现代主义是主张\n设计要适应现代大工业生产和生活需要，以讲求设计功能、技术和经济效益为特征的学派。\n其最为重要的理念便是功能主义。功能主义就是要在设计中注重产品的功能性与实用性，即\n任何设计都必须保障产品功能及其用途的充分体现，其次才是产品的审美感觉。简而言之，\n功能主义就是功能至上。\n新现代主义\n20 世界 50 年代,以斯堪地那维亚设计为代表的“有机现代主义”流行一时,当进入 60 年代\n后,在一些国家和地区出现了一种复兴 20-30 年代的现代主义、追求集合形式构图和机器风\n格的所谓“新现代主义(Neo-Modernism)”。新现代主义的出现受到流行的视幻艺术(OP 艺\n术)的影响。新现代主义的设计风格与包豪斯有相似之处,他在家居设计中喜欢采用镀铬钢管,\n在形态上强调机械化和几何化。\n解构主义：", "高技派：\n高技派（High-Tech）亦称“重技派”。突出当代工业技术成就，并在建筑形体和室内环境\n设计中加以炫耀，崇尚“机械美”，在室内暴露梁板、网架等结构构件以及风管、线缆等各\n种设备和管道，强调工艺技术与时代感。高技派典型的实例为法国巴黎蓬皮杜国家艺术与文\n化中心、香港中国银行等。\n技派反对传统的审美观念，强调设计作为信息的媒介和设计的交际功能，在建筑设计、室内\n设计中坚持采用新技术，在美学上极力鼓吹表现新技术的作法，包括战后“现代主义建筑”\n在设计方法中所有“重理”的方面，以及讲求技术精美和“粗野主义”倾向。\n历史主义：文丘里、索特萨斯\n有机主义：\n有机现代主义是二战后到 20 世纪 60 年代，流行于斯堪的纳维亚国家、美国和意大利等国\n的一种现代设计风格，它是对现代主义的继承和发展。这种风格在造型常常体现出“有机”\n的自由形态,而不是刻板、冰冷的几何形,无论是在生理还是心理上给使用者以舒适的感受，\n而与此同时这些有机造型的设计往往又适合于大规模生产。这标志着现代主义的发展已突破\n了正统的包豪斯风格而开始走向“软化”。这种“软化”趋势是与斯堪的纳维设计联系在一\n起的,被称为“有机现代主义”。\n2、新的形态表现：\n联想的形态\n引用的形态\n象征的形态", "触感的形态\n新古典主义 新功能主义\n无根源的形态\n第六节色彩要素\n一、产品色彩的意义\n趋于感性化；它的象征作用和情感作用大于形和质，而成本最小。\n二、产品色彩设计\n1、色彩与形态：\n形色不分；暗示结构\n2、色彩与功能：\n功能暗示、以色制（诱）动、象征\n3、色彩与象征\n三、色彩管理\n第六节 环境要素\n一、产品生命周期：\n投入、规划设计生产、销售使用、维护服务、回收利用各阶段。\n二、绿色设计\nA 绿色设计：以“绿色技术”为原则所进行的产品设计。\n绿色技术：环境友善技术。十减少环境污染或减少原材料、自然资源使用技术、工艺、\n产品的总称。\nB “3R”原则：\nreduce：小批量、少面积、节能、（轻薄短小）", "reuse：部件结构完整、主体可替代、系统性\nrecycling：资源再生设计\nC、绿色产品设计的特点：\n1、绿色设计扩大了生命周期；\n2、绿色产品设计必须是一个并行过程。\n3、绿色设计考虑的是环境需求；\n4、可以使构成产品的零部件和材料得到充分的利用。\n5、可以减轻甚至消除产品生命周期末端的压力。\n其它要素\n材料要素\n对内：支撑和安装的结构及强度、弹性等性能。\n对外：质感、光泽、肌理、温度感等。\n美学\n第三章 产品系统设计方法及方法", "产品设计的过程系统\n产品系统模式\n前期准备\n产品企划、确定概念\n造型设计\n设计定案\n设计与生产转化\n进入市场\n一、产品设计的过程系统\n（1）从产品战略到市场营销的完整的过程系统：\n起点-产品战略-基础研究-市场调查-产品开发-产品设计-技术开发-生产-营销-终点\n计划阶段 开发阶段 生产准备阶段\n资料收集\n调查分析\n创造力激发\n构思展开、草图、效果图、初步模型\n技术分析、细部检查、外观模型\n设计图纸、试制、问题分析、\n修改、确定方案\n试生产\n批量生产\n生产准备\n正式投产\n（2）产品设计方法构成：\n传统的设计方法把对象分解为互不相干的部分进行研究。\n现代产品设计是将对象当作一个整体系统加以认识研究。\n产品设计方法系统要素：\n1．明确设计目标的方法——需求对象的满足。", "2．为达到目的的手段——一条途径与多条途经。\n3．为达到目的策略——具有原则性的手段。\n4. 为达到目的工具运用——适当的有效的工具。\n5．有效的程序方法——必须遵守的运行程序。\n现代产品设计系统观念的建立意义在于：将产品设计从实物水平上升到系统水平，建立系统\n化、综合化、整体化的设计思维方法。\n对产品设计系统观念的建立，要基于以下认识：\n产品从设计到生产、到商品化，至使用后的消亡，整个过程如生命周期系统，每一过程\n要素都要在同一目的的驱使下从属于产品的循环系统，并且从属于更大的社会系统。", "二、产品系统模式：\n（1）O-R-O 模式（过程易于控制、结果可预见）：\n（2）串行模式\n（过程要素之间按顺序进行，具制约性，易于控制）\n顺 顺", "串行设计：\n开发 →设计 →样品 →试制 →修改 →试生产 →生产。\n（3）并行模式：\n从产品开发设计一开始就考虑到产品整个生命周期中的各个因素，包括概念的形成、需求的\n定位、可行性、进度、生产制造、甚至商品化过程等。\n优点：过程含多种要素，具可靠性，易于修正错误\n并行设计：\n是集成、并进地设计产品及相关的各种过程的系统化工作模式。\n并行设计的支撑技术是计算机技术：\nA．计算机辅助设计：是实现并行设计的前提，具有随机、动态的交互关系，可证明设计的\n可行性。", "B．逆向工程信息技术：是通过信息技术从模型或实物生成图纸，使产品尽快投入生产。\nC．快速出样技术：以 CAD、CAM 技术，采用特定的材料与成型工艺，快速制作实物样品。\nD．虚拟产品开发与制造：以计算机仿真、智能推理，虚拟产品制造、使用与消耗过程，具\n安全经济与速效性。\n产品企划、确定概念\n一、市场调查和分析\n探测消费倾向\n探测产品需求\n探测市场倾向\n集体创造性思考\n二、产品构思及开发定位\n三、产品概念和企划\n四、设计概念\n五、设计概念产品企划定案", "产品形式\n产品企划书\n产品企划评价\n5W：who、where、when、why、what\n2H：how、how much", "设计定案\n一、评价过程\n营销评价、技术成本评价\n二、评价模型", "三、商品化\n第四章产品系列化设计\n一 产品系列化的概念\n产品是一个系统,系列产品是一个多极系统,如果说产品是功能的载体,那么产品系列化就是\n产品功能的复合化。即在整体目标下,使若干产品功能具有以下特征:\nA、关联性,系列产品的功能之间具有因果关系和依存关系。\nB、独立性,系列产品中的某个功能可独立发挥作用。\nC、组合性,系列产品中的不同功能相匹配,产生更强的功能。\nD、互换性.系列产品中的功能可以进行互换,以产生不同的功能。\n二 系列产品的类型\n1、成套系列\n成套系列即是配套的概念;以相同功能、不同型号、不同规格的产品构成系列。尽管功能相\n同,各个单件的使用频度也不尽相同。但给合在一起可提高产品的适应性,可也满足特定的需\n要。另外,因为充分体现了成套意识,可以增加商机。同时成套产品利用收纳,而且整齐美观,\n具有良好的视觉效果。\n2、组合系列\n以多个具有独立功能的、不同的产品,组成一个产品系列,即为纵向系列。这种系列类型的特\n点就是可互换性。因此,要求产品具有一定的模数关系,或某个部分具有模数关系。甚至还要\n遵循行业标准或国家标准。由于这类产品遵循标准化、具有可互换性,所以可使产品具有更\n好的适应性。因此这类产品往往使可互换部分成为模块,与产品母体相结合,派生出若干系列。\n3、家族系列\n家族系列也具有组合系列的特点,即由独立功能的产品构成系列。但家族系列中的产品,不一", "定要求可互换,而且系列中的产品往往是同样的功能,但形态、规格、色彩、材质上不同,这\n与成套系列产品又相类似。但产品之间不一定存在功能上的相关性,只有形式上的相关性。\n这类产品更具有选择性,更具有商业价值,从而便能产生品牌效应。\n4、单元系列\n以不同功能的产品或部件为单元,各单元承担不同的角色,为共同满足整体目标而构成的产\n品系列。该系列产品的功能之间不可互换,但有依存关系。这种系列也可以形成家族感,但与\n形式上的统一感相比,功能上的配套性更为重要。从使用角度讲,这种系列设计的意义在于体\n现功能协同上的可靠性,从商品角度讲,更能体现出品牌效应。\n三 系列产品设计方法解析\n1、组合设计\n产品是一个系统,其构成要素往往包括功能、用途、原理、形状、规格、材料、色彩、成分\n等。系列产品的组合设计就是将某些要素在纵横方向上进行组合或将某个要素进行扩展,构\n成更大的产品系统。\nA、功能组合，\n在单件产品设计中,常会将多种功能部分组合到一个产品中,即所谓多功能产品。这种多功能\n化产品的优点是一物多用,而缺点是:对某些功能使用频率不同,又会将多余的功能强加给使\n用者,让其承担浪费。(如手机)系列产品的功能组合,是将若干不同功能的产品组成一个系列,\n在购买或使用时具有可选择性;在主题上是一个整体,在使用上具有灵活性。(中国的菜刀，\n老外的刀具)\nB、要素组合，\n系列产品的实质就是商品要素在某个目标下的系列组合。所谓商品要素,不外乎是功能、用\n途、结构、原理、形状、规格、材料等成分,如果将其中的某个要素进行扩展,从纵向上或横", "向上进行组合,就可形成系列产品。\nC、配套组合，\n如果说要素扩展是属于纵向组合方式的话,那配套组合就是要素的横向组合.即,将不同的、\n独立的产品作为构成系列的要素进行组合。其目的是:使成套意识带来的品牌效应,有助于商\n业上的特定目标的实现。\nD、强制组合，\n将功能上、品种上没有任何相关性的产品组合在一起,或形成单件产品,或构成系列,这就是\n出于商业上的需要而进行的强制性的组合。如:在单件产品中有圆珠笔与电子表组合;在系列\n产品中,有电熨斗、电吹风、针线包、指甲钳、梳子等不相干的产品构成的旅游系列。在文\n具系列中这类产品也很多见。将功能上、使用上本不相干的产品,通过系列设计使其具有整\n体目的性和相关性。这类产品的设计,关键是要解决统一性的问题。\na、形式统一如放置方法、包装方法等。\nb、形态统一造型、风格统一。\nc、色彩统一视觉统一。\nd、某个部件统一部件的互换性。\nE、情趣组合\n这类组合方式往往是借用人们希望爱好、祝愿、友谊、幽默、时尚追求等富有人之常情、生\n活情趣的内容,通过形象化的造型,或附加造型的方法,组合到系列产品中去,构成趣味性产\n品系列。情趣系列组合,可以是成套化的,也可以是强制性的。组合的目的就是增加卖点。\n2、变换设计\n通过改变产品要素的设计,即为变换设计,所设计的产品被称为变型产品。这是系列产品设计\n中的常见方法,其目的在于:增强产品功能,提高产品性能、降低成本等。这种方法具有以下", "特点:\nA、适应性强。这类产品的出现,受市场机制的影响,因此,以多变的形式适应不同层面的需求。\nB、快速反应。能针对市场需求快速推出提升功能的换代产品。\nC、低成本。因为是对产品的某个部分的变换,或者说是产品系列中某些部分被模块化,省略\n了重复和共用的部分,可达到降低设计成本和生产成本的目的。\n变换设计应具备以下条件:\n-----通用性。产品部件或单元甚至模块应达到可置换性要。\n-----标准化。标准化是可置换设计的先决条件。标准化含有二层概念:一是产品系列中为达\n到互换目的而建立的标准。二是行业或者国家制定的标准,这对保证产品质量,统一评价技术\n管理,缩短新产品开发周期,利用维修、降低成本等都具有重要意义。\n-----系列化。产品系列化目标与变换设计是相辅相成的。变换设计是在基型产品的基础上\n进行要素变换,可大致分为几类,即,纵向变换,横向变换和多向变换,相似变换及模块化设计\n等。不同类型的产品系列,要采取不同的处理方法。\na、纵向变换设计\n纵向变换设计是通过一组功能相同、属性相同、结构相同或相近,而尺寸规格及性能参数不\n同的产品系列设计,即纵向系列。\nb、横向变换设计，\n横向变换设计是在产品的基本形态上进行功能扩展,派生出多种相同类型产品,所构成的产\n品系列,即横向系列。横向变换设计要点:\n---充分考虑通用部件。\n---考虑可互换部件的位置,留出使用余地。\n---考虑接合部位的合理性。", "c、多向变换设计，\n多向变换设计的主要特征就是以相同性能,或通用部件构成不同类型的产品,并选择产品的\n某些要素,采用增减、置换、重组、颠倒等变换设计,开成一个产品系列族类。多向系列产品\n实际上是一种跨系列的产品族,往往形成家族系列。需要注意的是,多向系列所体现的往往不\n一定是形式上的系列感,而是技术和原理上的共性,有时是通过通用件或模块来实现的。所以,\n在具体设计时要特别注意和解决好基型产品与通用件或模块结合面等结合要素的合理性和\n精确性。\nd、相似变换设计，\n相似变换设计实际上是纵向变换析另一种方式,即是在功能属性、结构等相同的条件下,将其\n形态尺寸、性能参数按一定的比例关系进行变换设计,构成相似系列产品。相似系列设计方\n法对于机电产品设计来说应有相当的严密必,即严格按照相似理论设定相似条件。而对于工\n业设计的相似变化来说,不一定要有如此理性的要求,感性的判断更为重要。前者不仅形态相\n似,而且性能原理的参数也按一定的公比进行变换,而后者往往性能原理参数不变,仅是形态\n上的相似变换。当然,也会有与前者相同的情况。\n相似变换的要点:\n---要根据具体情况确定形态的相似类型,即完全相似与不完全相似。完全相似____产品几何\n形态完全按固定比例变换。不完全相似__由于产品的某些部位出于功能上、使用上的限制,\n无论基本形态如可进行相似变换,该部件固定不变。如手电向的形态按比例进行相似变换,\n但操作开关按钮尺寸保持不变,回为该部位要满足最低的人体工学上的需要。不完全相似的\n情况有时是出于生产工艺上最低要求的限制.\n---基本形态的确定\n相似毓产品不是针对某单件产品的设计,而是首先需要确定基本形态,然后在些基础上进行", "几何计算、作图或凭感觉进行推导。无论是哪一种方式,基型的设计是最重要的。这样,可以\n大提高设计效率。基型推导的思维方式,对于单件产品设计构思也具有重意义,这样可以避免\n漫无边际、跳跃性思维的不确定性和效率,从而通过相似变换的热传导过程寻求最优化。(系\n列旅游用品相似变换设计,三只小熊的调料罐)\n3、模块化设计\n将产品的某些要素组合在一起,构成一个具有特定功能的子系统,将这个子系统作为通用性\n的模块与其它产品要素进行多种组合,构成新的系统,产生多种不同功能或相同功能、不同性\n的系列产品,这就是产品的模块化设计。系列产品中的模块是一种通用件,也可看作是具有一\n定功能的零件、组件或部件。模块应具有特定的接口或结合表面以及结合要素,以便保证模\n块组合的互换性。模块的初始要领源于儿童积木,以一个单元或一组形态进行多种构成,可创\n造出房子、交能工具、动能等丰富的造型,这里的积木就是基本模块,用积木进行多种结构的\n变换就是最基础的模块化原理。实际中的产品相对于积木具有\n以下特点:\n---具有特定的功能\n---具有连接的要素;\n---尺寸模数化。\n纵向模块系统,横向系列模块系统,跨系列模块系统\n4、模块设计\n模块的规划是模块化产品设计中的关键问题。即要在一个产品系统里将哪些功能、哪些部分,\n以怎样的组合方式,怎样的形态,多少数量以及构成模块的以系列相关要素等,进行综合评估,\n并提出方案。\n第五章创新设计方法", "一、沿用设计\n与产品开发设计有所不同,沿用设计即是在已获得成功产品的启发下,沿用他人的经验和成\n果展开设计,前者是经过广泛调查和综合研究,创造性地从天到地进行设计:后者则是对同类\n产品的改良。现实中尽管创新产品层出不穷,但沿用设计的产品却占大多数度。如,电风扇和\n自行车的最初产品和现在的产品作比较,在形式上并无多大差别,其演化过程说明:产品的形\n式或原理,被一直沿用下来。在我们生活的周围,随处可见被沿用设计的产品,尽管可能与最\n初的产品有较大的变化,而这种变化是经过一步一步沿用设计发展而来的。\n模仿设计\n模仿是人类创造活动必不可少的初级阶段,也是涉入新型产品的第一步。现实中,许多独创的\n产品或产品的某个部分往往受专利保护,但其经验、方法却是可以共享的。将别人的智慧转\n化为可以利用的资源,这是社会进步的必然,也是必要的过程。\nA、直接模仿\nB、间接模仿\n2、移植设计\n移植设计类同于模仿设计,但不是简单的模仿。移植设计是沿用已有的技术成果,进行新的目\n的要求下的移植、创造,是移花接木之术。\n3、替代设计\n在产品开发设计中,用某一事物替代另一事物的设计为替代设计。常用的替代设计有:\n材料替代，在工业设计中,常用的基本材料不外乎是金属、塑料、木材及陶瓷。其中任何一\n种材料被其他的材料所替代时,都对设计提出新的要求。零部件替代，在模块化设计中常存\n在零部件的替代问题,但这里的替代不是系列产品的转换而是出于性能改良或工艺优化的目\n的,用其它产品的零部件或重新设计的零部件对原产品进行替换,使之在功能上更趋优化。", "方法替代通过设计,用新的方法代替老的方法,以达到既定功能或其它的目标。不论是出于何\n种理由采取替代的方法,最终的西方世界应该是为了优化实现功能的过程。\n技术替代同样功能的产品,用不同的技术手段去实现,会产生不同的结果。用先进的技术手段\n老爷爷落后的技术手段的目的,往往是为了提高产品品质,降低产品成本,这是不可?蝗而新\n技术的替代必然影响到设计,可以说技术替代也是设计方法的替代。\nD、标准化设计\n标准化设计就是参照国内先进、合理的标准,利用其有价值的部分进行创新设计。各国制定\n的标准或国际标准是以过严格科学验证,具有相当的合理性,也反映了所彩技术的先进性和\n普遍性。采用标准化设计对降低成本、提高劳动生产率、扩大商品市场、加强贸易竞争以及\n迅速将科技成果商品化等,都具重要意义。\nE、集约化设计\n集约化设计是一种常用的重要的设计形式,其实质是归纳和统筹。实际中的产品,有可能是若\n干个或同一个产品的归并,也有可能是系列产品的归整、收纳。无论是哪一种形式,其核心就\n是通过集约化设计,使多样性变为和有序。\n第六章、产品企划、确定概念\n在进入设计程序之前,首先必须解决两个关键性的问题:一是经营方针,二是开发体制。\n产品开发是一个系统的过程,参与项目的部门和代表部门的成员都来自不同专业领域,形成\n了一个集团组织。项目管理项目分工期限，项目管理。项目组构成，开发范围和开发内容研\n讨开发进度，企划概念。市场调查的范围和调查项目研讨，市场调查的实施和分析，调查评\n价和产品范围、用户目标，商品企划、确立设计概念 3 个月造型设计。产品使用环境和使用\n状态分析。\n产品系统构成形式分析", "产品机构和功能研究\n展开设计(构思草图,概念模型)\n设计评价(效果图、外观模型)\n样机制作和综合评价 3 个月\n工艺设计投产。工艺设计。量产化、生产技术研讨\nOEM(Original?Equipment?Manufacturer)选择 3 个月促销。制定促销计划。建立分销点和分\n销谈判。样本广告制作。论证会和研讨会 3 个月公司内部人员、设计师及用户代表、医学专\n家参与。\n产品企划、确定概念\n产品企划是在经营方针下的项目方案的基础上展开的,是整个设计的重要阶段,它完成的优\n劣,将影响设计最终的结果。这个阶段过程和目的及主要方法在图 3?2 中基本反映出来,这\n时的市场调查和产品企划没有必要形成前后关系，也没有必要分工明确或独立行事,两个过\n程可以并列进行,以便不断修正概念,确定产品定位,便于充分考虑、经营、销售、技术等不\n同侧面的问题,使相关部门统一基调,步调一致地进入下一个程序。\n市场调查和分析\n这个阶段要达成以下目标:\n1、探索产品化的可能性\n2、通过对调研结果的分析发现潜在需求;\n3、开成具体的产品面貌:\n4、发现开发中的实际问题点:\n5、把握相关产品的市场倾向;\n6、寻求与同类产品的差别点,以树立本企业特有的产品形象;", "7、寻求商品化的方向和途径。\n市场调查的形式各种各样,关键是要选择能达到目的的手段。基本出发点是能发现重要的需\n求和找到商品化的途径。\n探测消费倾向\n在进入市场调查之前,首先要把握所开发产品的背景情况,即对现时的消费环境要有一个定\n性的分析。\n探测产品需求\n探测市场倾向\n产品构想\n产品概念和企划\n究竟将新产品定位在市场的哪个范围解放前有前途。通过对市场分析的结果进行研究,产品\n发展的方向便逐步清晰起来。接着就要进入实现产品具体形象的企划阶段。\n所谓企划就是为达到目标而提出的构想,并且付诸实施的过程。这里的企划就是对新产品的\n用途、性能功能、形状等未知情况,以及生产方式、产量、流通途径,商品化等未知的条件作\n出决定。"], "cards": [{"q": "绪论：产品设计的过程是系统的是什么？", "a": "产品设计的过程是系统的； 二、现代产品的系统化特征 产品系统设计是从整体上把握过程中各要素间的关系，通过一定的结构形式，使产品 系统达到既定的功能。 产品设计是实现产品系统的过程： 这一过程是由相互作用、相互依赖的若干组成部分结合而成、具有特定作用、达到同一 目的的有机整体，从而形成产品设计系统，其从属于产品系统。", "n": 3}, {"q": "绪论：回忆这一条知识点", "a": "产品信息化 1）产品制造正步入信息化的时代 2）产品的发展方向趋向信息化（多功能化、复合化、短小轻薄化、智能化、精神化） 3）产品开发设计信息化（并行设计的新方法）", "n": 4}, {"q": "绪论：产品系列化 我们通常把相互关联的成组成套的产品称做系列产品是什么？", "a": "产品系列化 我们通常把相互关联的成组成套的产品称做系列产品。有以下几种形式： 1）品牌性系列在一个品牌之下的多种独立的产品。 2）成套系列：由多种独立功能产品组成一个产品系统。 3）单元系列：单元产品之间具有某种相关性和依存关系，构成完整的产品系列。 系列化产品的意义： 1）对于商业的意义：系列产品的开发是提高市场竞争力的重要策略。 2）对于生产的意义： 刚性生产方式：是指传统的固定式自动化生产方式。 柔性生产方式：是指能够灵活多样的小批量生产多种产品的生产方式。", "n": 5}, {"q": "绪论：产品商品化（产品与商品的区别）是什么？", "a": "产品商品化（产品与商品的区别）", "n": 6}, {"q": "绪论：产品生态化是什么？", "a": "产品生态化：把产品这一人造系统与自然生态系统视为命运共同的认识即是产品生态观。 而将这一观念付诸实现的过程就是产品生态化。 绿色产品的基本特征是： 立足于产品或产品的部分可重复使用； 立足于产品或产品的部分可回收翻新多次使用； 产品在使用寿命完结时可安全进行处理。 绿色产品的概念：绿色产品就是在其生命周期全程中，符合特定的环境保护要求，对生态环 境无害或危害极小，资源利用率极高，能源消耗最低的产品。 （系统 产品系统 产品设计系统） （1）定义：系统是由若干要素以一定结构形式联结构成的具有某种功能的有机整体。 （2）核心思想：整体的观念。 要素间的关联性；整体功能不等于局部功能；强目的性；相对性 （3）重点：处理好要素与要素，要素与系统，系统与环境三方面的关系。 （4）发展：贝塔朗菲创立系统论；对事物观测由“实物”为中心转向“系统中” 产品系统的含义：是由若干相互联系的要素构成、具有一定功能的集合体。 （1）二层含义： A 一类产品：由各种品种的产品按一定的类型学分类构成的具有相关功能的系列化产品。 B 一件产品： 一 个与集：产品，设计师 二 种与类：系列化产品 三 因素： 要素：产品实体（部件，元件，构件） 关联事物（功能，形态，色彩，美学） 结构：结构是若干要素相互联系相互作用的关系。 功能：把系统与外部环境之间相互联系和作用过程的秩序和能力称为系统的功能。 包含的关系：个与集；种与类。 一、系统设计方法 将对象实物当作一个完整的系统加以研究，从全局出发，将各组成部分看成子系统或要 素，通过整合，建立起相互之间有机的联系，以及系统和外界环境之间的有机关系。 设计目标和方向 途径 策略手段 运用的工具和手段 为有效运用工具所必需遵循的程序方法 纵向和横向的产品系统 把产品技术、技能、结构、界面、材质、人因、形态等构成因素集成一体的设计观和设计评 价观 二 过程系统 一 O-R-O 模式：即客体，联系，产出的系统模式。 二 串行模式：将设计过程中的各个环节视为系统的要素，而要素之间的构成关系是按一定 顺序进行的，所构成的系统即是串行系统。 三 并行模式：是对产品及相关过程进行集成，并行设计的系统化的设计模式。 功能要素 结构要素 人因要素 形态要素 色彩要素 环境要素 一、功能分析（从需求、功能入手）： A 定义功能：将产品和部件或构成要素的效用加以区分和限定。 方法：语句陈诉法 B 功能分类：需求性质：使用功能、精神功能 重要性：主要功能、附属功能 作用：必要功能、不必要功能 需求满意度：不足功能、过剩功能、适度功能 相互关系：上位功能、下位功能、同位功能 C 功能系统图 从基本功能出发，根据之间目的手段关系建立功能系统骨架。 D 功能整理：目的—手段关系，多余功能、多余部件，验证功能定义。 （2）产品功能设计 具体实现功能目标的设计过程就是功能设计。 一 、 产品结构的含义： 产品要素之间相互作用、联系的方式。 有序性：各要素以矩阵、树形或网络结构规律组合 整体性：各要素无法孤立存在的性质和功能 稳定性：各要素间性能的动态平衡 A 外部结构：外观造型和整体结构。 分：不承担核心功能和承担核心功能结构 B 核心结构：技术原理结构。 C 系统结构：产品与产品之间的关系结构。 分：分体结构、系列结构、网络结构 D 空间结构：产品在空间上（周围环境）的构成关系。 二 、 产品结构的设计要点：整体性 对象：生产者、营销者、使用者、运输者、回收者等。 相关知识：人类工程学、设计心理学、消费心理学 社会属性：社会关系学、文化、宗教、伦理、习俗、价值观、职业性等。 一、形态的概念：一般指事物在一定条件下的表现形式。 二、 形态的分类： 三、形态的意义： 四、形态的表现： 形态的分类 概念形态：在设计基础教学中，通常将空间所规定的形态归结为概念形态。 现实形态：现实形态就是实际存在的形态。", "n": 7}, {"q": "第四节 形态要素：诠释设计的形态 形态与识别 形态与操作 形态与使用 形态与环境 形态与记忆 形态的表现是什么？", "a": "诠释设计的形态 形态与识别 形态与操作 形态与使用 形态与环境 形态与记忆 形态的表现", "n": 12}, {"q": "第四节 形态要素：形态的表现风格是什么？", "a": "形态的表现风格： 功能主义(现代主义)：功能至上 历史主义：尊重传统和地方文化 新现代主义：结构与解构 高技派：高新技术、智能化，概念产品 有机主义：机体主义和生态主义 功能主义 20 世纪 20 年代，现代设计领域的一个重要派别--现代主义设计最终形成。现代主义是主张 设计要适应现代大工业生产和生活需要，以讲求设计功能、技术和经济效益为特征的学派。 其最为重要的理念便是功能主义。功能主义就是要在设计中注重产品的功能性与实用性，即 任何设计都必须保障产品功能及其用途的充分体现，其次才是产品的审美感觉。简而言之， 功能主义就是功能至上。 新现代主义 20 世界 50 年代,以斯堪地那维亚设计为代表的“有机现代主义”流行一时,当进入 60 年代 后,在一些国家和地区出现了一种复兴 20-30 年代的现代主义、追求集合形式构图和机器风 格的所谓“新现代主义(Neo-Modernism)”。新现代主义的出现受到流行的视幻艺术(OP 艺 术)的影响。新现代主义的设计风格与包豪斯有相似之处,他在家居设计中喜欢采用镀铬钢管, 在形态上强调机械化和几何化。 解构主义： 高技派： 高技派（High-Tech）亦称“重技派”。突出当代工业技术成就，并在建筑形体和室内环境 设计中加以炫耀，崇尚“机械美”，在室内暴露梁板、网架等结构构件以及风管、线缆等各 种设备和管道，强调工艺技术与时代感。高技派典型的实例为法国巴黎蓬皮杜国家艺术与文 化中心、香港中国银行等。 技派反对传统的审美观念，强调设计作为信息的媒介和设计的交际功能，在建筑设计、室内 设计中坚持采用新技术，在美学上极力鼓吹表现新技术的作法，包括战后“现代主义建筑” 在设计方法中所有“重理”的方面，以及讲求技术精美和“粗野主义”倾向。 历史主义：文丘里、索特萨斯 有机主义： 有机现代主义是二战后到 20 世纪 60 年代，流行于斯堪的纳维亚国家、美国和意大利等国 的一种现代设计风格，它是对现代主义的继承和发展。这种风格在造型常常体现出“有机” 的自由形态,而不是刻板、冰冷的几何形,无论是在生理还是心理上给使用者以舒适的感受， 而与此同时这些有机造型的设计往往又适合于大规模生产。这标志着现代主义的发展已突破 了正统的包豪斯风格而开始走向“软化”。这种“软化”趋势是与斯堪的纳维设计联系在一 起的,被称为“有机现代主义”。", "n": 13}, {"q": "第四节 形态要素：新的形态表现是什么？", "a": "新的形态表现： 联想的形态 引用的形态 象征的形态 触感的形态 新古典主义 新功能主义 无根源的形态 第六节色彩要素 一、产品色彩的意义 趋于感性化；它的象征作用和情感作用大于形和质，而成本最小。 二、产品色彩设计", "n": 14}, {"q": "第四节 形态要素：色彩与形态是什么？", "a": "色彩与形态： 形色不分；暗示结构", "n": 15}, {"q": "第四节 形态要素：色彩与功能是什么？", "a": "色彩与功能： 功能暗示、以色制（诱）动、象征", "n": 16}, {"q": "第四节 形态要素：色彩与象征 三、色彩管理 一、产品生命周期是什么？", "a": "色彩与象征 三、色彩管理 一、产品生命周期： 投入、规划设计生产、销售使用、维护服务、回收利用各阶段。 二、绿色设计 A 绿色设计：以“绿色技术”为原则所进行的产品设计。 绿色技术：环境友善技术。十减少环境污染或减少原材料、自然资源使用技术、工艺、 产品的总称。 B “3R”原则： reduce：小批量、少面积、节能、（轻薄短小） reuse：部件结构完整、主体可替代、系统性 recycling：资源再生设计 C、绿色产品设计的特点：", "n": 17}, {"q": "第六节 环境要素：绿色产品设计必须是一个并行过程是什么？", "a": "绿色产品设计必须是一个并行过程。", "n": 19}, {"q": "第六节 环境要素：可以使构成产品的零部件和材料得到充分的利用是什么？", "a": "可以使构成产品的零部件和材料得到充分的利用。", "n": 21}, {"q": "第六节 环境要素：可以减轻甚至消除产品生命周期末端的压力是什么？", "a": "可以减轻甚至消除产品生命周期末端的压力。 其它要素 材料要素 对内：支撑和安装的结构及强度、弹性等性能。 对外：质感、光泽、肌理、温度感等。 美学 产品设计的过程系统 产品系统模式 前期准备 产品企划、确定概念 造型设计 设计定案 设计与生产转化 进入市场 一、产品设计的过程系统 （1）从产品战略到市场营销的完整的过程系统： 起点-产品战略-基础研究-市场调查-产品开发-产品设计-技术开发-生产-营销-终点 计划阶段 开发阶段 生产准备阶段 资料收集 调查分析 创造力激发 构思展开、草图、效果图、初步模型 技术分析、细部检查、外观模型 设计图纸、试制、问题分析、 修改、确定方案 试生产 批量生产 生产准备 正式投产 （2）产品设计方法构成： 传统的设计方法把对象分解为互不相干的部分进行研究。 现代产品设计是将对象当作一个整体系统加以认识研究。 产品设计方法系统要素：", "n": 22}, {"q": "第三章 产品系统设计方法及方法：明确设计目标的方法——需求对象的满足是什么？", "a": "明确设计目标的方法——需求对象的满足。", "n": 23}, {"q": "第三章 产品系统设计方法及方法：为达到目的的手段——一条途径与多条途经是什么？", "a": "为达到目的的手段——一条途径与多条途经。", "n": 24}, {"q": "第三章 产品系统设计方法及方法：为达到目的策略——具有原则性的手段是什么？", "a": "为达到目的策略——具有原则性的手段。", "n": 25}, {"q": "第三章 产品系统设计方法及方法：为达到目的工具运用——适当的有效的工具是什么？", "a": "为达到目的工具运用——适当的有效的工具。", "n": 26}, {"q": "第三章 产品系统设计方法及方法：有效的程序方法——必须遵守的运行程序是什么？", "a": "有效的程序方法——必须遵守的运行程序。 现代产品设计系统观念的建立意义在于：将产品设计从实物水平上升到系统水平，建立系统 化、综合化、整体化的设计思维方法。 对产品设计系统观念的建立，要基于以下认识： 产品从设计到生产、到商品化，至使用后的消亡，整个过程如生命周期系统，每一过程 要素都要在同一目的的驱使下从属于产品的循环系统，并且从属于更大的社会系统。 二、产品系统模式： （1）O-R-O 模式（过程易于控制、结果可预见）： （2）串行模式 （过程要素之间按顺序进行，具制约性，易于控制） 顺 顺 串行设计： 开发 →设计 →样品 →试制 →修改 →试生产 →生产。 （3）并行模式： 从产品开发设计一开始就考虑到产品整个生命周期中的各个因素，包括概念的形成、需求的 定位、可行性、进度、生产制造、甚至商品化过程等。 优点：过程含多种要素，具可靠性，易于修正错误 并行设计： 是集成、并进地设计产品及相关的各种过程的系统化工作模式。 并行设计的支撑技术是计算机技术： A．计算机辅助设计：是实现并行设计的前提，具有随机、动态的交互关系，可证明设计的 可行性。 B．逆向工程信息技术：是通过信息技术从模型或实物生成图纸，使产品尽快投入生产。 C．快速出样技术：以 CAD、CAM 技术，采用特定的材料与成型工艺，快速制作实物样品。 D．虚拟产品开发与制造：以计算机仿真、智能推理，虚拟产品制造、使用与消耗过程，具 安全经济与速效性。 产品企划、确定概念 一、市场调查和分析 探测消费倾向 探测产品需求 探测市场倾向 集体创造性思考 二、产品构思及开发定位 三、产品概念和企划 四、设计概念 五、设计概念产品企划定案 产品形式 产品企划书 产品企划评价 5W：who、where、when、why、what 2H：how、how much 设计定案 一、评价过程 营销评价、技术成本评价 二、评价模型 三、商品化 第四章产品系列化设计 一 产品系列化的概念 产品是一个系统,系列产品是一个多极系统,如果说产品是功能的载体,那么产品系列化就是 产品功能的复合化。即在整体目标下,使若干产品功能具有以下特征: A、关联性,系列产品的功能之间具有因果关系和依存关系。 B、独立性,系列产品中的某个功能可独立发挥作用。 C、组合性,系列产品中的不同功能相匹配,产生更强的功能。 D、互换性.系列产品中的功能可以进行互换,以产生不同的功能。 二 系列产品的类型", "n": 27}, {"q": "第三章 产品系统设计方法及方法：成套系列 成套系列即是配套的概念是什么？", "a": "成套系列 成套系列即是配套的概念;以相同功能、不同型号、不同规格的产品构成系列。尽管功能相 同,各个单件的使用频度也不尽相同。但给合在一起可提高产品的适应性,可也满足特定的需 要。另外,因为充分体现了成套意识,可以增加商机。同时成套产品利用收纳,而且整齐美观, 具有良好的视觉效果。", "n": 28}, {"q": "第三章 产品系统设计方法及方法：组合系列 以多个具有独立功能的、不同的产品,组成一个产品系列,即为纵向系列是什么？", "a": "组合系列 以多个具有独立功能的、不同的产品,组成一个产品系列,即为纵向系列。这种系列类型的特 点就是可互换性。因此,要求产品具有一定的模数关系,或某个部分具有模数关系。甚至还要 遵循行业标准或国家标准。由于这类产品遵循标准化、具有可互换性,所以可使产品具有更 好的适应性。因此这类产品往往使可互换部分成为模块,与产品母体相结合,派生出若干系列。", "n": 29}, {"q": "第三章 产品系统设计方法及方法：家族系列 家族系列也具有组合系列的特点,即由独立功能的产品构成系列是什么？", "a": "家族系列 家族系列也具有组合系列的特点,即由独立功能的产品构成系列。但家族系列中的产品,不一 定要求可互换,而且系列中的产品往往是同样的功能,但形态、规格、色彩、材质上不同,这 与成套系列产品又相类似。但产品之间不一定存在功能上的相关性,只有形式上的相关性。 这类产品更具有选择性,更具有商业价值,从而便能产生品牌效应。", "n": 30}, {"q": "第三章 产品系统设计方法及方法：回忆这一条知识点", "a": "单元系列 以不同功能的产品或部件为单元,各单元承担不同的角色,为共同满足整体目标而构成的产 品系列。该系列产品的功能之间不可互换,但有依存关系。这种系列也可以形成家族感,但与 形式上的统一感相比,功能上的配套性更为重要。从使用角度讲,这种系列设计的意义在于体 现功能协同上的可靠性,从商品角度讲,更能体现出品牌效应。 三 系列产品设计方法解析", "n": 31}, {"q": "第三章 产品系统设计方法及方法：回忆这一条知识点", "a": "组合设计 产品是一个系统,其构成要素往往包括功能、用途、原理、形状、规格、材料、色彩、成分 等。系列产品的组合设计就是将某些要素在纵横方向上进行组合或将某个要素进行扩展,构 成更大的产品系统。 A、功能组合， 在单件产品设计中,常会将多种功能部分组合到一个产品中,即所谓多功能产品。这种多功能 化产品的优点是一物多用,而缺点是:对某些功能使用频率不同,又会将多余的功能强加给使 用者,让其承担浪费。(如手机)系列产品的功能组合,是将若干不同功能的产品组成一个系列, 在购买或使用时具有可选择性;在主题上是一个整体,在使用上具有灵活性。(中国的菜刀， 老外的刀具) B、要素组合， 系列产品的实质就是商品要素在某个目标下的系列组合。所谓商品要素,不外乎是功能、用 途、结构、原理、形状、规格、材料等成分,如果将其中的某个要素进行扩展,从纵向上或横 向上进行组合,就可形成系列产品。 C、配套组合， 如果说要素扩展是属于纵向组合方式的话,那配套组合就是要素的横向组合.即,将不同的、 独立的产品作为构成系列的要素进行组合。其目的是:使成套意识带来的品牌效应,有助于商 业上的特定目标的实现。 D、强制组合， 将功能上、品种上没有任何相关性的产品组合在一起,或形成单件产品,或构成系列,这就是 出于商业上的需要而进行的强制性的组合。如:在单件产品中有圆珠笔与电子表组合;在系列 产品中,有电熨斗、电吹风、针线包、指甲钳、梳子等不相干的产品构成的旅游系列。在文 具系列中这类产品也很多见。将功能上、使用上本不相干的产品,通过系列设计使其具有整 体目的性和相关性。这类产品的设计,关键是要解决统一性的问题。 a、形式统一如放置方法、包装方法等。 b、形态统一造型、风格统一。 c、色彩统一视觉统一。 d、某个部件统一部件的互换性。 E、情趣组合 这类组合方式往往是借用人们希望爱好、祝愿、友谊、幽默、时尚追求等富有人之常情、生 活情趣的内容,通过形象化的造型,或附加造型的方法,组合到系列产品中去,构成趣味性产 品系列。情趣系列组合,可以是成套化的,也可以是强制性的。组合的目的就是增加卖点。", "n": 32}, {"q": "第三章 产品系统设计方法及方法：变换设计 通过改变产品要素的设计,即为变换设计,所设计的产品被称为变型产品是什么？", "a": "变换设计 通过改变产品要素的设计,即为变换设计,所设计的产品被称为变型产品。这是系列产品设计 中的常见方法,其目的在于:增强产品功能,提高产品性能、降低成本等。这种方法具有以下 特点: A、适应性强。这类产品的出现,受市场机制的影响,因此,以多变的形式适应不同层面的需求。 B、快速反应。能针对市场需求快速推出提升功能的换代产品。 C、低成本。因为是对产品的某个部分的变换,或者说是产品系列中某些部分被模块化,省略 了重复和共用的部分,可达到降低设计成本和生产成本的目的。 变换设计应具备以下条件: -----通用性。产品部件或单元甚至模块应达到可置换性要。 -----标准化。标准化是可置换设计的先决条件。标准化含有二层概念:一是产品系列中为达 到互换目的而建立的标准。二是行业或者国家制定的标准,这对保证产品质量,统一评价技术 管理,缩短新产品开发周期,利用维修、降低成本等都具有重要意义。 -----系列化。产品系列化目标与变换设计是相辅相成的。变换设计是在基型产品的基础上 进行要素变换,可大致分为几类,即,纵向变换,横向变换和多向变换,相似变换及模块化设计 等。不同类型的产品系列,要采取不同的处理方法。 a、纵向变换设计 纵向变换设计是通过一组功能相同、属性相同、结构相同或相近,而尺寸规格及性能参数不 同的产品系列设计,即纵向系列。 b、横向变换设计， 横向变换设计是在产品的基本形态上进行功能扩展,派生出多种相同类型产品,所构成的产 品系列,即横向系列。横向变换设计要点: ---充分考虑通用部件。 ---考虑可互换部件的位置,留出使用余地。 ---考虑接合部位的合理性。 c、多向变换设计， 多向变换设计的主要特征就是以相同性能,或通用部件构成不同类型的产品,并选择产品的 某些要素,采用增减、置换、重组、颠倒等变换设计,开成一个产品系列族类。多向系列产品 实际上是一种跨系列的产品族,往往形成家族系列。需要注意的是,多向系列所体现的往往不 一定是形式上的系列感,而是技术和原理上的共性,有时是通过通用件或模块来实现的。所以, 在具体设计时要特别注意和解决好基型产品与通用件或模块结合面等结合要素的合理性和 精确性。 d、相似变换设计， 相似变换设计实际上是纵向变换析另一种方式,即是在功能属性、结构等相同的条件下,将其 形态尺寸、性能参数按一定的比例关系进行变换设计,构成相似系列产品。相似系列设计方 法对于机电产品设计来说应有相当的严密必,即严格按照相似理论设定相似条件。而对于工 业设计的相似变化来说,不一定要有如此理性的要求,感性的判断更为重要。前者不仅形态相 似,而且性能原理的参数也按一定的公比进行变换,而后者往往性能原理参数不变,仅是形态 上的相似变换。当然,也会有与前者相同的情况。 相似变换的要点: ---要根据具体情况确定形态的相似类型,即完全相似与不完全相似。完全相似____产品几何 形态完全按固定比例变换。不完全相似__由于产品的某些部位出于功能上、使用上的限制, 无论基本形态如可进行相似变换,该部件固定不变。如手电向的形态按比例进行相似变换, 但操作开关按钮尺寸保持不变,回为该部位要满足最低的人体工学上的需要。不完全相似的 情况有时是出于生产工艺上最低要求的限制. ---基本形态的确定 相似毓产品不是针对某单件产品的设计,而是首先需要确定基本形态,然后在些基础上进行 几何计算、作图或凭感觉进行推导。无论是哪一种方式,基型的设计是最重要的。这样,可以 大提高设计效率。基型推导的思维方式,对于单件产品设计构思也具有重意义,这样可以避免 漫无边际、跳跃性思维的不确定性和效率,从而通过相似变换的热传导过程寻求最优化。(系 列旅游用品相似变换设计,三只小熊的调料罐)", "n": 33}, {"q": "第三章 产品系统设计方法及方法：回忆这一条知识点", "a": "模块化设计 将产品的某些要素组合在一起,构成一个具有特定功能的子系统,将这个子系统作为通用性 的模块与其它产品要素进行多种组合,构成新的系统,产生多种不同功能或相同功能、不同性 的系列产品,这就是产品的模块化设计。系列产品中的模块是一种通用件,也可看作是具有一 定功能的零件、组件或部件。模块应具有特定的接口或结合表面以及结合要素,以便保证模 块组合的互换性。模块的初始要领源于儿童积木,以一个单元或一组形态进行多种构成,可创 造出房子、交能工具、动能等丰富的造型,这里的积木就是基本模块,用积木进行多种结构的 变换就是最基础的模块化原理。实际中的产品相对于积木具有 以下特点: ---具有特定的功能 ---具有连接的要素; ---尺寸模数化。 纵向模块系统,横向系列模块系统,跨系列模块系统", "n": 34}, {"q": "第三章 产品系统设计方法及方法：模块设计 模块的规划是模块化产品设计中的关键问题是什么？", "a": "模块设计 模块的规划是模块化产品设计中的关键问题。即要在一个产品系统里将哪些功能、哪些部分, 以怎样的组合方式,怎样的形态,多少数量以及构成模块的以系列相关要素等,进行综合评估, 并提出方案。 第五章创新设计方法 一、沿用设计 与产品开发设计有所不同,沿用设计即是在已获得成功产品的启发下,沿用他人的经验和成 果展开设计,前者是经过广泛调查和综合研究,创造性地从天到地进行设计:后者则是对同类 产品的改良。现实中尽管创新产品层出不穷,但沿用设计的产品却占大多数度。如,电风扇和 自行车的最初产品和现在的产品作比较,在形式上并无多大差别,其演化过程说明:产品的形 式或原理,被一直沿用下来。在我们生活的周围,随处可见被沿用设计的产品,尽管可能与最 初的产品有较大的变化,而这种变化是经过一步一步沿用设计发展而来的。 模仿设计 模仿是人类创造活动必不可少的初级阶段,也是涉入新型产品的第一步。现实中,许多独创的 产品或产品的某个部分往往受专利保护,但其经验、方法却是可以共享的。将别人的智慧转 化为可以利用的资源,这是社会进步的必然,也是必要的过程。 A、直接模仿 B、间接模仿", "n": 35}, {"q": "第三章 产品系统设计方法及方法：移植设计 移植设计类同于模仿设计,但不是简单的模仿是什么？", "a": "移植设计 移植设计类同于模仿设计,但不是简单的模仿。移植设计是沿用已有的技术成果,进行新的目 的要求下的移植、创造,是移花接木之术。", "n": 36}, {"q": "第三章 产品系统设计方法及方法：替代设计 在产品开发设计中,用某一事物替代另一事物的设计为替代设计是什么？", "a": "替代设计 在产品开发设计中,用某一事物替代另一事物的设计为替代设计。常用的替代设计有: 材料替代，在工业设计中,常用的基本材料不外乎是金属、塑料、木材及陶瓷。其中任何一 种材料被其他的材料所替代时,都对设计提出新的要求。零部件替代，在模块化设计中常存 在零部件的替代问题,但这里的替代不是系列产品的转换而是出于性能改良或工艺优化的目 的,用其它产品的零部件或重新设计的零部件对原产品进行替换,使之在功能上更趋优化。 方法替代通过设计,用新的方法代替老的方法,以达到既定功能或其它的目标。不论是出于何 种理由采取替代的方法,最终的西方世界应该是为了优化实现功能的过程。 技术替代同样功能的产品,用不同的技术手段去实现,会产生不同的结果。用先进的技术手段 老爷爷落后的技术手段的目的,往往是为了提高产品品质,降低产品成本,这是不可?蝗而新 技术的替代必然影响到设计,可以说技术替代也是设计方法的替代。 D、标准化设计 标准化设计就是参照国内先进、合理的标准,利用其有价值的部分进行创新设计。各国制定 的标准或国际标准是以过严格科学验证,具有相当的合理性,也反映了所彩技术的先进性和 普遍性。采用标准化设计对降低成本、提高劳动生产率、扩大商品市场、加强贸易竞争以及 迅速将科技成果商品化等,都具重要意义。 E、集约化设计 集约化设计是一种常用的重要的设计形式,其实质是归纳和统筹。实际中的产品,有可能是若 干个或同一个产品的归并,也有可能是系列产品的归整、收纳。无论是哪一种形式,其核心就 是通过集约化设计,使多样性变为和有序。 第六章、产品企划、确定概念 在进入设计程序之前,首先必须解决两个关键性的问题:一是经营方针,二是开发体制。 产品开发是一个系统的过程,参与项目的部门和代表部门的成员都来自不同专业领域,形成 了一个集团组织。项目管理项目分工期限，项目管理。项目组构成，开发范围和开发内容研 讨开发进度，企划概念。市场调查的范围和调查项目研讨，市场调查的实施和分析，调查评 价和产品范围、用户目标，商品企划、确立设计概念 3 个月造型设计。产品使用环境和使用 状态分析。 产品系统构成形式分析 产品机构和功能研究 展开设计(构思草图,概念模型) 设计评价(效果图、外观模型) 样机制作和综合评价 3 个月 工艺设计投产。工艺设计。量产化、生产技术研讨 OEM(Original?Equipment?Manufacturer)选择 3 个月促销。制定促销计划。建立分销点和分 销谈判。样本广告制作。论证会和研讨会 3 个月公司内部人员、设计师及用户代表、医学专 家参与。 产品企划、确定概念 产品企划是在经营方针下的项目方案的基础上展开的,是整个设计的重要阶段,它完成的优 劣,将影响设计最终的结果。这个阶段过程和目的及主要方法在图 3?2 中基本反映出来,这 时的市场调查和产品企划没有必要形成前后关系，也没有必要分工明确或独立行事,两个过 程可以并列进行,以便不断修正概念,确定产品定位,便于充分考虑、经营、销售、技术等不 同侧面的问题,使相关部门统一基调,步调一致地进入下一个程序。 市场调查和分析 这个阶段要达成以下目标:", "n": 37}, {"q": "第三章 产品系统设计方法及方法：通过对调研结果的分析发现潜在需求是什么？", "a": "通过对调研结果的分析发现潜在需求;", "n": 39}, {"q": "第三章 产品系统设计方法及方法：寻求与同类产品的差别点,以树立本企业特有的产品形象是什么？", "a": "寻求与同类产品的差别点,以树立本企业特有的产品形象;", "n": 43}, {"q": "第三章 产品系统设计方法及方法：寻求商品化的方向和途径是什么？", "a": "寻求商品化的方向和途径。 市场调查的形式各种各样,关键是要选择能达到目的的手段。基本出发点是能发现重要的需 求和找到商品化的途径。 探测消费倾向 在进入市场调查之前,首先要把握所开发产品的背景情况,即对现时的消费环境要有一个定 性的分析。 探测产品需求 探测市场倾向 产品构想 产品概念和企划 究竟将新产品定位在市场的哪个范围解放前有前途。通过对市场分析的结果进行研究,产品 发展的方向便逐步清晰起来。接着就要进入实现产品具体形象的企划阶段。 所谓企划就是为达到目标而提出的构想,并且付诸实施的过程。这里的企划就是对新产品的 用途、性能功能、形状等未知情况,以及生产方式、产量、流通途径,商品化等未知的条件作 出决定。", "n": 44}]}, {"code": "13658", "name": "工业设计史", "file": "工业设计史（13658）(1).pdf", "pages": 5, "pageText": ["工业设计史论\n(13658)知识点\n命题来源: 围绕学科的基本概念、原理、特点、内容。\n答题攻略:\n(1)不能像名词解释那样简单,也不能像论述题那样长篇大论,但需要加以简要扩展。\n(2)答案内容要简明、概括、准确，即得分的关键内容一定要写清楚。\n(3)答案表述要有层次性，列出要点，分点分条作答，不要写成一段:\n(4)如果对于考题内容完全不知道，利用选择题找灵感，找到相近的内容，联系起来进行作\n答。\n知识点 1:简述设计的概念。\n设计是一种有目的的创造性活动，它通过对物质和非物质要素的整合与创新，以满足人们的\n需求和解决问题为目标，同时考虑美观、实用、经济、可持续等多方面因素，创造出具有特\n定功能和价值的产品、环境或服务。\n知识点 2:简述简述设计在人类社会中的重要性。\n设计在人类社会中非常重要。它可以提高生活质量，创造出更舒适、便捷、美观的生活环境\n和产品:推动经济发展，通过创新设计提升产品竞争力，创造商业价值:传承和创新文化，设\n计作品往往反映特定的文化内涵和时代精神;促进可持续发展，通过绿色设计等方式减少对\n环境的影响。\n知识点 3:简述工业设计的概念。\n工业设计是一种以工业产品为主要对象，综合运用科技、艺术、经济等知识，对产品的功能、\n结构、形态、包装等进行整合优化，以创造出满足用户需求、具有市场竞争力的产品的创新\n活动。\n知识点 4:简述中国工业设计的发展现状\n答案:中国工业设计发展迅速，政府越来越重视，出台了一系列支持政策;企业对工业设计的\n认识不断提高，加大了对工业设计的投入:教育体系不断完善，培养了大量的工业设计人才:\n国际交流日益频繁，中国工业设计在国际上的影响力逐渐增强。但与发达国家相比，仍存在\n一定差距，如创新能力不足、品牌建设薄弱等。\n知识点 5:简述第一次工业革命如何促进经济发展。\n第一次工业革命通过蒸汽机等技术的发明和应用,提高了生产效率,使得工业产值迅速增长。\n促进了交通运输的发展，扩大了市场范围，推动了国际贸易的增长。同时，带动了相关产业\n的发展，如煤炭、钢铁等，创造了大量的就业机会，促进了经济的全面发展。\n知识点 6:简述第一次工业革命形成早期设计分工的原因。\n第一次工业革命中，生产规模不断扩大，产品的复杂性增加，技术要求提高。为了提高生产\n效率和产品质量，设计、制造等环节逐渐分离，形成了早期的设计分工。同时，市场需求的\n多样化也促使专业设计师的出现，以满足不同消费者的需求。\n知识点 7:简述韦奇伍德陶瓷工业的发展简史。\n韦奇伍德陶瓷工业由乔赛亚·韦奇伍德创立。他不断创新，发明了新的陶瓷制作工艺，提高\n了陶瓷的质量和生产效率。通过创新设计和优质的产品，韦奇伍德陶瓷迅速打开市场，并积\n极拓展国际市场。在发展过程中，韦奇伍德陶瓷注重品牌建设和广告宣传，成为了世界名的\n陶瓷品牌。\n知识点 8:简述米切尔·托勒家具设计的特点。\n米切尔·托勒的家具设计特点主要包括简约实用、采用新材料、注重功能性和造型简洁。他", "的设计符合当时工业发展的需求，对现代家具设计产生了重要影响。\n知识点 9:简述中国古代手工艺设计成就。\n中国古代手工艺设计成就辉煌。在瓷方面，有众多名窑，资器精美绝伦:丝绸织造工艺高超，\n丝绸产品享誉世界:青铜器铸造技术发达，造型多样且具有深厚的文化内涵;木雕工艺精湛，\n用于建筑装饰和家具制作等;建筑设计独具特色，如故宫等古建筑体现了高超的设计和建造\n水平。\n知识点 10:简述传统设计遗产如何在当下焕发出生机?\n传统设计遗产可以通过创新设计，将传统元素与现代审美相结合，创造出符合当代人需求的\n产品;与现代科技结合，利用新技术提升传统工艺的效率和质量;传承传统工艺，培养传统手\n工艺人才，确保传统技艺得以延续。\n知识点 11:简述“水品宫”因际工业博览会的基本概念。\n“水晶宫”国际工业博览会于 1851 年在英国伦敦举办，目的是展示工业革命的成果。其建\n筑“水品宫”主要由玻璃和钢铁建造而成，采用预制构件，装配速度快，空间宽敞明亮。博\n览会展示了来自多个国家的工业产品，涵盖了机械、纺织、陶瓷等多个领域。\n知识点 12:简述“水品宫”国际工业博览会的影响与意义。\n影响与意义包括推动了工业设计的发展，让人们开始关注产品的外观和功能设计;促进了建\n筑技术的进步，开创了新的建筑形式;引发了对设计美学的思考，促使人们反思工业化生产\n下的设计问题:标志着现代设计的开端，为后来的设计发展奠定了基础:展示了工业化生产的\n成就，促进了各国之间的经济交流和技术合作;推动了设计标准化的进程，提高了生产效率\n和产品质量。\n知识点 13:简述工艺美术运动的基本概念及风格理念。\n工艺美术运动是 19 世纪下半叶起源于英国的一场设计改良运动。其风格理念强调手工艺反\n对机械化生产;主张设计为大众服务，反对精英主义设计:提倡哥特风格等中世纪的设计风格，\n反对维多利亚风格的繁琐装饰:强调自然主义，装饰上推崇自然形态和东方艺术。\n知识点 14:简述工艺美术运动的意义和影响。\n意义:强调了手工艺的价值，提高了手工艺人的地位;推动了设计为大众服务的理念;对工业\n化生产进行了反思，为现代设计的发展奠定了基础。影响:影响了后来的设计运动，如艺术\n运动等;在建筑、室内设计、平面设计等领域产生了许多优秀的作品;促进了设计教育的发展。\n知识点 15:简述新艺术运动的基本概念及风格理念。\n新艺术运动是 19 世纪末 20 世纪初起源于法国并对欧洲和美国产生影响巨大的国际设计运动。\n其风格理念包括:反对大批量的机械化生产，强调手工艺:完全放弃传统装饰风格开创全新的\n自然装饰风格;倡导自然风格，强调自然中不存在直线和平面，装饰上突出表现曲线和有机\n形态;受东方风格尤其是日本江户时期的装饰风格与浮世绘的影响;探索新材料和新技术带\n来的艺术表现的可能性。\n知识点 16:简述新艺术运动与工艺美术运动的联系和差别。\n联系:它们都是对矫饰的维多利亚风格和其它过分装饰风格的反动;都是对工业化风格的强\n烈反映:都旨在重新掀起对传统手工艺的重视和热衷:都放弃传统装饰风格的参照，转向采用\n自然中的一些装饰动机:都受到日本装饰风格的影响(日本江户时期的艺术与装饰风格浮世\n绘)。差别:工艺美术运动重视中世纪哥特风格;新艺术运动完全放弃任何一种传统装饰风格，\n彻底走向自然风格，强调自然中不存在直线、强调自然中没有完全的平面，在装饰上突出表\n现曲线、有机形态。\n知识点 17:简述驱动第二次工业革命的重要技术进步有哪些。\n答案:驱动第二次工业革命的重要技术进步主要包括电力的广泛应用、内燃机的发明和化学\n工业的发展。电力的广泛应用使得各种电器产品得以出现，改变了人们的生活方式;内燃机", "的发明推动了汽车、飞机等交通工具的发展;化学工业的发展为新材料的出现提供了可能。\n知识点 18:简述托马斯·爱迪生对现代电力照明产业的重要贡献\n托马斯·爱迪生对现代电力照明产业的重要贡献包括发明了实用耐用的白炽灯泡，为人们提\n供了高效稳定的照明光源:建立了电力配送系统,使得电力能够广泛应用于照明及其他领域:\n积极推广电灯的使用，推动了电力照明的商业化，改变了人们的生活方式。\n知识点 19:简述俄国构成主义的概念与代表人物及作品。\n俄国构成主义是俄国十月革命后在一批先进的知识分子中产生的前卫艺术运动和设计运动。\n代表人物有塔特林、马列维奇、李西斯基等。塔特林的代表作品是《第三国际纪念塔》，这\n一作品充分体现了构成主义的设计理念，将现代工业材料如钢铁、玻璃等运用到设计中，强\n调空匭璆奾通很和结构的动态感。\n知识点 20:简述荷兰风格派的概念与代表人物及作品。\n荷兰风格派是 1917 年在荷兰出现的几何抽象主义画派，以《风格》杂志为中心。代表人物\n有蒙德里安、里特维尔德、杜斯伯格等。蒙德里安的作品有《红、黄、蓝的构成》，用简单\n的红、黄、蓝三原色和黑、白、灰非色彩系列，通过理性的几何图形和纯粹的色彩组合来表\n达抽象的艺术理念。里特维尔德设计了著名的红蓝椅，将风格派的艺术理念运用到家具设计\n中，以简洁的几何形状和纯粹的色彩构成，展现出独特的现代感。\n知识点 21:简述德意志制造联盟的概念。\n德意志制造联盟成立于 1907 年，是一个由建筑师、设计师、企业家和艺术家等组成的组织。\n其目的是通过艺术、工业和手工艺的结合，提高德国工业产品质量，推动德国现代设计的发\n展。德意志制造联盟强调功能主义、标准化和批量化生产，倡导艺术与工业的结合，对世界\n现代设计的进程产生了深远的影响。\n知识点 22:简述德意志制造联盟的历史意义。\n德意志制造联盟的历史意义主要有以下几点:一是推动了德国现代设计的发展，提高了德国\n工业产品的质量和竞争力:二是促进了艺术与工业的结合，为现代设计的发展奠定了基础:\n三是倡导了标准化和批量化生产，适应了工业化生产的需求;四是影响了世界现代设计的进\n程，为其他国家的现代设计提供了借鉴和启示。\n知识点 23:简述包豪斯的历史意义。\n包豪斯开创了现代设计教育的先河，建立了一套完整的现代设计教育体系。推动了现代主义\n设计的发展，强调功能主义、简洁几何形式和标准化生产，对世界各国的设计教育和设计实\n践产生了深远影响。培养了众多优秀的设计师，他们的设计理念和作品在现代设计史上具有\n重要地位。\n知识点 24:简述装饰艺术运动与现代主义的关系。\n答案:装饰艺术运动与现代主义既有联系又有区别。联系方面，它们都受到工业化的影响都\n积极运用新材料和新技术。区别主要体现在设计理念上，装饰艺术运动更注重装饰，对传统\n装饰有一定的继承:现代主义则强调功能至上，反对过度装饰。此外，装饰艺术运动的风格\n更加奢华和多样化，而现代主义则追求简洁、纯粹的形式。\n知识点 25:简述瑞典早期现代设计代表人物及作品。\n瑞典早期现代设计代表人物有卡尔·马姆斯登等。马姆斯的作品以家具设计为主，他的设计\n风格简洁实用,注重传统工艺与现代功能的结合。他的家具常常采用天然木材,造型优美，具\n有很高的艺术价值。\n知识点 26:简述北欧早期现代设计对世界现代设计的影响\n答案:北欧早期现代设计对世界现代设计产生了深远的影响。一方面，它强调功能主义与传\n统工艺的结合，为现代设计提供了一种新的思路和方法。另一方面，北欧设计注重自然材料\n的运用和人性化设计，使产品更加舒适、美观，这种设计理念在全球范围内得到广泛认可和", "推广。此外，北欧设计的简洁、清新的风格也对世界现代设计产生了积极的影响，成为现代\n设计中的重要风格之一。\n知识点 27:简述推动第三次工业革命的重要技术。\n推动第三次工业革命的重要技术包括信息技术，如电子计算机、互联网等;新能源技术，如\n太阳能、风能等可再生能源技术;生物技术，如基因编辑、生物制药等;新材料技术，如纳米\n材料、碳纤维等。这些技术的发展改变了人们的生活和生产方式,推动了工业产业的变革\n知识点 28:简述半导体晶体管的优势以及如何促进信息产业发展。\n答案:半导体品体管的优势包括体积小、功耗低、可靠性高、响应速度快等。它促进信息产\n业发展主要体现在推动计算机等电子设备小型化、提高性能和降低成本，为互联网、移动通\n信等信息产业的发展奠定了基础。\n知识点 29:简述理性主义设计的概念。\n理性主义设计是一种强调设计应基于理性思考，注重产品功能,遵循科学原理,追求简洁性标\n准化和实用性的设计理念。它往往将设计看作是解决问题的过程，通过合理的设计方法和技\n术手段，实现产品的高效、可靠和易用等目标，而不过分追求装饰性和个人情感的表达。\n知识点 30:简述好设计的十个准则。\n好设计的十个准则通常包括:创新性、功能性、美观性、易性、耐用性、人机工程学、环保\n性、简洁性、适应性、经济性等。但不同的设计师或设计理论可能会有略微不同的表述和侧\n重点。例如，创新性要求设计具有新颖的创意和独特的解决方案;功能性强调产品能有效地\n实现其预定功能:美观性指设计具有良好的视觉效果和审美价值:易性是产品的使用方式和\n信息传达易于被用户理解;耐用性表示产品具有较长的使用寿命;人机工程学关注产品与人\n的生理和心理特征的适配性;环保性要求设计考虑对环境的影响;简洁性体现为设计简洁明\n了，不繁琐;适应性指设计能适应不同的使用场景和用户需求;经济性则涉及产品的成本和性\n价比等方面。\n知识点 31:简述后现代时期的设计产生的历史背景。\n后现代时期的设计产生于 20 世纪 60 年代末 70 年代初,其历史背景主要包括现代主义设计风\n格长期主导导致形式单调，不能适应多元化市场需求和商业竞争:经济发展促使人们对产品\n的需求更加多样化;社会文化趋于多元化，人们对传统设计观念提出质疑，追求个性表达:\n科技的快速发展为设计提供了更多的可能性和新的表现手段等。\n知识点 32:简述文化思潮对设计发展的影响。\n文化思潮对设计发展有着深远的影响。例如后现代主义文化思潮使得设计反对设计形式单一\n主张多样化，关注人性化、人文含义、装饰符号的隐喻性等，促进了设计风格和理念的多元\n化;波普文化思潮让设计追求大众化、通俗化趣味，推动了设计与大众文化的结合，使设计\n更贴近生活和普通民众;孟菲斯设计集团受到当时各种文化思潮的影响，强调装饰性、实验\n性和对传统的突破,为设计带来了新的思路和形式。总之，文化思潮为设计提供了思想源泉、\n创新动力和风格导向，推动着设计不断发展和演变。\n知识点 33:简述计算机辅助工业设计产生的历史背景与特点。\n历史背景:计算机技术的飞速发展为设计提供了新的工具和手段:工业生产的复杂性增加传\n统设计方法难以满足需求;手工绘图效率低下，需要更高效的设计方式。特点:高效性能够快\n速完成设计任务:精确性，可进行精确的尺寸和形态设计;创新性，为设计师提供新的设计思\n路和工具:可视化强，能直观地展示设计效果。\n知识点 34:简述交互设计的概念和起源。\n概念:交互设计是定义、设计人造系统的行为的设计领域，它关注用户与产品之间的互动关\n系，包括用户体验、操作流程、反馈机制等方面。\n起源:交互设计起源于 20 世纪 80 年代,随着计算机技术的发展和用户对产品体验的重视而逐", "渐兴起。当时，人们开始关注软件和电子产品的用户界面设计，逐渐发展成为一个独立的设\n计领域。\n考点 35:简述绿色设计与可持续设计的概念辨析。\n绿色设计强调在产品设计中考虑环境因素，减少对环境的负面影响，主要关注产品的环保性\n能。可持续设计则更广泛地考虑环境、社会和经济三个方面的可持续性，不仅关注产品的环\n保性能，还考虑产品对社会的影响以及经济的可持续发展。可持续设计是一个更全面、更系\n统的设计理念。"], "cards": [{"q": "简述设计的概念。", "a": "设计是一种有目的的创造性活动，它通过对物质和非物质要素的整合与创新，以满足人们的 需求和解决问题为目标，同时考虑美观、实用、经济、可持续等多方面因素，创造出具有特 定功能和价值的产品、环境或服务。", "n": 1}, {"q": "简述简述设计在人类社会中的重要性。", "a": "设计在人类社会中非常重要。它可以提高生活质量，创造出更舒适、便捷、美观的生活环境 和产品:推动经济发展，通过创新设计提升产品竞争力，创造商业价值:传承和创新文化，设 计作品往往反映特定的文化内涵和时代精神;促进可持续发展，通过绿色设计等方式减少对 环境的影响。", "n": 2}, {"q": "简述工业设计的概念。", "a": "工业设计是一种以工业产品为主要对象，综合运用科技、艺术、经济等知识，对产品的功能、 结构、形态、包装等进行整合优化，以创造出满足用户需求、具有市场竞争力的产品的创新 活动。", "n": 3}, {"q": "简述中国工业设计的发展现状", "a": "答案:中国工业设计发展迅速，政府越来越重视，出台了一系列支持政策;企业对工业设计的 认识不断提高，加大了对工业设计的投入:教育体系不断完善，培养了大量的工业设计人才: 国际交流日益频繁，中国工业设计在国际上的影响力逐渐增强。但与发达国家相比，仍存在 一定差距，如创新能力不足、品牌建设薄弱等。", "n": 4}, {"q": "简述第一次工业革命如何促进经济发展。", "a": "第一次工业革命通过蒸汽机等技术的发明和应用,提高了生产效率,使得工业产值迅速增长。 促进了交通运输的发展，扩大了市场范围，推动了国际贸易的增长。同时，带动了相关产业 的发展，如煤炭、钢铁等，创造了大量的就业机会，促进了经济的全面发展。", "n": 5}, {"q": "简述第一次工业革命形成早期设计分工的原因。", "a": "第一次工业革命中，生产规模不断扩大，产品的复杂性增加，技术要求提高。为了提高生产 效率和产品质量，设计、制造等环节逐渐分离，形成了早期的设计分工。同时，市场需求的 多样化也促使专业设计师的出现，以满足不同消费者的需求。", "n": 6}, {"q": "简述韦奇伍德陶瓷工业的发展简史。", "a": "韦奇伍德陶瓷工业由乔赛亚·韦奇伍德创立。他不断创新，发明了新的陶瓷制作工艺，提高 了陶瓷的质量和生产效率。通过创新设计和优质的产品，韦奇伍德陶瓷迅速打开市场，并积 极拓展国际市场。在发展过程中，韦奇伍德陶瓷注重品牌建设和广告宣传，成为了世界名的 陶瓷品牌。", "n": 7}, {"q": "简述米切尔·托勒家具设计的特点。", "a": "米切尔·托勒的家具设计特点主要包括简约实用、采用新材料、注重功能性和造型简洁。他 的设计符合当时工业发展的需求，对现代家具设计产生了重要影响。", "n": 8}, {"q": "简述中国古代手工艺设计成就。", "a": "中国古代手工艺设计成就辉煌。在瓷方面，有众多名窑，资器精美绝伦:丝绸织造工艺高超， 丝绸产品享誉世界:青铜器铸造技术发达，造型多样且具有深厚的文化内涵;木雕工艺精湛， 用于建筑装饰和家具制作等;建筑设计独具特色，如故宫等古建筑体现了高超的设计和建造 水平。", "n": 9}, {"q": "简述传统设计遗产如何在当下焕发出生机?", "a": "传统设计遗产可以通过创新设计，将传统元素与现代审美相结合，创造出符合当代人需求的 产品;与现代科技结合，利用新技术提升传统工艺的效率和质量;传承传统工艺，培养传统手 工艺人才，确保传统技艺得以延续。", "n": 10}, {"q": "简述“水品宫”因际工业博览会的基本概念。", "a": "“水晶宫”国际工业博览会于 1851 年在英国伦敦举办，目的是展示工业革命的成果。其建 筑“水品宫”主要由玻璃和钢铁建造而成，采用预制构件，装配速度快，空间宽敞明亮。博 览会展示了来自多个国家的工业产品，涵盖了机械、纺织、陶瓷等多个领域。", "n": 11}, {"q": "简述“水品宫”国际工业博览会的影响与意义。", "a": "影响与意义包括推动了工业设计的发展，让人们开始关注产品的外观和功能设计;促进了建 筑技术的进步，开创了新的建筑形式;引发了对设计美学的思考，促使人们反思工业化生产 下的设计问题:标志着现代设计的开端，为后来的设计发展奠定了基础:展示了工业化生产的 成就，促进了各国之间的经济交流和技术合作;推动了设计标准化的进程，提高了生产效率 和产品质量。", "n": 12}, {"q": "简述工艺美术运动的基本概念及风格理念。", "a": "工艺美术运动是 19 世纪下半叶起源于英国的一场设计改良运动。其风格理念强调手工艺反 对机械化生产;主张设计为大众服务，反对精英主义设计:提倡哥特风格等中世纪的设计风格， 反对维多利亚风格的繁琐装饰:强调自然主义，装饰上推崇自然形态和东方艺术。", "n": 13}, {"q": "简述工艺美术运动的意义和影响。", "a": "意义:强调了手工艺的价值，提高了手工艺人的地位;推动了设计为大众服务的理念;对工业 化生产进行了反思，为现代设计的发展奠定了基础。影响:影响了后来的设计运动，如艺术 运动等;在建筑、室内设计、平面设计等领域产生了许多优秀的作品;促进了设计教育的发展。", "n": 14}, {"q": "简述新艺术运动的基本概念及风格理念。", "a": "新艺术运动是 19 世纪末 20 世纪初起源于法国并对欧洲和美国产生影响巨大的国际设计运动。 其风格理念包括:反对大批量的机械化生产，强调手工艺:完全放弃传统装饰风格开创全新的 自然装饰风格;倡导自然风格，强调自然中不存在直线和平面，装饰上突出表现曲线和有机 形态;受东方风格尤其是日本江户时期的装饰风格与浮世绘的影响;探索新材料和新技术带 来的艺术表现的可能性。", "n": 15}, {"q": "简述新艺术运动与工艺美术运动的联系和差别。", "a": "联系:它们都是对矫饰的维多利亚风格和其它过分装饰风格的反动;都是对工业化风格的强 烈反映:都旨在重新掀起对传统手工艺的重视和热衷:都放弃传统装饰风格的参照，转向采用 自然中的一些装饰动机:都受到日本装饰风格的影响(日本江户时期的艺术与装饰风格浮世 绘)。差别:工艺美术运动重视中世纪哥特风格;新艺术运动完全放弃任何一种传统装饰风格， 彻底走向自然风格，强调自然中不存在直线、强调自然中没有完全的平面，在装饰上突出表 现曲线、有机形态。", "n": 16}, {"q": "简述驱动第二次工业革命的重要技术进步有哪些。", "a": "答案:驱动第二次工业革命的重要技术进步主要包括电力的广泛应用、内燃机的发明和化学 工业的发展。电力的广泛应用使得各种电器产品得以出现，改变了人们的生活方式;内燃机 的发明推动了汽车、飞机等交通工具的发展;化学工业的发展为新材料的出现提供了可能。", "n": 17}, {"q": "简述托马斯·爱迪生对现代电力照明产业的重要贡献", "a": "托马斯·爱迪生对现代电力照明产业的重要贡献包括发明了实用耐用的白炽灯泡，为人们提 供了高效稳定的照明光源:建立了电力配送系统,使得电力能够广泛应用于照明及其他领域: 积极推广电灯的使用，推动了电力照明的商业化，改变了人们的生活方式。", "n": 18}, {"q": "简述俄国构成主义的概念与代表人物及作品。", "a": "俄国构成主义是俄国十月革命后在一批先进的知识分子中产生的前卫艺术运动和设计运动。 代表人物有塔特林、马列维奇、李西斯基等。塔特林的代表作品是《第三国际纪念塔》，这 一作品充分体现了构成主义的设计理念，将现代工业材料如钢铁、玻璃等运用到设计中，强 调空匭璆奾通很和结构的动态感。", "n": 19}, {"q": "简述荷兰风格派的概念与代表人物及作品。", "a": "荷兰风格派是 1917 年在荷兰出现的几何抽象主义画派，以《风格》杂志为中心。代表人物 有蒙德里安、里特维尔德、杜斯伯格等。蒙德里安的作品有《红、黄、蓝的构成》，用简单 的红、黄、蓝三原色和黑、白、灰非色彩系列，通过理性的几何图形和纯粹的色彩组合来表 达抽象的艺术理念。里特维尔德设计了著名的红蓝椅，将风格派的艺术理念运用到家具设计 中，以简洁的几何形状和纯粹的色彩构成，展现出独特的现代感。", "n": 20}, {"q": "简述德意志制造联盟的概念。", "a": "德意志制造联盟成立于 1907 年，是一个由建筑师、设计师、企业家和艺术家等组成的组织。 其目的是通过艺术、工业和手工艺的结合，提高德国工业产品质量，推动德国现代设计的发 展。德意志制造联盟强调功能主义、标准化和批量化生产，倡导艺术与工业的结合，对世界 现代设计的进程产生了深远的影响。", "n": 21}, {"q": "简述德意志制造联盟的历史意义。", "a": "德意志制造联盟的历史意义主要有以下几点:一是推动了德国现代设计的发展，提高了德国 工业产品的质量和竞争力:二是促进了艺术与工业的结合，为现代设计的发展奠定了基础: 三是倡导了标准化和批量化生产，适应了工业化生产的需求;四是影响了世界现代设计的进 程，为其他国家的现代设计提供了借鉴和启示。", "n": 22}, {"q": "简述包豪斯的历史意义。", "a": "包豪斯开创了现代设计教育的先河，建立了一套完整的现代设计教育体系。推动了现代主义 设计的发展，强调功能主义、简洁几何形式和标准化生产，对世界各国的设计教育和设计实 践产生了深远影响。培养了众多优秀的设计师，他们的设计理念和作品在现代设计史上具有 重要地位。", "n": 23}, {"q": "简述装饰艺术运动与现代主义的关系。", "a": "答案:装饰艺术运动与现代主义既有联系又有区别。联系方面，它们都受到工业化的影响都 积极运用新材料和新技术。区别主要体现在设计理念上，装饰艺术运动更注重装饰，对传统 装饰有一定的继承:现代主义则强调功能至上，反对过度装饰。此外，装饰艺术运动的风格 更加奢华和多样化，而现代主义则追求简洁、纯粹的形式。", "n": 24}, {"q": "简述瑞典早期现代设计代表人物及作品。", "a": "瑞典早期现代设计代表人物有卡尔·马姆斯登等。马姆斯的作品以家具设计为主，他的设计 风格简洁实用,注重传统工艺与现代功能的结合。他的家具常常采用天然木材,造型优美，具 有很高的艺术价值。", "n": 25}, {"q": "简述北欧早期现代设计对世界现代设计的影响", "a": "答案:北欧早期现代设计对世界现代设计产生了深远的影响。一方面，它强调功能主义与传 统工艺的结合，为现代设计提供了一种新的思路和方法。另一方面，北欧设计注重自然材料 的运用和人性化设计，使产品更加舒适、美观，这种设计理念在全球范围内得到广泛认可和 推广。此外，北欧设计的简洁、清新的风格也对世界现代设计产生了积极的影响，成为现代 设计中的重要风格之一。", "n": 26}, {"q": "简述推动第三次工业革命的重要技术。", "a": "推动第三次工业革命的重要技术包括信息技术，如电子计算机、互联网等;新能源技术，如 太阳能、风能等可再生能源技术;生物技术，如基因编辑、生物制药等;新材料技术，如纳米 材料、碳纤维等。这些技术的发展改变了人们的生活和生产方式,推动了工业产业的变革", "n": 27}, {"q": "简述半导体晶体管的优势以及如何促进信息产业发展。", "a": "答案:半导体品体管的优势包括体积小、功耗低、可靠性高、响应速度快等。它促进信息产 业发展主要体现在推动计算机等电子设备小型化、提高性能和降低成本，为互联网、移动通 信等信息产业的发展奠定了基础。", "n": 28}, {"q": "简述理性主义设计的概念。", "a": "理性主义设计是一种强调设计应基于理性思考，注重产品功能,遵循科学原理,追求简洁性标 准化和实用性的设计理念。它往往将设计看作是解决问题的过程，通过合理的设计方法和技 术手段，实现产品的高效、可靠和易用等目标，而不过分追求装饰性和个人情感的表达。", "n": 29}, {"q": "简述好设计的十个准则。", "a": "好设计的十个准则通常包括:创新性、功能性、美观性、易性、耐用性、人机工程学、环保 性、简洁性、适应性、经济性等。但不同的设计师或设计理论可能会有略微不同的表述和侧 重点。例如，创新性要求设计具有新颖的创意和独特的解决方案;功能性强调产品能有效地 实现其预定功能:美观性指设计具有良好的视觉效果和审美价值:易性是产品的使用方式和 信息传达易于被用户理解;耐用性表示产品具有较长的使用寿命;人机工程学关注产品与人 的生理和心理特征的适配性;环保性要求设计考虑对环境的影响;简洁性体现为设计简洁明 了，不繁琐;适应性指设计能适应不同的使用场景和用户需求;经济性则涉及产品的成本和性 价比等方面。", "n": 30}, {"q": "简述后现代时期的设计产生的历史背景。", "a": "后现代时期的设计产生于 20 世纪 60 年代末 70 年代初,其历史背景主要包括现代主义设计风 格长期主导导致形式单调，不能适应多元化市场需求和商业竞争:经济发展促使人们对产品 的需求更加多样化;社会文化趋于多元化，人们对传统设计观念提出质疑，追求个性表达: 科技的快速发展为设计提供了更多的可能性和新的表现手段等。", "n": 31}, {"q": "简述文化思潮对设计发展的影响。", "a": "文化思潮对设计发展有着深远的影响。例如后现代主义文化思潮使得设计反对设计形式单一 主张多样化，关注人性化、人文含义、装饰符号的隐喻性等，促进了设计风格和理念的多元 化;波普文化思潮让设计追求大众化、通俗化趣味，推动了设计与大众文化的结合，使设计 更贴近生活和普通民众;孟菲斯设计集团受到当时各种文化思潮的影响，强调装饰性、实验 性和对传统的突破,为设计带来了新的思路和形式。总之，文化思潮为设计提供了思想源泉、 创新动力和风格导向，推动着设计不断发展和演变。", "n": 32}, {"q": "简述计算机辅助工业设计产生的历史背景与特点。", "a": "历史背景:计算机技术的飞速发展为设计提供了新的工具和手段:工业生产的复杂性增加传 统设计方法难以满足需求;手工绘图效率低下，需要更高效的设计方式。特点:高效性能够快 速完成设计任务:精确性，可进行精确的尺寸和形态设计;创新性，为设计师提供新的设计思 路和工具:可视化强，能直观地展示设计效果。", "n": 33}, {"q": "简述交互设计的概念和起源。", "a": "概念:交互设计是定义、设计人造系统的行为的设计领域，它关注用户与产品之间的互动关 系，包括用户体验、操作流程、反馈机制等方面。 起源:交互设计起源于 20 世纪 80 年代,随着计算机技术的发展和用户对产品体验的重视而逐 渐兴起。当时，人们开始关注软件和电子产品的用户界面设计，逐渐发展成为一个独立的设 计领域。", "n": 34}, {"q": "简述绿色设计与可持续设计的概念辨析。", "a": "绿色设计强调在产品设计中考虑环境因素，减少对环境的负面影响，主要关注产品的环保性 能。可持续设计则更广泛地考虑环境、社会和经济三个方面的可持续性，不仅关注产品的环 保性能，还考虑产品对社会的影响以及经济的可持续发展。可持续设计是一个更全面、更系 统的设计理念。", "n": 35}]}, {"code": "00058", "name": "市场营销学", "file": "市场营销学（00058）(1).pdf", "pages": 14, "pageText": ["第一章 市场营销和营销哲学\n第一节 市场营销的学科性质与相关概念\n1、1912 年，哈佛大学教授赫杰特齐出版了第一本以“市场营销学”命名的教材书，标志着\n市场营销学的诞生。\n2、市场营销的特征：（1）、市场营销不仅仅是销售；（2）、市场营销是让渡价值的 系统流程；\n（3）、市场营销是市场的整体哲学。\n3、在市场营销学中，需要是指人类的基本要求，如为了维持生存所必需的水、食 品、空气\n等。当需要趋向某些特定目标时，就变成了欲望。需求是指对又能购买的某个 具体产品的\n欲望，即需求的构成要素有两个：欲望、购买能力。\n4、交易是指双方之间的价值交换所构成的一种行为。它与交换的区别在于：交换 是一个过\n程，而交易是一种状态或一个事件。\n第二节 市场营销哲学的确立\n1、市场营销哲学也称市场营销导向，是企业在进行市场营销管理的过程中，处理 企业、顾\n客和社会三者利益关系所持的态度、思想和观念。\n2、纵观企业营销实践的历史演进，我们可以发现存在 6 种主要的市场营销哲学： 生产导\n向、产品导向、推销导向、营销导向、顾客导向和社会营销导向。其中，前 3 种 导向是与\n卖方市场条件相适应的传统市场营销哲学，而后 3 种才是现代市场营销哲学的代表。\n3、对于顾客的某种需要，可以划分为 5 个层次：\n（1）、表明了的需要，即顾客明确提出的需要；（2）、真正的需要，即在基本需要中隐 含的\n顾客真正的需要；（3）、未表明的需要，即顾客希望通过其购买行为能够获得的附 加价值；\n（4）、令人愉悦的需要，即顾客期望从其购买经历中获得的一种愉悦的心情；（5）、秘密的\n需要，即顾客期望企业能够像朋友般设身处地地考虑其需要，提供更具针 对性的产品和服\n务。\n4、整合营销是指企业以顾客为中心，整合内部所有资源，以提高顾客的服务水平 和满足程\n度，使所有部门都为满足顾客的利益提供协调一致的服务。\n5、现代市场营销哲学确立的动力：（1）、销售额下降；（2）、增长缓慢；（3）、购 买形式变\n动；（4）、竞争的加剧；（5）、营销费用增长。\n6、现代市场营销哲学面临的阻力：（1）、组织的抵制；（2）、学习缓慢；（3）、迅 速遗忘。\n第三节 市场营销管理流程\n1、市场营销管理的目标就是促进企业目标的实现，其实质是需求管理，因此，市场营销管\n理的任务就是为促进企业目标的实现而对不同的需求状况进行合理的调整。\n2、需求的类型：（1）、负需求。负需求是指绝大多数人对某个产品感到厌恶，甚至愿意出钱\n回避它的一 种需求状况；（2）、无需求。无需求是指目标市场对产品毫无兴趣或漠不关心的\n一种需求状况；（3）、潜在需求。潜在需求是指相当一部分消费者对某物有强烈的渴求，而\n现有产品或 服务又无法使之满足的一种需求状况；（4）、下降需求。下降需求是指市场对一\n个或几个产品的需求呈下降趋势的一种需求状况。（5）、不规则需求。不规则需求是指某些\n物品或服务的市场需求在一年的不同季节，或 一周的不同日子，甚至一天的不同时间段波\n动很大的一种需求状况；（6）、充分需求。充分需求是指某种物品或服务目前的需求水平和\n时间等于预期的需求水平和时间的一种需求状况；（7）、过量需求。过量需求是指某种物品\n或服务的市场需求超过了企业所能供给或所愿 供给的水平的一种需求状况；（8）、有害需求。", "有害需求是指市场对某些有害物品或服务的需求，如烟草等。\n3、市场营销管理的流程：（1）、分析环境和市场机会；（2）、确定目标市场；（3）、 制定营\n销战略和战术；（4）、实施和控制营销活动。\n第四节 市场营销道德与企业社会责任\n1、在具体的营销调研过程中，涉及的道德问题主要有消费者个人隐私保护、数据 的合法获\n取、兑现调研中的馈赠承诺等。\n2、在定价策略中的营销道德问题主要可以归结为价格与产品本身不相匹配，具体 表现有：\n价格欺诈、价格歧视、掠夺性定性、暴力价格。\n3、企业承担社会责任的必然性：首先，承担社会责任是时代环境的客观诉求；其次，承担\n社会责任是企业发展的内在要求；最后，社会责任的相关内容已逐步被列入法 律条款。\n4、企业对股东的社会责任主要包括：（1）、尊重股东的法定权利；（2）、企业行为 应该以保\n障股东的资金安全和收益性为前提；（3）、向股东提供真实的经营和投资信息。\n5、企业对员工的责任主要包括：（1）、为员工提供安全、健康的工作环境；（2）、 为员工提\n供平等的就业、升迁、接受教育的机会；（3）、为员工提供民主参与管理的渠道。\n6、企业对政府的责任表现为：（1）、合法经营、照章纳税；（2）、积极参与政府倡 导的社会\n公益活动、福利和慈善事业，服务社会。\n7、企业承担社会责任的利益：（1）、有利于制定正确的企业使命；（2）、有利于提升企业竞\n争力，获得竞争优势；（3）、有利于销售额和市场份额的增长；（4）、 有利于企业从社会问\n题中发现商机。\n8、企业承担社会责任的风险：（1）、财务风险；（2）、消费者认知风险。\n第二章 关系营销：顾客价值、满意与忠诚\n第一节 顾客让渡价值的实现\n1、顾客让渡价值是顾客总价值与顾客总成本之间的差额，用公式表示为顾客让渡价值=顾客\n总价值-顾客总成本。\n2、顾客总价值是指顾客在购买某种产品或服务时所能获得的一组利益的总和。它是顾客让\n渡价值的重要组成部分，主要包括产品、服务、人员、形象 4 个方面。\n3、顾客总成本是指顾客在挑选和购买某种产品和服务过程中所付出的各种形式的 成本之和，\n主要包括货币、时间、体力、精神 4 个方面。\n第二节 顾客满意与顾客忠诚的测量\n1、顾客满意的测量：（1）、设立投诉与建议系统；（2）、顾客满意度调查；（3）、佯装购物者。\n2、顾客忠诚的测量：（1）、顾客的购买次数和重复购买率；（2）、顾客购买的种类、数量和\n比例；（3）、顾客购买时的挑选时间；（4）、顾客对价格的敏感程度；（5）、顾客对企业产品\n质量事故的包容程度；（6）、顾客对待外部干扰的态度。\n第三节 顾客关系营销\n1、在营销实践中，维系顾客的方法，主要涉及以下 2 个方面：（1）、通过提供高度的顾客\n满意来维系顾客。顾客满意是企业营销活动成功与否的决定性因素，也是企业维系顾客关系\n的重要工具和前提条件；（2）、通过提高转换成本来维系顾客。转换成本是指顾客在转向其\n他企业时所需付出的货币、时间、精力等方面的成本，它可被阻止顾客脱离企业服务关系的\n一种障碍。", "2、美国学者贝利于 1983 年提出了“关系营销”的概念。\n3、关系营销的层次：（1）、基本型关系。基本型关系是关系营销的最低层次，即企业与顾客\n之间只维持最普通的交易关系。这种关系适用于企业顾客众多且单位产品的利润很低的情况；\n（2）、响应型关系。在响应型关系中，企业在达成交易之后。鼓励顾客反馈关于产品满意状\n况或缺陷的信息并据此给出答复，其实质是企业对于顾客要求的被动响应；（3）、责任型关\n系。在责任型关系中，企业的销售人员在产品售出后通过各种方式了解产品是否与顾客的期\n望相吻合，并且从顾客那里征集各种有关产品改进的建议以及顾客对产品的特殊要求，售后\n服务人员会将这些信息反馈给企业，以便企业及时改进。在这种关系中，企业体现出承担责\n任的态度；（4）、主动型关系。企业的销售人员经常通过各种方式与顾客联系、沟通，讨论\n有关改进产品用途或开发新产品的各种建议，向顾客提供改进产品使用的建议，或者向顾客\n提供关于企业新产品的销售，这就是主动型关系。在这种关系中，企业开始主动关注顾客需\n求与其共同探讨满足需求的途径；（5）、伙伴型关系。伙伴型关系是最为高级的关系，企业\n与顾客通过持续合作，建立起相互信任，共同努力使顾客能够更加有效地使用其资金或帮助\n顾客选择更好的行动方式与途径，并按照顾客的要求来设计新产品，推动其关系向更高级状\n态发展。\n4、关系营销的实现策略：（1）、建立财务联系。在这一层次中，企业维持顾客关系的手段主\n要是价格刺激，即通过各种价格手段刺激顾客重复购买；（2）、建立社会联系。它要求企业\n了解顾客的需求并提供个性化的产品和服务，从而与顾客建立良好的互动关系；（3）、建立\n结构性联系。即企业通过与顾客建立结构性和系统性的联系而使双方成为真正意义上的合作\n伙伴。结构性联系的实质是企业通过培养自身不易被竞争对手模仿的核心能力而与顾客建立\n稳定的伙伴关系。这种关系能够稳定的关键，在于它对双方都是有利的，顾客单方面放弃这\n种关系常常会引起自身损失。\n第三章 市场营销调研\n第一节 市场营销调研概述\n1、市场营销信息系统的作用是评估营销决策者的信息需要，通过收集所需要的信息，为营\n销管理人员改进市场营销计划、执行和控制工作提供依据。它包括企业内部报告系统、营销\n情报系统、营销调研系统和营销决策支持系统 4 个子系统。\n2、市场营销调研有 4 种基本类型，分别对应 4 种基本功能，即探索性调研、描述性调研、\n因果性调研和预测性调研。\n3、市场营销调研的流程：（1）、确定市场营销调研主题。市场营销调研主题的确定过程也称\n市场诊断，其主要功能是为后期的市场研究导航。确定主题和调研目标是为了限定调研范围，\n从而能够在最 短的时间内花费最少的费用达到解决问题的目的；（2）、制定调研方案。市场\n营销调研的第二阶段是制定营销调研方案，即对市场营销调 研所要达到的目标进行全方位\n和全过程的计划和设计；（3）、收集市场信息资料。收集市场信息资料是实施市场营销调研\n方案的一个重要环节，其工作量大、成本高、过程复杂、所涉及的市场营销调研方法与手段\n多，是最难控制、最容易出错、最辛苦然而却能最终决定市场营销调研质量与结果的关键；\n（4）、整理与分析市场信息资料。整理市场信息资料就是对大量原始的市场数据进行筛选和\n提炼，使其系统化和条理化。这一过程一般包括 3 个方面的内容：一是信息筛选，二是信\n息整理。三是信息分析。（5）、提出市场营销调研报告。市场营销调研报告的撰写是市场营\n销调研工作的最后阶段，也是整个市场营销工作成果的最终体现。", "第二节 市场调研方法\n1、和一手资料相比，获得二手资料的速度更快，成本更低。\n2、一手资料的收集方法：（1）、观察法。直接观察法具有直接性、客观性、方法简单的特点；\n（2）、深度小组座谈法。深度小组座谈法是指由有选择地邀请 6-10 个人，利用一段时间，\n谈论不同的话题，以某种方式记录座谈内容，营销经理一般会在隔壁装有监视镜头 的观察\n室内进行观察和旁听；（3）、专家调查法。专家调查法的形式多种多样，其中比较流行的方\n法是德尔菲法和头 脑风暴法；（4）、实验法。实验法是指在控制条件下对所研究现象的一个\n或多个因素进行操纵，以 确定这些因素之间的关系，它是因果性调研中经常使用的一种行\n之有效的方法；（5）、行为数据法。行为数据法是指通过商店的扫描数据、分类购买记录和\n顾客数据来 记录顾客的购买行为的方法；（6）、人类学研究法。人类学研究法是指研究者通\n过使用人类学和其他社会科学领域中 的一些概念和工具，对人们的生活与工作方式进行深\n层次了解的一种特殊的观察方法。\n3、调查表的设计和制作一般要经过如下程序：（1）、明确调查的主题；（2）、拟定调查项目；\n（3）、问题设计；（4）、问题排序；（5）、编制调查表的题目、前言、样本特征、结束语、电\n脑编号等；（6）、调查表评估；（7）、调查表的测试；（8）、付印。\n4、企业对消费者内心想法进行定性调研分析的常见方法：（1）、词汇联想；（2）、 投射技术；\n（3）、想象具体化；（4）、品牌拟人化；（5）、梯形上升。\n5、市场接触方式包括邮寄调查表、电话访谈、面对面访问、在线访问。\n第三节 市场需求预测\n1、市场潜量是营销努力或营销费用极大时市场需求的极限。\n2、企业潜量是指企业相对于竞争对手的营销努力增大时，企业需求所能达到的极限。\n3、作为一种认识未来的工具，预测有 3 个显著特点：（1）、科学性；（2）、近似 性；（3）、\n局限性。\n4、市场定性预测法包括： （1）、经验估计预测法。根据市场预测主体的不同，经验估计预\n测法又分为经理人员预 测法、销售人员预测法和专家预测法 3 种。（2）、调查预测法。其\n大致可分为购买者意图调查预测法和市场测试法。\n5、市场定量预测法包括：（1）、最小平方法——直线趋势配合；（2）、时 间序列分析法。经\n常使用的时间序列分析法有按季平均法、加权平均法、移动平均法以 及指数平滑法等；（3）、\n相关分析法；（4）、计量经济模式。\n第四章 市场营销策划\n第一节 市场营销策划概述\n1、市场营销策划是组织或者个人对各类事业或活动决策的谋划、构思和设计活动，即通常\n所说的“4W1H”，也就是预先决定做什么（what）、何时做（when）、哪里做 （where）、由谁\n做（who）、如何做（how）的问题。\n2、市场营销策划的特征：（1）、可行性；（2）、创造性；（3）、预知性；（4）、效益性：（5）、\n权变性。\n3、公司策划是企业营销策划的最高层次，其他层次的营销策划都要围绕公司策划展开。\n第二节 现有业务组合策划\n1、一个战略业务单位应该具有以下 3 个特征：（1）、战略业务单位是一项独立业务或相关\n业务的集合体，但在策划工作上能与企业其 他业务分开而单独作业；（2）、战略业务单位有", "自己的竞争者，在各自领域有现实的或潜在的对手；（3）、战略业务单位有一位经理，负责\n战略计划、利润业绩，并且控制着影响利润的大 多数因素。\n2、波士顿咨询公司模型将公司分为问题类（高增长率，低市场占有率）、明星类（高增长率，\n高市场占有率）、现金牛类（低增长率，高市场占有率）、瘦狗类（低 增长率，低市场占有\n率）四种类型。\n3、波士顿咨询公司和通用电气公司两个业务组合模型对于企业战略的制定有如下 益处：首\n先，它能够帮助管理层人员以更加前瞻性和战略性的方式进行思考；其次，它使管理层人员\n能够更好地理解各个战略业务单位的经济意义；再次，它能够提高管理人员的计划质量，并\n改善战略业务单位与管理层之间的沟通状况； 最后，它有助于管理层确定一系列重大问题，\n如撤销较弱的战略业务单位，或加 强对更有前景的战略业务单位的投资。\n第三节 新业务发展策划\n1、安索夫的产品——市场矩阵根据产品和市场的情况给出了 4 种战略，分别是市场渗透战\n略、市场开发战略、产品开发战略和多角化成长战略，其中前 3 种战略即属于 密集型成长\n战略。\n2、实行市场开发战略有 3 种方法：（1）、寻找尚未购买本公司产品的潜在顾客； （2）、进\n行市场开发；（3）、在当地或国外增加新的销售渠道。\n3、一体化成长战略：（1）、后向一体化战略。后向一体化是指公司通过收购或兼并若干个原\n材料供应商，拥 有属于自己的原材料供应体系；（2）、前向一体化战略。前向一体化战略是\n指收购或兼并下游的批发商、零售商，或者自建销售渠道，实行产销一体化。实行前向一体\n化的目的是促进和控制产品的需求，做好产品销售；（3）、水平一体化战略。水平一体化是\n指与同种类型的其他公司合并，也就是与同行业竞争者联合或者在国外与其他同类公司合资\n生产经营。\n4、多角化成长战略：\n（1）、同心多角化战略。同心多角化是指开发与原有生产技术或战略有协同关系的新产 品，\n以便吸引新的顾客。这一战略的特点是原有产品与新产品基本用途不同，但有着较 强的技\n术关联；（2）、水平多角化战略。水平多角化是指公司利用现有市场，采用不同的技术条件\n和营 销资料来发展新产品、开发新业务；（3）、跨行业多角化战略。跨行业多角化是指公司\n发展与现有生产技术、产品或市场完全无关的新业务。\n第五章 市场营销环境扫描\n第一节 市场营销环境概述\n1、市场营销环境的特征：（1）、客观性；（2）、差异性；（3）、相关性；（4）、动态性。\n2、市场营销与环境的关系：在今天的市场中，企业营销环境与其所处环境的关系已经由单\n向的适应转变为双向的互 动，即营销既要适应环境又要设法影响环境。一方面，企业要适\n应环境中不可改变的因素，制定相应的营销策略并根据其发展趋势及时作出调整；另一方面，\n企业对营销环境具有一定的能动性和反作用，即企业可以通过各种方式（如广告、公共关系\n等）影响和 改变环境中某些可能被改变的因素，使其向有利于企业营销的方向转变，从而\n为企业自身发展创造良好的环境条件。\n第二节 市场营销微观环境\n1、微观营销环境是指对企业营销能力构成直接影响的各种力量，主要由企业外 部的供应商、\n竞争者、社会公众、营销中介、顾客及企业自身所组成，这些因素共同影响着企业的价值创", "造过程。\n2、从 4P 组合的角度出发。营销组合的要素即营销活动所涉及的产品（product）、 价格\n（price）、渠道（place）、促销（promotion）4 个基本变量。\n3、供应商对企业的影响主要涵盖以下几个方面：（1）、供货的稳定性与及时性； （2）、供\n货的价格变动；（3）、供货的质量水平。\n4、菲利普科特勒从顾客需求的角度，将竞争者划分为 4 种类型：（1）、愿望竞争者。愿望\n竞争者是指提供不同产品以满足顾客不同需求的竞争者；（2）、一般竞争者。一般竞争者又\n称平行竞争者、属类竞争者，是指根据不同的产品以满足同一种需求的竞争者，是顾客在决\n定需求的类型之后出现的次一级竞争者；（3）、产品形式竞争者。产品形式竞争者是指满足\n同一需求的产品的不同形式之间的竞争者；（4）、品牌竞争者。品牌竞争者是指满足同一消\n费需求的同种形式产品的不同品牌之间的竞争者。\n第三节 市场营销宏观环境\n1、在研究收入对消费需求的影响时，常使用以下指标：（1）、国内生产总值（GDP）； （2）、\n人均国民收入；（3）、个人收入；（4）、个人可支配收入；（5）、个人可任意支配收入；（6）、\n家庭收入。\n第四节 市场营销环境分析方法\n1、营销环境的机会与威胁：（1）、营销环境机会分析。环境机会是指对企业营销活动富有吸\n引力的领域，并且企业在这个领域内拥有竞争优势。营销环境机会可以从两个方面来分析：\n一是机会给企业带 来的潜在的吸引力（盈利能力）；二是成功的可能性；（2）、营销环境威\n胁分析。环境威胁是指环境中不利于企业营销的因素及其发展趋势， 它们对企业形成挑战，\n对企业的市场地位构成威胁，对环境威胁的分析应从以下两个方面来进行：一是环境威胁对\n企业的影响程度，即威胁出现后给企业带来利益损失的大小；二是环境威胁出现的概率；（3）、\n机会——威胁综合分析。在现实生活中，营销环境中的机会和威胁往往是同时存在的，而且\n在一定条件下，两者可想互转化，从而增加了营销环境分析的复杂性。\n2、【SWOT 分析法是一种综合考虑企业内部条件和外部环境的各种因素而选择最佳营销策略\n的方法。其中，S（strength）是指企业内部的优势，W（weakness） 是指企业内部的劣势，\nO(opportunities)是指企业外部环境的机会，T（threats）是指企业外部环境的威胁。\n第六章 市场竞争战略\n第一节 竞争者识别与选择\n1、影响竞争的 5 种力量：（1）、现有企业间的竞争；（2）、潜在进入者的威胁；（3） 替代\n产品的威胁；（4）、购买者的讨价还价能力；（5）、供应商的讨价还价能力。\n2、根据销售商数量及产品差异程度可以划分出 5 种行业结构类型：（1）、完全垄断：指在\n一定地理范围内，某一行业只有一家企业供应产品或服务。完全 垄断可能由规章法令、专\n利权、许可证、规模经济等因素造成；（2）、完全寡头垄断：也称为无差别寡头垄断，指某\n一行业内少数几家大企业提供的产品或服务占据绝大部分市场，并且顾客认为各企业的产品\n没有差别，对不同的品牌无特殊偏好；（3）、不完全寡头垄断：也称为差别寡头垄断，指某\n一行业内少数几家大企业提供的产品或服务占据绝大部分市场，并且顾客认为各企业的产品\n在质量、性能、款式或服务等 方面存在差异，对某些品牌形成特殊偏好，其他品牌不能替\n代，顾客愿意以高于同类产品的价格购买自己所钟爱的品牌；（4）、垄断竞争：指某一行业\n内有许多企业且其产品在质量、性能、款式和服务等方面有差别，顾客对某些品牌有特殊偏", "好，不同的企业以产品的差异性吸引顾客，开展竞争。 （5）、完全竞争：指某一行业内有\n许多企业且其产品没有差别。从经济学的角度来讲， 纯粹的完全竞争是不存在的。\n3、阿瑟 D 利特尔咨询公司把企业在目标市场的竞争地位分为以下 6 种：（1）、主宰型。这\n类企业控制着其他竞争者的行为，有广泛的战略选择余地；（2）、强壮型。这类企业可以采\n取不会危及其长期地位的独立行动，竞争者的行为难以 撼动其长期地位；（3）、优势型。这\n类企业在特定战略中有较多力量可供利用，有较多机会改善其战略地 位；（4）、防守型。这\n类企业的经营状况令人满意，但其在主宰型企业的控制下生存，改善 地位的机会很少；（5）、\n虚弱型。这类企业的经营状况不能令人满意，但仍然有改善的机会，不改变就会 被迫退出\n市场。（6）、难以生存型。这类企业经营状况很差且没有改善的机会。\n4、从心理状态角度看，竞争中常见的反应类型有以下几种：（1）、从容型竞争者。这类竞争\n者反应不强烈，行动迟缓；（2）、选择型竞争者。这类竞争者只对某些攻击反应强烈，对其\n余竞争行动则不做回应；（3）、强劲型竞争者。这类竞争者对任何方面的进攻都会做出迅速、\n强烈的反应；（4）、随机型竞争者。这类竞争者的反应令人难以捉摸，其在某种特定条件下\n可能做出回应，也可能不会反击，并且无法预料其下一步行动。\n第二节 基本竞争战略\n1、成本领先战略是指企业主要依靠追求规模经济、专有技术和优惠的原材料等因素，以低\n于竞争对手或行业平均水平的成本提供产品或服务，来获得较高利润和较大市场份额。\n2、成本领先战略的实现途径包括以下几种：（1）、实现规模经济；（2）、做好供应 商营销；\n（3）、塑造企业成本文化；（4）、生产技术创新。\n3、企业实施差异化战略有以下优势：首先，差异化同样形成了进入障碍，潜在的进入者要\n与该企业竞争，需要克服这种产品的独特性；其次，由于差异化，顾客对该产品或服务有某\n种程度的偏爱和忠诚，大大降低了顾客对产品价格的敏感性，并增强了企业对顾客的讨价还\n价能力。再次，差异化给企业带来较高的边际收益，降低了企业的总成本，增强了企业对供\n应商的讨价还价能力； 最后，差异化赢得了顾客的偏爱和忠诚，企业在面对替代品威胁时，\n可以处于较为有利的地位。\n4、企业实施差异化战略主要包括以下几种途径：（1）、产品差异化；（2）、 服务差异化；（3）、\n人员差异化；（4）、渠道差异化；（5）、形象差异化。\n5、集中化战略的优势主要表现在：首先，企业可以集中使用自身资源和力量，更好地服务\n于某一特定市场；其次，企业可以避开行业中的各种竞争力量，针对竞争对手最薄弱的环节\n采取行动，如根据消费者不断变化的需求形成产品的差异化优势，或者在为该目标市场的专\n门服务过程中降低成本，形成成本优势，或者兼而有之；最后，集中化战略目标集中、明确，\n经济成果易于评价，战略管理过程易于控制，从而带来管理上的便利。\n第三节 市场竞争战略\n1、菲利普科特勒根据企业的竞争地位，将竞争者分为 4 类：市场领导者、市场挑战者、市\n场跟随者和市场补缺者。\n2、扩大市场总需求的途径：（1）、开发新用户；（2）、开辟新用途；（3）、增加使用量。\n3、市场挑战者的进攻战略包括：（1）、正面进攻；（2）、侧翼进攻；（3）、包围进 攻；（4）、\n迂回进攻；（5）、游击进攻。\n4、市场跟随者有以下 3 种战略可供选择：紧密跟随、距离跟随、选择跟随。\n5、理想的补缺市场具备以下特征： （1）、具备一定的规模和购买力，能够盈利；（2）、具\n备发展潜力；（3）、强大的竞争者对这一市场不感兴趣；（4）、企业具备向这一市场提供优质\n产品或服务的能力和资源；（5）、企业在顾客中建立了良好的声誉，能够抵御竞争者入侵。", "第七章 市场与购买者行为\n第一节 市场构成与类型\n1、市场是一切具有特定的欲望和需求，并且愿意和能够以交换来满足此欲望和需求的潜在\n的和现实的顾客。从这个意义上说，市场包括人口、购买力和购买欲望 3 个基本要素。\n2、与组织市场相比，消费者市场具有以下主要特点：（1）、从交易的商品看，商品的品种多\n样、生命周期较短；商品的专业技术性不强，具有较多的替代品，因而商品的价格需求弹性\n相对较大，即价格变动对需求量的影响较大；（2）、从交易的规模和方式看，消费品市场分\n散、购买者众多、成交频繁，但交易数量 零星；（3）、从市场动态看，购买的流动性强；（4）、\n从购买行为看，消费者的购买行为具有很大程度的可诱导性。\n3、组织市场与消费者市场相比较，主要有如下特点：（1）、购买者地理区域比较集中；（2）、\n购买者的数量少，但是购买规模大；（3）、供求双方关系密切；（4）、需求缺乏弹性；（5）、\n决策过程复杂；（6）、需求波动大；（7）、采购专业化；（8）直接采购；（9）、互惠购买；（10）、\n租赁购买。\n第二节 消费者购买行为\n1、（1）、文化因素。文化因素的影响包括购买者的文化、亚文化和社会阶层对购买行为所 起\n的作用；（2）、个人因素。个人因素主要指消费者行为受其他人特征的影响，特别是受其年\n龄和家庭的生命周期阶段、职业、经济状况、生活方式、个性等因素的影响；（3）、心理因\n素。心理因素也称为个别因素，它包括动机、认知、学习、信念和态度等方面； （4）、社\n会因素。消费者的购买行为也受到社会因素的影响。社会因素包括家庭、相关 群体和社会\n角色地位等。\n2、消费者市场的购买角色：（1）、发起者：指首先提出购买某种产品或服务的人；（2）、影\n响者：指对购买过程提出看法或建议并对最终决策有一定影响的人；（3）决策者：指对购买\n过程起完全或大部分决定作用的人，他可以决定是否买、为何买、如何买、在哪里买等方面\n的问题；（4）、购买者：指具体实施购买行为的人；（5）、使用者：指实际消费或使用产品和\n服务的人。\n3、消费者购买行为类型：（1）、复杂的购买行为；（2）、减少不协调的购买行为；（3）、习惯\n性的购买行为；（4）、寻求多样化的购买行为。\n4、【论述】消费者市场的购买决策流程：（1）、确定需要。确定需要又叫问题认知，是决策\n过程的起点；（2）、信息收集；（3）、方案评价。通过收集信息形成可选择产品的备选方案以\n后，消费者需要对各种方案进行评价；（4）、购买决策；（5）、购后行为。\n第三节 组织市场购买行为\n1、组织市场的购买类型：\n（1）、直接再购买。直接再购买即组织的采购部门根据过去和许多供应商打交道的经验， 从\n供应商名单中选择供货企业，并直接重新订购过去采购的同类产业用品。这是采购情 况中\n最简单的一种，此时的组织购买行为是惯例化的；（2）、修正再购买。修正再购买是指购买\n者为了更好地完成采购工作任务，希望修改产 品规格、价格、其他条件或供应商的情况；（3）、\n新任务购买。新任务购买即组织第一次采购某种产业用品。\n第八章 目标市场分析与选择", "第一节 市场细分\n1、市场细分的作用：（1）、有利于企业发现市场机会；（2）、有利于制定市场营销组合策略；\n（3）、有利于企业发挥竞争优势。\n2、消费者市场的细分变量主要有 4 类，即地理变量、人口变量、心理变量和行为变量，消\n费者市场细分的依据就是决定消费者需求差异的主要变量。\n3、市场细分的方法：（1）、单一变量因素法；（2）、多变量因素组合法；（3）、 系列变量因\n素法。\n第二节 目标市场选择\n1、企业进行市场细分的根本目的在于通过满足目标市场的需求去获取利润，因此对目标市\n场的评价要围绕这一中心而展开。具体来说，可以从 3 个方面考虑，即细分市场的规模与\n发展前景、细分市场的结构吸引力、企业的目标与资源。\n2、目标市场覆盖策略的类型：（1）、无差异营销策略。无差异营销策略，即企业对各个细分\n市场之间的差别不予考虑，而是针对市场的调整共性，力求通过单一产品去获取尽可能多的\n是市场份额的策略；（2）差异性营销策略。差异性营销策略，即企业同时在几个细分市场上\n经营业务，并分别为每一细分市场制定不同营销组合以满足其需求的策略；（3）、集中性营\n销策略。集中性营销策略，即企业集中力量设计生产一种或一类产品， 采用一种营销组合，\n为一个细分市场服务的策略。集中性营销策略主要是适用于资源有 限的小企业或大企业对\n新领域的探索性进入。\n第三节 市场定位\n1、市场定位的本质是向消费者传递一个清晰的形象，从而给消费者提供一个购买 企业产品\n的明确理由。\n2、市场定位的有效条件：（1）、必须对所选定的目标市场有一个清晰认识；（2）、 作为定位\n基础的利益必须为目标消费者所重视；（3）、定位必须有营销组合的支撑；（4）、 定位需要\n实现与消费者的沟通。\n3、市场定位的流程：（1）、分析目标市场的竞争格局；（2）、识别顾客对各种替代品的选择\n依据；（3）、评估顾客追求的利益的相对重要性；（4）、确定竞争产品在重要属性方面的地位；\n（5）、选择竞争优势；（6）、显示竞争优势。\n第九章 产品策略\n第一节 产品概述\n1、产品的层次：（1）、核心产品。核心产品是指向顾客提供的产品的基本效用或利益。它是\n产品最基本的层次，也就是顾客真正要购买的利益和服务； （2）、基础产品。基础产品是\n核心产品借以实现的形式；（3）、期望产品。期望产品是指顾客购买产品时期望的一整套属\n性和条件；（4）、延伸产品。延伸产品是指顾客购买基础产品和期望产品时，附带获得的各\n种利益 的总和；（5）、潜在产品。潜在产品是指现有产品包括附加产品在内的、可能发展成\n为未来最终 产品的潜在状态的产品，预示着该产品最终可能产生的所有利益的增加和改变。\n2、按照耐用性和有形性，产品可以分为非耐用品、耐用品和服务 3 类。从消费者 购买习\n惯的角度考虑，可将产品区分为便利品、选购品、特殊品和非渴求品 4 种类型。\n3、产品的组合的维度主要有 4 个，即一般评估产品组合的四要素：宽度、长度、深度和黏\n性。\n4、产品线延伸决策包括：（1）、产品线向下延伸；（2）、产品线向上延伸；（3）、产品线的双", "向延伸。\n第二节 产品生命周期与新产品开发策略\n1、产品生命周期是指产品从投入市场到退出市场所经历的全部过程，产品生命周期可分导\n入期、成长期、成熟期和衰退期 4 个阶段。这一过程可用曲线来表示，称为产品生命周期\n曲线。\n2、导入期的营销策略包括快速撇脂策略（高价格、高促销）、缓慢撇脂策略（高价格、低促\n销）、快速渗透策略（低价格、高促销）、缓慢渗透策略（低价格、低促销）。\n3、成长期的营销策略包括产品策略、渠道策略、促销策略、价格策略。\n4、新产品开发过程包括 8 个阶段：创意生产、创意筛选、产品概念的发展和测试、营销战\n略发展、商业分析、产品开发、市场测试、商品化。\n5、新产品的采用过程：（1）、知晓。知晓是消费者获得新产品信息的初始阶段。消费者对新\n产品有所觉察，但缺少关于它的信息；（2）、兴趣。在此阶段，消费者受激发，寻找该新产\n品的信息；（3）、评价。评价阶段的消费者考虑试用期内使用该新产品是否明智；（4）、试用。\n在此阶段，消费者小规模使用了该新产品，以改进对其价值的评价；（5）、采用。在此阶段，\n消费者决定经常和全面采用该新产品。\n第三节 产品品牌策略\n1、品牌资产的竞争优势主要体现在以下 5 个方面：（1）、降低了企业的营销成本；（2）、加\n强了企业对中间商的讨价还价能力；（3）、企业可以比竞争对手卖更高的价格；（4）、企业可\n以较容易地开展品牌延伸；（5）、品牌给企业提供了某些保护作用。\n2、品牌策略包括品牌化策略、品牌使用者策略、品牌名称策略、品牌发展策略、 品牌重新\n定位策略。\n第四节 产品的包装策略与服务策略\n1、常见的产品包装策略主要有以下几种：（1）类似包装策略；（2）、差异包装策略；（3）、\n连带式包装策略；（4）、复用式包装策略或多用途包装策略；（5）、等级式包 装策略；（6）、\n赠品式包装策略；（7）、改变包装策略；（8）、开窗式包装策略；（9）、 分量式包装策略；（10）、\n礼品式包装策略。\n2、按照市场供应中服务所占比重的多少，可将服务分成以下 4 种类型：（1）、有形商品伴\n随服务，是指此种商品中附带旨在提高对消费者吸引力的一种或多种 服务；（2）、有形商品\n与服务的结合，是指此种市场提供物中商品和服务的比重相当；（3）、主要服务伴随小物品\n或小服务，是指此类市场提供物主要由一项主要服务和某些附加服务或辅助品构成；（4）、\n纯粹服务，是指此类服务中没有任何有形商品。\n第十章 价格策略\n第一节 定价流程\n1、定价的流程：（1）、选择定价的流程；（2）、分析需求；（3）、估计成本；（4）、 分析竞争\n者；（5）、选择定价方法；（6）、确定最终价格。\n第二节 定价方法\n2、成本导向定价法包括：（1）、成本加成定价法。成本加成定价法是指在产品单位成本的基\n础上，加上一定比例 的预期利润来制定产品的销售价格的定价方法；（2）、目标收益定价法。\n目标收益定价法又称投资收益率定价法，它是在企业投资总额 的基础上，按照目标收益率", "计算价格的定价方法。\n3、需求导向定价法包括：（1）、感知价值定价法。感知价值定价法是指企业根据购买者对产\n品或服务的感知价值 来制定价格；（2）、价值定价法。价值定价法是指企业通过制定低价但\n仍提供高质量的产品或服务以 赢得顾客忠诚；（3）、需求差异定价法。需求差异定价法是指\n根据消费者不同的购买力水平、不同的需 求欲望、不同的审美偏好、对同种产品或服务的\n不同需求强度等，制定不同的价格和收 费方法。\n4、竞争导向定价法包括：（1）、随行就市定价法。随行就市定价法又称通行价格定价法，是\n指企业参照主要竞争 者的价格（或本行业的平均价格水平）来定价；（2）、拍卖定价法。拍\n卖定价法应用十分普遍，其中比较常见的有英式拍卖法和荷兰式 拍卖法；（3）、密封投标定\n价法。密封投标定价法是指买方通过引导卖方之间的竞争以取得同类产品的最低价格的定价\n方法。\n第三节 定价策略\n1、心理定价策略包括：（1）、尾数定价；（2）、整数定价；（3）、声望定价； （4）、习惯定\n价；（5）、招徕定价。\n2、地理定价策略包括：（1）、FOB 原产地定价；（2）、统一交货定价；（3）、分区 定价；（4）、\n基点定价；（5）、运费免收定价。\n3、差别定价策略包括：（1）、顾客细分定价；（2）、产品规格和形象差别定价；（3）、 位置\n差别定价；（4）、时间差别定价；（5）、渠道差别定价。\n4、折扣定价与补贴策略包括：（1）、现金折扣。现金折扣是对能在规定的时间内提前或按时\n付清账款的购买者实行的一种价格折扣。一般规定购买后付清账款的时间期限，以此为据，\n如果提前付清，可以 得到相应的价格优惠；（2）数量折扣。卖方因为买方购买数量大而给\n予的一种价格折扣。可以分为一次性折 扣和累积性（多次）折扣；（3）功能折扣。功能折\n扣也称贸易折扣，是制造商给渠道成员的一种额外折扣，促使 其愿意执行某种市场营销职\n能（如推销、储存、商品再包装、服务等）；（4）、季节折扣。即卖方给那些过季商品或服务\n的一种减价；（5）、补贴。补贴是为了吸引经销商参与到某些项目中而提供的额外补贴，如\n以旧换新 是用旧商品换新商品时的补贴。\n第十一章 渠道策略\n第一节 分销渠道设计\n1、分销渠道的功能：（1）、调研功能；（2）、促销功能；（3）、协议功能；（4）、订货功能；\n（5）、实体分配功能；（6）、融资功能；（7）、付款功能；（8）、承担风险功能；（9）、商品所\n有权转移功能。\n2、按照中间机构级数的多少可以将分销渠道划分为：零级渠道（M-C）、 一级渠道(M-R-C)、\n二级渠道(M-R-W-C)、三级渠道(M-W-J-R-C)和更高层次的分销渠道。按照分销渠道各层次同\n类中间商数目的多少，可以将分为宽分销渠道与窄分销渠道；按照分销渠道的中间环节和层\n次的多少，可以将分销渠道分为短分销渠道和长分销渠道。\n3、分销渠道设计的过程：（1）、对消费者的服务需求水平进行分析；（2）、确定分销渠道的\n目标；（3）、识别主要的渠道选择方案；（4）、对分销渠道的方案进行评估。\n第二节 分销渠道管理\n1、分销渠道冲突的类型：（1）、垂直渠道冲突。垂直渠道冲突是同一分销渠道内不同层次的\n中间商之间的冲突；（2）、水平渠道冲突。水平渠道冲突是同一分销渠道内同一层次的各中", "间商之间的冲突；（3）、多渠道冲突。多渠道冲突是指一个制造商建立了两条或两条以上的\n分销渠道，而 这些分销渠道在向同一市场销售其产品时产生的冲突。\n第三节 市场物流决策\n1、市场物流的内容与功能： 按照活动的发展顺序，市场物流一般包括以下内容：销量预测，\n这是制订生产计划，决定库存水平的基础；按照生产计划采购原材料并收货入库；将原材料\n加工为成品，并验收入库，产品库要将顾客订单与生产活动联系起来，及时掌握库存情况；\n将产品发往销 货单位运至顾客并提供售后服务。目前，市场物流逐渐呈现出产业化、专业\n化、规范化、 网络化、信息化和国际化的发展趋势。它不仅具有转移产品实体、创造地点\n效用的基本功能，而且具备以下优势：（1）、了解顾客价值取向，提升企业价值；（2）、帮助\n企业选 择最佳的渠道设计和网络策略；（3）、有助于企业在销售预测、仓储管理、运输管理、\n原料管理等方面做出正确的运营措施。\n第四节 电子商务营销实践\n1、电子商务营销具有以下特点： 第一、是一种跨越时空的交互式营销；第二、是一种个性\n化、顾客导向的营销；第三、 是一种技术性动态营销。\n2、电子商务营销的基本程序：（1）、电子商务营销调研；（2）、电子商务营销策略制定；（3）、\n电子商务宣传；（4）、电子商务促销；（5）、电子商务风险管理。\n第十二章 整合营销传播策略\n第一节 整合营销传播概述\n1、整合营销传播的特征：第一、追求各种营销传播工具传播清晰、一致的信息，从而极大\n地提升传播效果；第二、营销传播工具的组合以营销传播活动的总成本和效益最优为衡量标\n准，使促销组合的评价标准得以清晰化并易于衡量； 第三、营销传播计划的设计、管理以\n目标受众的需求（包括信息、产品和服务等）和企 业目标为出发点和归宿；第四、整合营\n销传播强调营销传播过程的连续性和一致性，是企业营销组合的有机组成部分。\n2、营销人员在设计和管理一个全新的营销传播组合，或者要对一个低效率的营销传播组合\n进行调整时，就需要了解影响营销传播组合的主要因素并掌握必要的行业经验。这些因素主\n要有：产品市场类型、推式战略和拉式战略、消费者购买行为阶段、产品生命周期阶段及企\n业产品的市场地位等。\n3、整合营销传播的开发流程：（1）、确定传播对象；（2）、决定传播目标；（3）、 设计传播\n信息；（4）、选择传播渠道；（5）、编制促销预算；（6）、促销组合决策；（7）、 管理和协调\n营销传播过程。\n第二节 广告、销售促进与公共关系\n1、企业对广告活动的管理在内容和程序上主要包括确定广告目标、确定广告预算、 设计广\n告信息、选择传播媒体和广告效果评价等。\n2、企业对销售促进的设计和管理在内容和程序上主要包括确定促销目标、选择促销工具、\n制定促销方案、实施和控制促销方案、评价促销效果等。\n第三节 人员销售与直接促销\n1、人员销售管理主要包括对销售人员的招聘、挑选、训练、指导、激励和评价等。\n2、销售人员绩效评估主要包括：确定评估资料的来源，一般包括销售业务报告、 现场观察、", "顾客信件、抱怨及调查等；工作绩效正式评估，通常可采用两种方法，即行业横向比较和个\n人纵向比较。\n3、从本质上看，直接营销就是销售人员通过媒体与顾客或潜在顾客进行的直接沟 通。直接\n营销具有便携性、互动性、可衡量性、时空非限制性等特点。\n4、常见的直接营销形式包括直接邮寄、目录营销、电话营销、电视直销、购物亭营销、电\n子营销和其他媒体营销等。\n第十三章 市场营销组织\n第一节 市场营销组织的发展\n1、市场营销组织的目标：第一，激励营销人员实现营销目标；第二，对市场需求做出快速\n反应；第三，使市场营销效率最大化；第四，代表并维护消费者利益。\n2、营销组织是随着市场营销管理哲学的不断发展演变而来的，总体上经历了单纯的销售部\n门、兼有营销职能的销售部门、独立的营销部门、现代市场营销部门、现代市场营销型企业、\n以过程和结果为基础的公司 6 个阶段。\n第二节 市场营销组织的类型\n1、市场营销组织的模式伴随着市场营销导向的转变不断发生着变化。从营销组织 设计所秉\n承的营销导向来看，营销组织大体上有两种基本模式：一是生产导向型模式； 二是市场导\n向型模式。\n2、营销组织的具体类型：（1）、职能型营销组织；（2）、地理型营销组织；（3）、 产品型营\n销组织；（4）、市场型营销组织。\n第三节 市场营销组织设计\n1、营销组织设计的原则：（1）、战略主导原则；（2）、高效可控原则；（3）、整体 协调原则；\n（4）、责任利对等原则；（5）、管理幅度与层次原则。\n2、营销组织的设计步骤：（1）、分析营销组织环境；（2）、确定组织内部活动；（3）、 建立\n组织职位；（4）、设计组织机构；（5）、配备组织人员；（6）、评价和调整组织。\n第十四章 市场营销控制\n第一节 市场营销控制概述\n1、市场营销控制的特点：第一，市场营销控制具有整体性；第二，市场营销控制具有动态\n性；第三，市场营销控制具有人为性。\n2、市场营销控制的类型主要包括年度计划控制、战略控制、效率控制与盈利能力控制。\n3、市场营销控制的原则：（1）、市场营销控制的目标管理性；（2）、市场营销控制 的及时性；\n（3）、市场营销控制的客观性；（4）、市场营销控制的经济性。\n第二节 市场营销控制的内容与方法\n1、一般而言，企业的年度计划控制应该包括销售分析、市场份额分析、营销费用 —销售额\n分析、财务分析和顾客满意度追踪 5 种方法。\n2、企业进行战略控制主要有两种方法，即营销效益等级评定和营销审计。\n3、企业进行效率控制时经常采用的方法有 4 种：销售队伍效率控制、广告效率控制、销售\n促进效率控制和分销效率控制。\n4、在对市场营销成本进行分析之后，还应该考察以下几个反映企业盈利能力的指标：（1）、", "销售利润率；（2）、资产收益率；（3）、净资产收益率；（4）、资产管理效率。\n5、盈利能力控制的流程：（1）、确定职能性费用；（2）、将职能性费用分配给各个 营销实体；\n（3）、为每个营销渠道编制一张损益表。"], "cards": [{"q": "第一节 市场营销的学科性质与相关概念：回忆这一条知识点", "a": "1912 年，哈佛大学教授赫杰特齐出版了第一本以“市场营销学”命名的教材书，标志着 市场营销学的诞生。", "n": 1}, {"q": "第一节 市场营销的学科性质与相关概念：市场营销的特征是什么？", "a": "市场营销的特征：（1）、市场营销不仅仅是销售；（2）、市场营销是让渡价值的 系统流程； （3）、市场营销是市场的整体哲学。", "n": 2}, {"q": "第一节 市场营销的学科性质与相关概念：在市场营销学中，需要是指人类的基本要求，如为了维持生存所必需的水、食 品、空气 等是什么？", "a": "在市场营销学中，需要是指人类的基本要求，如为了维持生存所必需的水、食 品、空气 等。当需要趋向某些特定目标时，就变成了欲望。需求是指对又能购买的某个 具体产品的 欲望，即需求的构成要素有两个：欲望、购买能力。", "n": 3}, {"q": "第一节 市场营销的学科性质与相关概念：交易是指双方之间的价值交换所构成的一种行为是什么？", "a": "交易是指双方之间的价值交换所构成的一种行为。它与交换的区别在于：交换 是一个过 程，而交易是一种状态或一个事件。", "n": 4}, {"q": "第二节 市场营销哲学的确立：回忆这一条知识点", "a": "市场营销哲学也称市场营销导向，是企业在进行市场营销管理的过程中，处理 企业、顾 客和社会三者利益关系所持的态度、思想和观念。", "n": 5}, {"q": "第二节 市场营销哲学的确立：纵观企业营销实践的历史演进，我们可以发现存在 6 种主要的市场营销哲学是什么？", "a": "纵观企业营销实践的历史演进，我们可以发现存在 6 种主要的市场营销哲学： 生产导 向、产品导向、推销导向、营销导向、顾客导向和社会营销导向。其中，前 3 种 导向是与 卖方市场条件相适应的传统市场营销哲学，而后 3 种才是现代市场营销哲学的代表。", "n": 6}, {"q": "第二节 市场营销哲学的确立：对于顾客的某种需要，可以划分为 5 个层次是什么？", "a": "对于顾客的某种需要，可以划分为 5 个层次： （1）、表明了的需要，即顾客明确提出的需要；（2）、真正的需要，即在基本需要中隐 含的 顾客真正的需要；（3）、未表明的需要，即顾客希望通过其购买行为能够获得的附 加价值； （4）、令人愉悦的需要，即顾客期望从其购买经历中获得的一种愉悦的心情；（5）、秘密的 需要，即顾客期望企业能够像朋友般设身处地地考虑其需要，提供更具针 对性的产品和服 务。", "n": 7}, {"q": "第二节 市场营销哲学的确立：回忆这一条知识点", "a": "整合营销是指企业以顾客为中心，整合内部所有资源，以提高顾客的服务水平 和满足程 度，使所有部门都为满足顾客的利益提供协调一致的服务。", "n": 8}, {"q": "第二节 市场营销哲学的确立：现代市场营销哲学确立的动力是什么？", "a": "现代市场营销哲学确立的动力：（1）、销售额下降；（2）、增长缓慢；（3）、购 买形式变 动；（4）、竞争的加剧；（5）、营销费用增长。", "n": 9}, {"q": "第二节 市场营销哲学的确立：现代市场营销哲学面临的阻力是什么？", "a": "现代市场营销哲学面临的阻力：（1）、组织的抵制；（2）、学习缓慢；（3）、迅 速遗忘。", "n": 10}, {"q": "第三节 市场营销管理流程：回忆这一条知识点", "a": "市场营销管理的目标就是促进企业目标的实现，其实质是需求管理，因此，市场营销管 理的任务就是为促进企业目标的实现而对不同的需求状况进行合理的调整。", "n": 11}, {"q": "第三节 市场营销管理流程：需求的类型是什么？", "a": "需求的类型：（1）、负需求。负需求是指绝大多数人对某个产品感到厌恶，甚至愿意出钱 回避它的一 种需求状况；（2）、无需求。无需求是指目标市场对产品毫无兴趣或漠不关心的 一种需求状况；（3）、潜在需求。潜在需求是指相当一部分消费者对某物有强烈的渴求，而 现有产品或 服务又无法使之满足的一种需求状况；（4）、下降需求。下降需求是指市场对一 个或几个产品的需求呈下降趋势的一种需求状况。（5）、不规则需求。不规则需求是指某些 物品或服务的市场需求在一年的不同季节，或 一周的不同日子，甚至一天的不同时间段波 动很大的一种需求状况；（6）、充分需求。充分需求是指某种物品或服务目前的需求水平和 时间等于预期的需求水平和时间的一种需求状况；（7）、过量需求。过量需求是指某种物品 或服务的市场需求超过了企业所能供给或所愿 供给的水平的一种需求状况；（8）、有害需求。 有害需求是指市场对某些有害物品或服务的需求，如烟草等。", "n": 12}, {"q": "第三节 市场营销管理流程：市场营销管理的流程是什么？", "a": "市场营销管理的流程：（1）、分析环境和市场机会；（2）、确定目标市场；（3）、 制定营 销战略和战术；（4）、实施和控制营销活动。", "n": 13}, {"q": "第四节 市场营销道德与企业社会责任：回忆这一条知识点", "a": "在具体的营销调研过程中，涉及的道德问题主要有消费者个人隐私保护、数据 的合法获 取、兑现调研中的馈赠承诺等。", "n": 14}, {"q": "第四节 市场营销道德与企业社会责任：在定价策略中的营销道德问题主要可以归结为价格与产品本身不相匹配，具体 表现有是什么？", "a": "在定价策略中的营销道德问题主要可以归结为价格与产品本身不相匹配，具体 表现有： 价格欺诈、价格歧视、掠夺性定性、暴力价格。", "n": 15}, {"q": "第四节 市场营销道德与企业社会责任：企业承担社会责任的必然性是什么？", "a": "企业承担社会责任的必然性：首先，承担社会责任是时代环境的客观诉求；其次，承担 社会责任是企业发展的内在要求；最后，社会责任的相关内容已逐步被列入法 律条款。", "n": 16}, {"q": "第四节 市场营销道德与企业社会责任：企业对股东的社会责任主要包括是什么？", "a": "企业对股东的社会责任主要包括：（1）、尊重股东的法定权利；（2）、企业行为 应该以保 障股东的资金安全和收益性为前提；（3）、向股东提供真实的经营和投资信息。", "n": 17}, {"q": "第四节 市场营销道德与企业社会责任：企业对员工的责任主要包括是什么？", "a": "企业对员工的责任主要包括：（1）、为员工提供安全、健康的工作环境；（2）、 为员工提 供平等的就业、升迁、接受教育的机会；（3）、为员工提供民主参与管理的渠道。", "n": 18}, {"q": "第四节 市场营销道德与企业社会责任：企业对政府的责任表现为是什么？", "a": "企业对政府的责任表现为：（1）、合法经营、照章纳税；（2）、积极参与政府倡 导的社会 公益活动、福利和慈善事业，服务社会。", "n": 19}, {"q": "第四节 市场营销道德与企业社会责任：企业承担社会责任的利益是什么？", "a": "企业承担社会责任的利益：（1）、有利于制定正确的企业使命；（2）、有利于提升企业竞 争力，获得竞争优势；（3）、有利于销售额和市场份额的增长；（4）、 有利于企业从社会问 题中发现商机。", "n": 20}, {"q": "第四节 市场营销道德与企业社会责任：企业承担社会责任的风险是什么？", "a": "企业承担社会责任的风险：（1）、财务风险；（2）、消费者认知风险。", "n": 21}, {"q": "第一节 顾客让渡价值的实现：回忆这一条知识点", "a": "顾客让渡价值是顾客总价值与顾客总成本之间的差额，用公式表示为顾客让渡价值=顾客 总价值-顾客总成本。", "n": 22}, {"q": "第一节 顾客让渡价值的实现：顾客总价值是指顾客在购买某种产品或服务时所能获得的一组利益的总和是什么？", "a": "顾客总价值是指顾客在购买某种产品或服务时所能获得的一组利益的总和。它是顾客让 渡价值的重要组成部分，主要包括产品、服务、人员、形象 4 个方面。", "n": 23}, {"q": "第一节 顾客让渡价值的实现：回忆这一条知识点", "a": "顾客总成本是指顾客在挑选和购买某种产品和服务过程中所付出的各种形式的 成本之和， 主要包括货币、时间、体力、精神 4 个方面。", "n": 24}, {"q": "第二节 顾客满意与顾客忠诚的测量：顾客满意的测量是什么？", "a": "顾客满意的测量：（1）、设立投诉与建议系统；（2）、顾客满意度调查；（3）、佯装购物者。", "n": 25}, {"q": "第二节 顾客满意与顾客忠诚的测量：顾客忠诚的测量是什么？", "a": "顾客忠诚的测量：（1）、顾客的购买次数和重复购买率；（2）、顾客购买的种类、数量和 比例；（3）、顾客购买时的挑选时间；（4）、顾客对价格的敏感程度；（5）、顾客对企业产品 质量事故的包容程度；（6）、顾客对待外部干扰的态度。", "n": 26}, {"q": "第三节 顾客关系营销：在营销实践中，维系顾客的方法，主要涉及以下 2 个方面是什么？", "a": "在营销实践中，维系顾客的方法，主要涉及以下 2 个方面：（1）、通过提供高度的顾客 满意来维系顾客。顾客满意是企业营销活动成功与否的决定性因素，也是企业维系顾客关系 的重要工具和前提条件；（2）、通过提高转换成本来维系顾客。转换成本是指顾客在转向其 他企业时所需付出的货币、时间、精力等方面的成本，它可被阻止顾客脱离企业服务关系的 一种障碍。", "n": 27}, {"q": "第三节 顾客关系营销：美国学者贝利于 1983 年提出了“关系营销”的概念是什么？", "a": "美国学者贝利于 1983 年提出了“关系营销”的概念。", "n": 28}, {"q": "第三节 顾客关系营销：关系营销的层次是什么？", "a": "关系营销的层次：（1）、基本型关系。基本型关系是关系营销的最低层次，即企业与顾客 之间只维持最普通的交易关系。这种关系适用于企业顾客众多且单位产品的利润很低的情况； （2）、响应型关系。在响应型关系中，企业在达成交易之后。鼓励顾客反馈关于产品满意状 况或缺陷的信息并据此给出答复，其实质是企业对于顾客要求的被动响应；（3）、责任型关 系。在责任型关系中，企业的销售人员在产品售出后通过各种方式了解产品是否与顾客的期 望相吻合，并且从顾客那里征集各种有关产品改进的建议以及顾客对产品的特殊要求，售后 服务人员会将这些信息反馈给企业，以便企业及时改进。在这种关系中，企业体现出承担责 任的态度；（4）、主动型关系。企业的销售人员经常通过各种方式与顾客联系、沟通，讨论 有关改进产品用途或开发新产品的各种建议，向顾客提供改进产品使用的建议，或者向顾客 提供关于企业新产品的销售，这就是主动型关系。在这种关系中，企业开始主动关注顾客需 求与其共同探讨满足需求的途径；（5）、伙伴型关系。伙伴型关系是最为高级的关系，企业 与顾客通过持续合作，建立起相互信任，共同努力使顾客能够更加有效地使用其资金或帮助 顾客选择更好的行动方式与途径，并按照顾客的要求来设计新产品，推动其关系向更高级状 态发展。", "n": 29}, {"q": "第三节 顾客关系营销：关系营销的实现策略是什么？", "a": "关系营销的实现策略：（1）、建立财务联系。在这一层次中，企业维持顾客关系的手段主 要是价格刺激，即通过各种价格手段刺激顾客重复购买；（2）、建立社会联系。它要求企业 了解顾客的需求并提供个性化的产品和服务，从而与顾客建立良好的互动关系；（3）、建立 结构性联系。即企业通过与顾客建立结构性和系统性的联系而使双方成为真正意义上的合作 伙伴。结构性联系的实质是企业通过培养自身不易被竞争对手模仿的核心能力而与顾客建立 稳定的伙伴关系。这种关系能够稳定的关键，在于它对双方都是有利的，顾客单方面放弃这 种关系常常会引起自身损失。", "n": 30}, {"q": "第一节 市场营销调研概述：回忆这一条知识点", "a": "市场营销信息系统的作用是评估营销决策者的信息需要，通过收集所需要的信息，为营 销管理人员改进市场营销计划、执行和控制工作提供依据。它包括企业内部报告系统、营销 情报系统、营销调研系统和营销决策支持系统 4 个子系统。", "n": 31}, {"q": "第一节 市场营销调研概述：回忆这一条知识点", "a": "市场营销调研有 4 种基本类型，分别对应 4 种基本功能，即探索性调研、描述性调研、 因果性调研和预测性调研。", "n": 32}, {"q": "第一节 市场营销调研概述：市场营销调研的流程是什么？", "a": "市场营销调研的流程：（1）、确定市场营销调研主题。市场营销调研主题的确定过程也称 市场诊断，其主要功能是为后期的市场研究导航。确定主题和调研目标是为了限定调研范围， 从而能够在最 短的时间内花费最少的费用达到解决问题的目的；（2）、制定调研方案。市场 营销调研的第二阶段是制定营销调研方案，即对市场营销调 研所要达到的目标进行全方位 和全过程的计划和设计；（3）、收集市场信息资料。收集市场信息资料是实施市场营销调研 方案的一个重要环节，其工作量大、成本高、过程复杂、所涉及的市场营销调研方法与手段 多，是最难控制、最容易出错、最辛苦然而却能最终决定市场营销调研质量与结果的关键； （4）、整理与分析市场信息资料。整理市场信息资料就是对大量原始的市场数据进行筛选和 提炼，使其系统化和条理化。这一过程一般包括 3 个方面的内容：一是信息筛选，二是信 息整理。三是信息分析。（5）、提出市场营销调研报告。市场营销调研报告的撰写是市场营 销调研工作的最后阶段，也是整个市场营销工作成果的最终体现。", "n": 33}, {"q": "第二节 市场调研方法：和一手资料相比，获得二手资料的速度更快，成本更低是什么？", "a": "和一手资料相比，获得二手资料的速度更快，成本更低。", "n": 34}, {"q": "第二节 市场调研方法：一手资料的收集方法是什么？", "a": "一手资料的收集方法：（1）、观察法。直接观察法具有直接性、客观性、方法简单的特点； （2）、深度小组座谈法。深度小组座谈法是指由有选择地邀请 6-10 个人，利用一段时间， 谈论不同的话题，以某种方式记录座谈内容，营销经理一般会在隔壁装有监视镜头 的观察 室内进行观察和旁听；（3）、专家调查法。专家调查法的形式多种多样，其中比较流行的方 法是德尔菲法和头 脑风暴法；（4）、实验法。实验法是指在控制条件下对所研究现象的一个 或多个因素进行操纵，以 确定这些因素之间的关系，它是因果性调研中经常使用的一种行 之有效的方法；（5）、行为数据法。行为数据法是指通过商店的扫描数据、分类购买记录和 顾客数据来 记录顾客的购买行为的方法；（6）、人类学研究法。人类学研究法是指研究者通 过使用人类学和其他社会科学领域中 的一些概念和工具，对人们的生活与工作方式进行深 层次了解的一种特殊的观察方法。", "n": 35}, {"q": "第二节 市场调研方法：调查表的设计和制作一般要经过如下程序是什么？", "a": "调查表的设计和制作一般要经过如下程序：（1）、明确调查的主题；（2）、拟定调查项目； （3）、问题设计；（4）、问题排序；（5）、编制调查表的题目、前言、样本特征、结束语、电 脑编号等；（6）、调查表评估；（7）、调查表的测试；（8）、付印。", "n": 36}, {"q": "第二节 市场调研方法：企业对消费者内心想法进行定性调研分析的常见方法是什么？", "a": "企业对消费者内心想法进行定性调研分析的常见方法：（1）、词汇联想；（2）、 投射技术； （3）、想象具体化；（4）、品牌拟人化；（5）、梯形上升。", "n": 37}, {"q": "第二节 市场调研方法：市场接触方式包括邮寄调查表、电话访谈、面对面访问、在线访问是什么？", "a": "市场接触方式包括邮寄调查表、电话访谈、面对面访问、在线访问。", "n": 38}, {"q": "第三节 市场需求预测：市场潜量是营销努力或营销费用极大时市场需求的极限是什么？", "a": "市场潜量是营销努力或营销费用极大时市场需求的极限。", "n": 39}, {"q": "第三节 市场需求预测：企业潜量是指企业相对于竞争对手的营销努力增大时，企业需求所能达到的极限是什么？", "a": "企业潜量是指企业相对于竞争对手的营销努力增大时，企业需求所能达到的极限。", "n": 40}, {"q": "第三节 市场需求预测：作为一种认识未来的工具，预测有 3 个显著特点是什么？", "a": "作为一种认识未来的工具，预测有 3 个显著特点：（1）、科学性；（2）、近似 性；（3）、 局限性。", "n": 41}, {"q": "第三节 市场需求预测：市场定性预测法包括是什么？", "a": "市场定性预测法包括： （1）、经验估计预测法。根据市场预测主体的不同，经验估计预 测法又分为经理人员预 测法、销售人员预测法和专家预测法 3 种。（2）、调查预测法。其 大致可分为购买者意图调查预测法和市场测试法。", "n": 42}, {"q": "第三节 市场需求预测：市场定量预测法包括是什么？", "a": "市场定量预测法包括：（1）、最小平方法——直线趋势配合；（2）、时 间序列分析法。经 常使用的时间序列分析法有按季平均法、加权平均法、移动平均法以 及指数平滑法等；（3）、 相关分析法；（4）、计量经济模式。", "n": 43}, {"q": "第一节 市场营销策划概述：回忆这一条知识点", "a": "市场营销策划是组织或者个人对各类事业或活动决策的谋划、构思和设计活动，即通常 所说的“4W1H”，也就是预先决定做什么（what）、何时做（when）、哪里做 （where）、由谁 做（who）、如何做（how）的问题。", "n": 44}, {"q": "第一节 市场营销策划概述：市场营销策划的特征是什么？", "a": "市场营销策划的特征：（1）、可行性；（2）、创造性；（3）、预知性；（4）、效益性：（5）、 权变性。", "n": 45}, {"q": "第一节 市场营销策划概述：公司策划是企业营销策划的最高层次，其他层次的营销策划都要围绕公司策划展开是什么？", "a": "公司策划是企业营销策划的最高层次，其他层次的营销策划都要围绕公司策划展开。", "n": 46}, {"q": "第二节 现有业务组合策划：一个战略业务单位应该具有以下 3 个特征是什么？", "a": "一个战略业务单位应该具有以下 3 个特征：（1）、战略业务单位是一项独立业务或相关 业务的集合体，但在策划工作上能与企业其 他业务分开而单独作业；（2）、战略业务单位有 自己的竞争者，在各自领域有现实的或潜在的对手；（3）、战略业务单位有一位经理，负责 战略计划、利润业绩，并且控制着影响利润的大 多数因素。", "n": 47}, {"q": "第二节 现有业务组合策划：回忆这一条知识点", "a": "波士顿咨询公司模型将公司分为问题类（高增长率，低市场占有率）、明星类（高增长率， 高市场占有率）、现金牛类（低增长率，高市场占有率）、瘦狗类（低 增长率，低市场占有 率）四种类型。", "n": 48}, {"q": "第二节 现有业务组合策划：波士顿咨询公司和通用电气公司两个业务组合模型对于企业战略的制定有如下 益处是什么？", "a": "波士顿咨询公司和通用电气公司两个业务组合模型对于企业战略的制定有如下 益处：首 先，它能够帮助管理层人员以更加前瞻性和战略性的方式进行思考；其次，它使管理层人员 能够更好地理解各个战略业务单位的经济意义；再次，它能够提高管理人员的计划质量，并 改善战略业务单位与管理层之间的沟通状况； 最后，它有助于管理层确定一系列重大问题， 如撤销较弱的战略业务单位，或加 强对更有前景的战略业务单位的投资。", "n": 49}, {"q": "第三节 新业务发展策划：回忆这一条知识点", "a": "安索夫的产品——市场矩阵根据产品和市场的情况给出了 4 种战略，分别是市场渗透战 略、市场开发战略、产品开发战略和多角化成长战略，其中前 3 种战略即属于 密集型成长 战略。", "n": 50}, {"q": "第三节 新业务发展策划：实行市场开发战略有 3 种方法是什么？", "a": "实行市场开发战略有 3 种方法：（1）、寻找尚未购买本公司产品的潜在顾客； （2）、进 行市场开发；（3）、在当地或国外增加新的销售渠道。", "n": 51}, {"q": "第三节 新业务发展策划：一体化成长战略是什么？", "a": "一体化成长战略：（1）、后向一体化战略。后向一体化是指公司通过收购或兼并若干个原 材料供应商，拥 有属于自己的原材料供应体系；（2）、前向一体化战略。前向一体化战略是 指收购或兼并下游的批发商、零售商，或者自建销售渠道，实行产销一体化。实行前向一体 化的目的是促进和控制产品的需求，做好产品销售；（3）、水平一体化战略。水平一体化是 指与同种类型的其他公司合并，也就是与同行业竞争者联合或者在国外与其他同类公司合资 生产经营。", "n": 52}, {"q": "第三节 新业务发展策划：多角化成长战略是什么？", "a": "多角化成长战略： （1）、同心多角化战略。同心多角化是指开发与原有生产技术或战略有协同关系的新产 品， 以便吸引新的顾客。这一战略的特点是原有产品与新产品基本用途不同，但有着较 强的技 术关联；（2）、水平多角化战略。水平多角化是指公司利用现有市场，采用不同的技术条件 和营 销资料来发展新产品、开发新业务；（3）、跨行业多角化战略。跨行业多角化是指公司 发展与现有生产技术、产品或市场完全无关的新业务。", "n": 53}, {"q": "第一节 市场营销环境概述：市场营销环境的特征是什么？", "a": "市场营销环境的特征：（1）、客观性；（2）、差异性；（3）、相关性；（4）、动态性。", "n": 54}, {"q": "第一节 市场营销环境概述：市场营销与环境的关系是什么？", "a": "市场营销与环境的关系：在今天的市场中，企业营销环境与其所处环境的关系已经由单 向的适应转变为双向的互 动，即营销既要适应环境又要设法影响环境。一方面，企业要适 应环境中不可改变的因素，制定相应的营销策略并根据其发展趋势及时作出调整；另一方面， 企业对营销环境具有一定的能动性和反作用，即企业可以通过各种方式（如广告、公共关系 等）影响和 改变环境中某些可能被改变的因素，使其向有利于企业营销的方向转变，从而 为企业自身发展创造良好的环境条件。", "n": 55}, {"q": "第二节 市场营销微观环境：回忆这一条知识点", "a": "微观营销环境是指对企业营销能力构成直接影响的各种力量，主要由企业外 部的供应商、 竞争者、社会公众、营销中介、顾客及企业自身所组成，这些因素共同影响着企业的价值创 造过程。", "n": 56}, {"q": "第二节 市场营销微观环境：从 4P 组合的角度出发是什么？", "a": "从 4P 组合的角度出发。营销组合的要素即营销活动所涉及的产品（product）、 价格 （price）、渠道（place）、促销（promotion）4 个基本变量。", "n": 57}, {"q": "第二节 市场营销微观环境：供应商对企业的影响主要涵盖以下几个方面是什么？", "a": "供应商对企业的影响主要涵盖以下几个方面：（1）、供货的稳定性与及时性； （2）、供 货的价格变动；（3）、供货的质量水平。", "n": 58}, {"q": "第二节 市场营销微观环境：菲利普科特勒从顾客需求的角度，将竞争者划分为 4 种类型是什么？", "a": "菲利普科特勒从顾客需求的角度，将竞争者划分为 4 种类型：（1）、愿望竞争者。愿望 竞争者是指提供不同产品以满足顾客不同需求的竞争者；（2）、一般竞争者。一般竞争者又 称平行竞争者、属类竞争者，是指根据不同的产品以满足同一种需求的竞争者，是顾客在决 定需求的类型之后出现的次一级竞争者；（3）、产品形式竞争者。产品形式竞争者是指满足 同一需求的产品的不同形式之间的竞争者；（4）、品牌竞争者。品牌竞争者是指满足同一消 费需求的同种形式产品的不同品牌之间的竞争者。", "n": 59}, {"q": "第三节 市场营销宏观环境：在研究收入对消费需求的影响时，常使用以下指标是什么？", "a": "在研究收入对消费需求的影响时，常使用以下指标：（1）、国内生产总值（GDP）； （2）、 人均国民收入；（3）、个人收入；（4）、个人可支配收入；（5）、个人可任意支配收入；（6）、 家庭收入。", "n": 60}, {"q": "第四节 市场营销环境分析方法：营销环境的机会与威胁是什么？", "a": "营销环境的机会与威胁：（1）、营销环境机会分析。环境机会是指对企业营销活动富有吸 引力的领域，并且企业在这个领域内拥有竞争优势。营销环境机会可以从两个方面来分析： 一是机会给企业带 来的潜在的吸引力（盈利能力）；二是成功的可能性；（2）、营销环境威 胁分析。环境威胁是指环境中不利于企业营销的因素及其发展趋势， 它们对企业形成挑战， 对企业的市场地位构成威胁，对环境威胁的分析应从以下两个方面来进行：一是环境威胁对 企业的影响程度，即威胁出现后给企业带来利益损失的大小；二是环境威胁出现的概率；（3）、 机会——威胁综合分析。在现实生活中，营销环境中的机会和威胁往往是同时存在的，而且 在一定条件下，两者可想互转化，从而增加了营销环境分析的复杂性。", "n": 61}, {"q": "第四节 市场营销环境分析方法：回忆这一条知识点", "a": "【SWOT 分析法是一种综合考虑企业内部条件和外部环境的各种因素而选择最佳营销策略 的方法。其中，S（strength）是指企业内部的优势，W（weakness） 是指企业内部的劣势， O(opportunities)是指企业外部环境的机会，T（threats）是指企业外部环境的威胁。", "n": 62}, {"q": "第一节 竞争者识别与选择：影响竞争的 5 种力量是什么？", "a": "影响竞争的 5 种力量：（1）、现有企业间的竞争；（2）、潜在进入者的威胁；（3） 替代 产品的威胁；（4）、购买者的讨价还价能力；（5）、供应商的讨价还价能力。", "n": 63}, {"q": "第一节 竞争者识别与选择：根据销售商数量及产品差异程度可以划分出 5 种行业结构类型是什么？", "a": "根据销售商数量及产品差异程度可以划分出 5 种行业结构类型：（1）、完全垄断：指在 一定地理范围内，某一行业只有一家企业供应产品或服务。完全 垄断可能由规章法令、专 利权、许可证、规模经济等因素造成；（2）、完全寡头垄断：也称为无差别寡头垄断，指某 一行业内少数几家大企业提供的产品或服务占据绝大部分市场，并且顾客认为各企业的产品 没有差别，对不同的品牌无特殊偏好；（3）、不完全寡头垄断：也称为差别寡头垄断，指某 一行业内少数几家大企业提供的产品或服务占据绝大部分市场，并且顾客认为各企业的产品 在质量、性能、款式或服务等 方面存在差异，对某些品牌形成特殊偏好，其他品牌不能替 代，顾客愿意以高于同类产品的价格购买自己所钟爱的品牌；（4）、垄断竞争：指某一行业 内有许多企业且其产品在质量、性能、款式和服务等方面有差别，顾客对某些品牌有特殊偏 好，不同的企业以产品的差异性吸引顾客，开展竞争。 （5）、完全竞争：指某一行业内有 许多企业且其产品没有差别。从经济学的角度来讲， 纯粹的完全竞争是不存在的。", "n": 64}, {"q": "第一节 竞争者识别与选择：阿瑟 D 利特尔咨询公司把企业在目标市场的竞争地位分为以下 6 种是什么？", "a": "阿瑟 D 利特尔咨询公司把企业在目标市场的竞争地位分为以下 6 种：（1）、主宰型。这 类企业控制着其他竞争者的行为，有广泛的战略选择余地；（2）、强壮型。这类企业可以采 取不会危及其长期地位的独立行动，竞争者的行为难以 撼动其长期地位；（3）、优势型。这 类企业在特定战略中有较多力量可供利用，有较多机会改善其战略地 位；（4）、防守型。这 类企业的经营状况令人满意，但其在主宰型企业的控制下生存，改善 地位的机会很少；（5）、 虚弱型。这类企业的经营状况不能令人满意，但仍然有改善的机会，不改变就会 被迫退出 市场。（6）、难以生存型。这类企业经营状况很差且没有改善的机会。", "n": 65}, {"q": "第一节 竞争者识别与选择：从心理状态角度看，竞争中常见的反应类型有以下几种是什么？", "a": "从心理状态角度看，竞争中常见的反应类型有以下几种：（1）、从容型竞争者。这类竞争 者反应不强烈，行动迟缓；（2）、选择型竞争者。这类竞争者只对某些攻击反应强烈，对其 余竞争行动则不做回应；（3）、强劲型竞争者。这类竞争者对任何方面的进攻都会做出迅速、 强烈的反应；（4）、随机型竞争者。这类竞争者的反应令人难以捉摸，其在某种特定条件下 可能做出回应，也可能不会反击，并且无法预料其下一步行动。", "n": 66}, {"q": "第二节 基本竞争战略：回忆这一条知识点", "a": "成本领先战略是指企业主要依靠追求规模经济、专有技术和优惠的原材料等因素，以低 于竞争对手或行业平均水平的成本提供产品或服务，来获得较高利润和较大市场份额。", "n": 67}, {"q": "第二节 基本竞争战略：成本领先战略的实现途径包括以下几种是什么？", "a": "成本领先战略的实现途径包括以下几种：（1）、实现规模经济；（2）、做好供应 商营销； （3）、塑造企业成本文化；（4）、生产技术创新。", "n": 68}, {"q": "第二节 基本竞争战略：企业实施差异化战略有以下优势是什么？", "a": "企业实施差异化战略有以下优势：首先，差异化同样形成了进入障碍，潜在的进入者要 与该企业竞争，需要克服这种产品的独特性；其次，由于差异化，顾客对该产品或服务有某 种程度的偏爱和忠诚，大大降低了顾客对产品价格的敏感性，并增强了企业对顾客的讨价还 价能力。再次，差异化给企业带来较高的边际收益，降低了企业的总成本，增强了企业对供 应商的讨价还价能力； 最后，差异化赢得了顾客的偏爱和忠诚，企业在面对替代品威胁时， 可以处于较为有利的地位。", "n": 69}, {"q": "第二节 基本竞争战略：企业实施差异化战略主要包括以下几种途径是什么？", "a": "企业实施差异化战略主要包括以下几种途径：（1）、产品差异化；（2）、 服务差异化；（3）、 人员差异化；（4）、渠道差异化；（5）、形象差异化。", "n": 70}, {"q": "第二节 基本竞争战略：集中化战略的优势主要表现在是什么？", "a": "集中化战略的优势主要表现在：首先，企业可以集中使用自身资源和力量，更好地服务 于某一特定市场；其次，企业可以避开行业中的各种竞争力量，针对竞争对手最薄弱的环节 采取行动，如根据消费者不断变化的需求形成产品的差异化优势，或者在为该目标市场的专 门服务过程中降低成本，形成成本优势，或者兼而有之；最后，集中化战略目标集中、明确， 经济成果易于评价，战略管理过程易于控制，从而带来管理上的便利。", "n": 71}, {"q": "第三节 市场竞争战略：菲利普科特勒根据企业的竞争地位，将竞争者分为 4 类是什么？", "a": "菲利普科特勒根据企业的竞争地位，将竞争者分为 4 类：市场领导者、市场挑战者、市 场跟随者和市场补缺者。", "n": 72}, {"q": "第三节 市场竞争战略：扩大市场总需求的途径是什么？", "a": "扩大市场总需求的途径：（1）、开发新用户；（2）、开辟新用途；（3）、增加使用量。", "n": 73}, {"q": "第三节 市场竞争战略：市场挑战者的进攻战略包括是什么？", "a": "市场挑战者的进攻战略包括：（1）、正面进攻；（2）、侧翼进攻；（3）、包围进 攻；（4）、 迂回进攻；（5）、游击进攻。", "n": 74}, {"q": "第三节 市场竞争战略：市场跟随者有以下 3 种战略可供选择是什么？", "a": "市场跟随者有以下 3 种战略可供选择：紧密跟随、距离跟随、选择跟随。", "n": 75}, {"q": "第三节 市场竞争战略：理想的补缺市场具备以下特征是什么？", "a": "理想的补缺市场具备以下特征： （1）、具备一定的规模和购买力，能够盈利；（2）、具 备发展潜力；（3）、强大的竞争者对这一市场不感兴趣；（4）、企业具备向这一市场提供优质 产品或服务的能力和资源；（5）、企业在顾客中建立了良好的声誉，能够抵御竞争者入侵。", "n": 76}, {"q": "第一节 市场构成与类型：回忆这一条知识点", "a": "市场是一切具有特定的欲望和需求，并且愿意和能够以交换来满足此欲望和需求的潜在 的和现实的顾客。从这个意义上说，市场包括人口、购买力和购买欲望 3 个基本要素。", "n": 77}, {"q": "第一节 市场构成与类型：与组织市场相比，消费者市场具有以下主要特点是什么？", "a": "与组织市场相比，消费者市场具有以下主要特点：（1）、从交易的商品看，商品的品种多 样、生命周期较短；商品的专业技术性不强，具有较多的替代品，因而商品的价格需求弹性 相对较大，即价格变动对需求量的影响较大；（2）、从交易的规模和方式看，消费品市场分 散、购买者众多、成交频繁，但交易数量 零星；（3）、从市场动态看，购买的流动性强；（4）、 从购买行为看，消费者的购买行为具有很大程度的可诱导性。", "n": 78}, {"q": "第一节 市场构成与类型：组织市场与消费者市场相比较，主要有如下特点是什么？", "a": "组织市场与消费者市场相比较，主要有如下特点：（1）、购买者地理区域比较集中；（2）、 购买者的数量少，但是购买规模大；（3）、供求双方关系密切；（4）、需求缺乏弹性；（5）、 决策过程复杂；（6）、需求波动大；（7）、采购专业化；（8）直接采购；（9）、互惠购买；（10）、 租赁购买。", "n": 79}, {"q": "第二节 消费者购买行为：（1）、文化因素是什么？", "a": "（1）、文化因素。文化因素的影响包括购买者的文化、亚文化和社会阶层对购买行为所 起 的作用；（2）、个人因素。个人因素主要指消费者行为受其他人特征的影响，特别是受其年 龄和家庭的生命周期阶段、职业、经济状况、生活方式、个性等因素的影响；（3）、心理因 素。心理因素也称为个别因素，它包括动机、认知、学习、信念和态度等方面； （4）、社 会因素。消费者的购买行为也受到社会因素的影响。社会因素包括家庭、相关 群体和社会 角色地位等。", "n": 80}, {"q": "第二节 消费者购买行为：消费者市场的购买角色是什么？", "a": "消费者市场的购买角色：（1）、发起者：指首先提出购买某种产品或服务的人；（2）、影 响者：指对购买过程提出看法或建议并对最终决策有一定影响的人；（3）决策者：指对购买 过程起完全或大部分决定作用的人，他可以决定是否买、为何买、如何买、在哪里买等方面 的问题；（4）、购买者：指具体实施购买行为的人；（5）、使用者：指实际消费或使用产品和 服务的人。", "n": 81}, {"q": "第二节 消费者购买行为：消费者购买行为类型是什么？", "a": "消费者购买行为类型：（1）、复杂的购买行为；（2）、减少不协调的购买行为；（3）、习惯 性的购买行为；（4）、寻求多样化的购买行为。", "n": 82}, {"q": "第二节 消费者购买行为：【论述】消费者市场的购买决策流程是什么？", "a": "【论述】消费者市场的购买决策流程：（1）、确定需要。确定需要又叫问题认知，是决策 过程的起点；（2）、信息收集；（3）、方案评价。通过收集信息形成可选择产品的备选方案以 后，消费者需要对各种方案进行评价；（4）、购买决策；（5）、购后行为。", "n": 83}, {"q": "第三节 组织市场购买行为：组织市场的购买类型是什么？", "a": "组织市场的购买类型： （1）、直接再购买。直接再购买即组织的采购部门根据过去和许多供应商打交道的经验， 从 供应商名单中选择供货企业，并直接重新订购过去采购的同类产业用品。这是采购情 况中 最简单的一种，此时的组织购买行为是惯例化的；（2）、修正再购买。修正再购买是指购买 者为了更好地完成采购工作任务，希望修改产 品规格、价格、其他条件或供应商的情况；（3）、 新任务购买。新任务购买即组织第一次采购某种产业用品。", "n": 84}, {"q": "第一节 市场细分：市场细分的作用是什么？", "a": "市场细分的作用：（1）、有利于企业发现市场机会；（2）、有利于制定市场营销组合策略； （3）、有利于企业发挥竞争优势。", "n": 85}, {"q": "第一节 市场细分：回忆这一条知识点", "a": "消费者市场的细分变量主要有 4 类，即地理变量、人口变量、心理变量和行为变量，消 费者市场细分的依据就是决定消费者需求差异的主要变量。", "n": 86}, {"q": "第一节 市场细分：市场细分的方法是什么？", "a": "市场细分的方法：（1）、单一变量因素法；（2）、多变量因素组合法；（3）、 系列变量因 素法。", "n": 87}, {"q": "第二节 目标市场选择：回忆这一条知识点", "a": "企业进行市场细分的根本目的在于通过满足目标市场的需求去获取利润，因此对目标市 场的评价要围绕这一中心而展开。具体来说，可以从 3 个方面考虑，即细分市场的规模与 发展前景、细分市场的结构吸引力、企业的目标与资源。", "n": 88}, {"q": "第二节 目标市场选择：目标市场覆盖策略的类型是什么？", "a": "目标市场覆盖策略的类型：（1）、无差异营销策略。无差异营销策略，即企业对各个细分 市场之间的差别不予考虑，而是针对市场的调整共性，力求通过单一产品去获取尽可能多的 是市场份额的策略；（2）差异性营销策略。差异性营销策略，即企业同时在几个细分市场上 经营业务，并分别为每一细分市场制定不同营销组合以满足其需求的策略；（3）、集中性营 销策略。集中性营销策略，即企业集中力量设计生产一种或一类产品， 采用一种营销组合， 为一个细分市场服务的策略。集中性营销策略主要是适用于资源有 限的小企业或大企业对 新领域的探索性进入。", "n": 89}, {"q": "第三节 市场定位：回忆这一条知识点", "a": "市场定位的本质是向消费者传递一个清晰的形象，从而给消费者提供一个购买 企业产品 的明确理由。", "n": 90}, {"q": "第三节 市场定位：市场定位的有效条件是什么？", "a": "市场定位的有效条件：（1）、必须对所选定的目标市场有一个清晰认识；（2）、 作为定位 基础的利益必须为目标消费者所重视；（3）、定位必须有营销组合的支撑；（4）、 定位需要 实现与消费者的沟通。", "n": 91}, {"q": "第三节 市场定位：市场定位的流程是什么？", "a": "市场定位的流程：（1）、分析目标市场的竞争格局；（2）、识别顾客对各种替代品的选择 依据；（3）、评估顾客追求的利益的相对重要性；（4）、确定竞争产品在重要属性方面的地位； （5）、选择竞争优势；（6）、显示竞争优势。", "n": 92}, {"q": "第一节 产品概述：产品的层次是什么？", "a": "产品的层次：（1）、核心产品。核心产品是指向顾客提供的产品的基本效用或利益。它是 产品最基本的层次，也就是顾客真正要购买的利益和服务； （2）、基础产品。基础产品是 核心产品借以实现的形式；（3）、期望产品。期望产品是指顾客购买产品时期望的一整套属 性和条件；（4）、延伸产品。延伸产品是指顾客购买基础产品和期望产品时，附带获得的各 种利益 的总和；（5）、潜在产品。潜在产品是指现有产品包括附加产品在内的、可能发展成 为未来最终 产品的潜在状态的产品，预示着该产品最终可能产生的所有利益的增加和改变。", "n": 93}, {"q": "第一节 产品概述：按照耐用性和有形性，产品可以分为非耐用品、耐用品和服务 3 类是什么？", "a": "按照耐用性和有形性，产品可以分为非耐用品、耐用品和服务 3 类。从消费者 购买习 惯的角度考虑，可将产品区分为便利品、选购品、特殊品和非渴求品 4 种类型。", "n": 94}, {"q": "第一节 产品概述：产品的组合的维度主要有 4 个，即一般评估产品组合的四要素是什么？", "a": "产品的组合的维度主要有 4 个，即一般评估产品组合的四要素：宽度、长度、深度和黏 性。", "n": 95}, {"q": "第一节 产品概述：产品线延伸决策包括是什么？", "a": "产品线延伸决策包括：（1）、产品线向下延伸；（2）、产品线向上延伸；（3）、产品线的双 向延伸。", "n": 96}, {"q": "第二节 产品生命周期与新产品开发策略：回忆这一条知识点", "a": "产品生命周期是指产品从投入市场到退出市场所经历的全部过程，产品生命周期可分导 入期、成长期、成熟期和衰退期 4 个阶段。这一过程可用曲线来表示，称为产品生命周期 曲线。", "n": 97}, {"q": "第二节 产品生命周期与新产品开发策略：回忆这一条知识点", "a": "导入期的营销策略包括快速撇脂策略（高价格、高促销）、缓慢撇脂策略（高价格、低促 销）、快速渗透策略（低价格、高促销）、缓慢渗透策略（低价格、低促销）。", "n": 98}, {"q": "第二节 产品生命周期与新产品开发策略：成长期的营销策略包括产品策略、渠道策略、促销策略、价格策略是什么？", "a": "成长期的营销策略包括产品策略、渠道策略、促销策略、价格策略。", "n": 99}, {"q": "第二节 产品生命周期与新产品开发策略：新产品开发过程包括 8 个阶段是什么？", "a": "新产品开发过程包括 8 个阶段：创意生产、创意筛选、产品概念的发展和测试、营销战 略发展、商业分析、产品开发、市场测试、商品化。", "n": 100}, {"q": "第二节 产品生命周期与新产品开发策略：新产品的采用过程是什么？", "a": "新产品的采用过程：（1）、知晓。知晓是消费者获得新产品信息的初始阶段。消费者对新 产品有所觉察，但缺少关于它的信息；（2）、兴趣。在此阶段，消费者受激发，寻找该新产 品的信息；（3）、评价。评价阶段的消费者考虑试用期内使用该新产品是否明智；（4）、试用。 在此阶段，消费者小规模使用了该新产品，以改进对其价值的评价；（5）、采用。在此阶段， 消费者决定经常和全面采用该新产品。", "n": 101}, {"q": "第三节 产品品牌策略：品牌资产的竞争优势主要体现在以下 5 个方面是什么？", "a": "品牌资产的竞争优势主要体现在以下 5 个方面：（1）、降低了企业的营销成本；（2）、加 强了企业对中间商的讨价还价能力；（3）、企业可以比竞争对手卖更高的价格；（4）、企业可 以较容易地开展品牌延伸；（5）、品牌给企业提供了某些保护作用。", "n": 102}, {"q": "第三节 产品品牌策略：品牌策略包括品牌化策略、品牌使用者策略、品牌名称策略、品牌发展策略、 品牌重新 定位策略是什么？", "a": "品牌策略包括品牌化策略、品牌使用者策略、品牌名称策略、品牌发展策略、 品牌重新 定位策略。", "n": 103}, {"q": "第四节 产品的包装策略与服务策略：常见的产品包装策略主要有以下几种是什么？", "a": "常见的产品包装策略主要有以下几种：（1）类似包装策略；（2）、差异包装策略；（3）、 连带式包装策略；（4）、复用式包装策略或多用途包装策略；（5）、等级式包 装策略；（6）、 赠品式包装策略；（7）、改变包装策略；（8）、开窗式包装策略；（9）、 分量式包装策略；（10）、 礼品式包装策略。", "n": 104}, {"q": "第四节 产品的包装策略与服务策略：按照市场供应中服务所占比重的多少，可将服务分成以下 4 种类型是什么？", "a": "按照市场供应中服务所占比重的多少，可将服务分成以下 4 种类型：（1）、有形商品伴 随服务，是指此种商品中附带旨在提高对消费者吸引力的一种或多种 服务；（2）、有形商品 与服务的结合，是指此种市场提供物中商品和服务的比重相当；（3）、主要服务伴随小物品 或小服务，是指此类市场提供物主要由一项主要服务和某些附加服务或辅助品构成；（4）、 纯粹服务，是指此类服务中没有任何有形商品。", "n": 105}, {"q": "第一节 定价流程：定价的流程是什么？", "a": "定价的流程：（1）、选择定价的流程；（2）、分析需求；（3）、估计成本；（4）、 分析竞争 者；（5）、选择定价方法；（6）、确定最终价格。", "n": 106}, {"q": "第二节 定价方法：成本导向定价法包括是什么？", "a": "成本导向定价法包括：（1）、成本加成定价法。成本加成定价法是指在产品单位成本的基 础上，加上一定比例 的预期利润来制定产品的销售价格的定价方法；（2）、目标收益定价法。 目标收益定价法又称投资收益率定价法，它是在企业投资总额 的基础上，按照目标收益率 计算价格的定价方法。", "n": 107}, {"q": "第二节 定价方法：需求导向定价法包括是什么？", "a": "需求导向定价法包括：（1）、感知价值定价法。感知价值定价法是指企业根据购买者对产 品或服务的感知价值 来制定价格；（2）、价值定价法。价值定价法是指企业通过制定低价但 仍提供高质量的产品或服务以 赢得顾客忠诚；（3）、需求差异定价法。需求差异定价法是指 根据消费者不同的购买力水平、不同的需 求欲望、不同的审美偏好、对同种产品或服务的 不同需求强度等，制定不同的价格和收 费方法。", "n": 108}, {"q": "第二节 定价方法：竞争导向定价法包括是什么？", "a": "竞争导向定价法包括：（1）、随行就市定价法。随行就市定价法又称通行价格定价法，是 指企业参照主要竞争 者的价格（或本行业的平均价格水平）来定价；（2）、拍卖定价法。拍 卖定价法应用十分普遍，其中比较常见的有英式拍卖法和荷兰式 拍卖法；（3）、密封投标定 价法。密封投标定价法是指买方通过引导卖方之间的竞争以取得同类产品的最低价格的定价 方法。", "n": 109}, {"q": "第三节 定价策略：心理定价策略包括是什么？", "a": "心理定价策略包括：（1）、尾数定价；（2）、整数定价；（3）、声望定价； （4）、习惯定 价；（5）、招徕定价。", "n": 110}, {"q": "第三节 定价策略：地理定价策略包括是什么？", "a": "地理定价策略包括：（1）、FOB 原产地定价；（2）、统一交货定价；（3）、分区 定价；（4）、 基点定价；（5）、运费免收定价。", "n": 111}, {"q": "第三节 定价策略：差别定价策略包括是什么？", "a": "差别定价策略包括：（1）、顾客细分定价；（2）、产品规格和形象差别定价；（3）、 位置 差别定价；（4）、时间差别定价；（5）、渠道差别定价。", "n": 112}, {"q": "第三节 定价策略：折扣定价与补贴策略包括是什么？", "a": "折扣定价与补贴策略包括：（1）、现金折扣。现金折扣是对能在规定的时间内提前或按时 付清账款的购买者实行的一种价格折扣。一般规定购买后付清账款的时间期限，以此为据， 如果提前付清，可以 得到相应的价格优惠；（2）数量折扣。卖方因为买方购买数量大而给 予的一种价格折扣。可以分为一次性折 扣和累积性（多次）折扣；（3）功能折扣。功能折 扣也称贸易折扣，是制造商给渠道成员的一种额外折扣，促使 其愿意执行某种市场营销职 能（如推销、储存、商品再包装、服务等）；（4）、季节折扣。即卖方给那些过季商品或服务 的一种减价；（5）、补贴。补贴是为了吸引经销商参与到某些项目中而提供的额外补贴，如 以旧换新 是用旧商品换新商品时的补贴。", "n": 113}, {"q": "第一节 分销渠道设计：分销渠道的功能是什么？", "a": "分销渠道的功能：（1）、调研功能；（2）、促销功能；（3）、协议功能；（4）、订货功能； （5）、实体分配功能；（6）、融资功能；（7）、付款功能；（8）、承担风险功能；（9）、商品所 有权转移功能。", "n": 114}, {"q": "第一节 分销渠道设计：按照中间机构级数的多少可以将分销渠道划分为是什么？", "a": "按照中间机构级数的多少可以将分销渠道划分为：零级渠道（M-C）、 一级渠道(M-R-C)、 二级渠道(M-R-W-C)、三级渠道(M-W-J-R-C)和更高层次的分销渠道。按照分销渠道各层次同 类中间商数目的多少，可以将分为宽分销渠道与窄分销渠道；按照分销渠道的中间环节和层 次的多少，可以将分销渠道分为短分销渠道和长分销渠道。", "n": 115}, {"q": "第一节 分销渠道设计：分销渠道设计的过程是什么？", "a": "分销渠道设计的过程：（1）、对消费者的服务需求水平进行分析；（2）、确定分销渠道的 目标；（3）、识别主要的渠道选择方案；（4）、对分销渠道的方案进行评估。", "n": 116}, {"q": "第二节 分销渠道管理：分销渠道冲突的类型是什么？", "a": "分销渠道冲突的类型：（1）、垂直渠道冲突。垂直渠道冲突是同一分销渠道内不同层次的 中间商之间的冲突；（2）、水平渠道冲突。水平渠道冲突是同一分销渠道内同一层次的各中 间商之间的冲突；（3）、多渠道冲突。多渠道冲突是指一个制造商建立了两条或两条以上的 分销渠道，而 这些分销渠道在向同一市场销售其产品时产生的冲突。", "n": 117}, {"q": "第三节 市场物流决策：市场物流的内容与功能是什么？", "a": "市场物流的内容与功能： 按照活动的发展顺序，市场物流一般包括以下内容：销量预测， 这是制订生产计划，决定库存水平的基础；按照生产计划采购原材料并收货入库；将原材料 加工为成品，并验收入库，产品库要将顾客订单与生产活动联系起来，及时掌握库存情况； 将产品发往销 货单位运至顾客并提供售后服务。目前，市场物流逐渐呈现出产业化、专业 化、规范化、 网络化、信息化和国际化的发展趋势。它不仅具有转移产品实体、创造地点 效用的基本功能，而且具备以下优势：（1）、了解顾客价值取向，提升企业价值；（2）、帮助 企业选 择最佳的渠道设计和网络策略；（3）、有助于企业在销售预测、仓储管理、运输管理、 原料管理等方面做出正确的运营措施。", "n": 118}, {"q": "第四节 电子商务营销实践：电子商务营销具有以下特点是什么？", "a": "电子商务营销具有以下特点： 第一、是一种跨越时空的交互式营销；第二、是一种个性 化、顾客导向的营销；第三、 是一种技术性动态营销。", "n": 119}, {"q": "第四节 电子商务营销实践：电子商务营销
