的基本程序是什么？", "a": "电子商务营销的基本程序：（1）、电子商务营销调研；（2）、电子商务营销策略制定；（3）、 电子商务宣传；（4）、电子商务促销；（5）、电子商务风险管理。", "n": 120}, {"q": "第一节 整合营销传播概述：整合营销传播的特征是什么？", "a": "整合营销传播的特征：第一、追求各种营销传播工具传播清晰、一致的信息，从而极大 地提升传播效果；第二、营销传播工具的组合以营销传播活动的总成本和效益最优为衡量标 准，使促销组合的评价标准得以清晰化并易于衡量； 第三、营销传播计划的设计、管理以 目标受众的需求（包括信息、产品和服务等）和企 业目标为出发点和归宿；第四、整合营 销传播强调营销传播过程的连续性和一致性，是企业营销组合的有机组成部分。", "n": 121}, {"q": "第一节 整合营销传播概述：回忆这一条知识点", "a": "营销人员在设计和管理一个全新的营销传播组合，或者要对一个低效率的营销传播组合 进行调整时，就需要了解影响营销传播组合的主要因素并掌握必要的行业经验。这些因素主 要有：产品市场类型、推式战略和拉式战略、消费者购买行为阶段、产品生命周期阶段及企 业产品的市场地位等。", "n": 122}, {"q": "第一节 整合营销传播概述：整合营销传播的开发流程是什么？", "a": "整合营销传播的开发流程：（1）、确定传播对象；（2）、决定传播目标；（3）、 设计传播 信息；（4）、选择传播渠道；（5）、编制促销预算；（6）、促销组合决策；（7）、 管理和协调 营销传播过程。", "n": 123}, {"q": "第二节 广告、销售促进与公共关系：回忆这一条知识点", "a": "企业对广告活动的管理在内容和程序上主要包括确定广告目标、确定广告预算、 设计广 告信息、选择传播媒体和广告效果评价等。", "n": 124}, {"q": "第二节 广告、销售促进与公共关系：回忆这一条知识点", "a": "企业对销售促进的设计和管理在内容和程序上主要包括确定促销目标、选择促销工具、 制定促销方案、实施和控制促销方案、评价促销效果等。", "n": 125}, {"q": "第三节 人员销售与直接促销：人员销售管理主要包括对销售人员的招聘、挑选、训练、指导、激励和评价等是什么？", "a": "人员销售管理主要包括对销售人员的招聘、挑选、训练、指导、激励和评价等。", "n": 126}, {"q": "第三节 人员销售与直接促销：销售人员绩效评估主要包括是什么？", "a": "销售人员绩效评估主要包括：确定评估资料的来源，一般包括销售业务报告、 现场观察、 顾客信件、抱怨及调查等；工作绩效正式评估，通常可采用两种方法，即行业横向比较和个 人纵向比较。", "n": 127}, {"q": "第三节 人员销售与直接促销：从本质上看，直接营销就是销售人员通过媒体与顾客或潜在顾客进行的直接沟 通是什么？", "a": "从本质上看，直接营销就是销售人员通过媒体与顾客或潜在顾客进行的直接沟 通。直接 营销具有便携性、互动性、可衡量性、时空非限制性等特点。", "n": 128}, {"q": "第三节 人员销售与直接促销：回忆这一条知识点", "a": "常见的直接营销形式包括直接邮寄、目录营销、电话营销、电视直销、购物亭营销、电 子营销和其他媒体营销等。", "n": 129}, {"q": "第一节 市场营销组织的发展：市场营销组织的目标是什么？", "a": "市场营销组织的目标：第一，激励营销人员实现营销目标；第二，对市场需求做出快速 反应；第三，使市场营销效率最大化；第四，代表并维护消费者利益。", "n": 130}, {"q": "第一节 市场营销组织的发展：回忆这一条知识点", "a": "营销组织是随着市场营销管理哲学的不断发展演变而来的，总体上经历了单纯的销售部 门、兼有营销职能的销售部门、独立的营销部门、现代市场营销部门、现代市场营销型企业、 以过程和结果为基础的公司 6 个阶段。", "n": 131}, {"q": "第二节 市场营销组织的类型：市场营销组织的模式伴随着市场营销导向的转变不断发生着变化是什么？", "a": "市场营销组织的模式伴随着市场营销导向的转变不断发生着变化。从营销组织 设计所秉 承的营销导向来看，营销组织大体上有两种基本模式：一是生产导向型模式； 二是市场导 向型模式。", "n": 132}, {"q": "第二节 市场营销组织的类型：营销组织的具体类型是什么？", "a": "营销组织的具体类型：（1）、职能型营销组织；（2）、地理型营销组织；（3）、 产品型营 销组织；（4）、市场型营销组织。", "n": 133}, {"q": "第三节 市场营销组织设计：营销组织设计的原则是什么？", "a": "营销组织设计的原则：（1）、战略主导原则；（2）、高效可控原则；（3）、整体 协调原则； （4）、责任利对等原则；（5）、管理幅度与层次原则。", "n": 134}, {"q": "第三节 市场营销组织设计：营销组织的设计步骤是什么？", "a": "营销组织的设计步骤：（1）、分析营销组织环境；（2）、确定组织内部活动；（3）、 建立 组织职位；（4）、设计组织机构；（5）、配备组织人员；（6）、评价和调整组织。", "n": 135}, {"q": "第一节 市场营销控制概述：市场营销控制的特点是什么？", "a": "市场营销控制的特点：第一，市场营销控制具有整体性；第二，市场营销控制具有动态 性；第三，市场营销控制具有人为性。", "n": 136}, {"q": "第一节 市场营销控制概述：市场营销控制的类型主要包括年度计划控制、战略控制、效率控制与盈利能力控制是什么？", "a": "市场营销控制的类型主要包括年度计划控制、战略控制、效率控制与盈利能力控制。", "n": 137}, {"q": "第一节 市场营销控制概述：市场营销控制的原则是什么？", "a": "市场营销控制的原则：（1）、市场营销控制的目标管理性；（2）、市场营销控制 的及时性； （3）、市场营销控制的客观性；（4）、市场营销控制的经济性。", "n": 138}, {"q": "第二节 市场营销控制的内容与方法：回忆这一条知识点", "a": "一般而言，企业的年度计划控制应该包括销售分析、市场份额分析、营销费用 —销售额 分析、财务分析和顾客满意度追踪 5 种方法。", "n": 139}, {"q": "第二节 市场营销控制的内容与方法：企业进行战略控制主要有两种方法，即营销效益等级评定和营销审计是什么？", "a": "企业进行战略控制主要有两种方法，即营销效益等级评定和营销审计。", "n": 140}, {"q": "第二节 市场营销控制的内容与方法：企业进行效率控制时经常采用的方法有 4 种是什么？", "a": "企业进行效率控制时经常采用的方法有 4 种：销售队伍效率控制、广告效率控制、销售 促进效率控制和分销效率控制。", "n": 141}, {"q": "第二节 市场营销控制的内容与方法：在对市场营销成本进行分析之后，还应该考察以下几个反映企业盈利能力的指标是什么？", "a": "在对市场营销成本进行分析之后，还应该考察以下几个反映企业盈利能力的指标：（1）、 销售利润率；（2）、资产收益率；（3）、净资产收益率；（4）、资产管理效率。", "n": 142}, {"q": "第二节 市场营销控制的内容与方法：盈利能力控制的流程是什么？", "a": "盈利能力控制的流程：（1）、确定职能性费用；（2）、将职能性费用分配给各个 营销实体； （3）、为每个营销渠道编制一张损益表。", "n": 143}]}];const app=document.querySelector('#app'),sel=document.querySelector('#course'),status=document.querySelector('#status'),search=document.querySelector('#search');let view='home',idx=0,shown=true,results=[];const storeKey='study-four-v1';let progress=JSON.parse(localStorage.getItem(storeKey)||'{}');const save=()=>localStorage.setItem(storeKey,JSON.stringify(progress));const key=(c,i)=>c.code+':'+i;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));sel.innerHTML='<option value="all">全部科目</option>'+COURSES.map(c=>`<option value="${c.code}">${c.name}（${c.cards.length}卡）</option>`).join('');function pool(){return COURSES.filter(c=>sel.value==='all'||c.code===sel.value).flatMap(c=>c.cards.map((x,i)=>({...x,course:c.name,code:c.code,i,key:key(c,i)})))}function render(){document.querySelector('#back').style.display=(view==='home'&&!search.value.trim())?'none':'inline-block';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));let items=pool(),term=search.value.trim();if(term){let r=[];for(const c of COURSES.filter(c=>sel.value==='all'||c.code===sel.value)){c.pageText.forEach((text,i)=>{if(text.includes(term))r.push({c,page:i+1,text})})}status.textContent=`“${term}” 找到 ${r.length} 个相关页面`;app.innerHTML=r.length?r.map(x=>`<section><span class="tag">${esc(x.c.name)} · 第 ${x.page} 页</span><p class="page">${esc(x.text.slice(0,6000))}</p></section>`).join(''):'<section>没有找到匹配内容。</section>';return}status.textContent=`${items.length} 张背诵卡 · ${COURSES.filter(c=>sel.value==='all'||c.code===sel.value).reduce((n,c)=>n+c.pages,0)} 页资料`;if(view==='home'){app.innerHTML='<div class="grid">'+COURSES.filter(c=>sel.value==='all'||c.code===sel.value).map(c=>`<section class="course" data-code="${c.code}"><h2>${esc(c.name)}</h2><p class="muted">${c.pages} 页 · ${c.cards.length} 张背诵卡</p><span class="tag">开始复习 →</span></section>`).join('')+'</div><section><h2>怎么用</h2><p>先在“逐页阅读”看原资料，再用“背诵卡”快速复习问答。记不住的点按“不会”，进入“待巩固”集中复习。进度保存在当前浏览器。</p></section>';document.querySelectorAll('.course').forEach(el=>el.onclick=()=>{sel.value=el.dataset.code;view='cards';idx=0;shown=true;render()});return}if(view==='read'){app.innerHTML=COURSES.filter(c=>sel.value==='all'||c.code===sel.value).map(c=>`<section><h2>${esc(c.name)}</h2>${c.pageText.map((p,i)=>`<details class="unit"><summary>第 ${i+1} 页</summary><p class="page">${esc(p)}</p></details>`).join('')}</section>`).join('');return}if(view==='wrong')items=items.filter(x=>progress[x.key]==='again');results=items;if(!items.length){app.innerHTML='<section>这里还没有待巩固考点。背诵卡里点“不会”后会自动收录。</section>';return}idx=Math.min(idx,items.length-1);let x=items[idx];app.innerHTML=`<section><span class="tag">${esc(x.course)} · ${idx+1}/${items.length}</span><p class="question">${esc(x.q)}</p><div class="answer">${esc(x.a)}</div><div class="actions"><button id="prev">上一题</button><button id="next">下一题</button><button id="again">不会 · 加入待巩固</button><button id="known">记住了 · 移出待巩固</button></div><p class="muted small">此题答案直接来自上传资料；自动生成的提问仅用于回忆。</p></section>`;document.querySelector('#prev').onclick=()=>{idx=(idx-1+items.length)%items.length;shown=true;render()};document.querySelector('#next').onclick=()=>{idx=(idx+1)%items.length;shown=true;render()};document.querySelector('#again').onclick=()=>{progress[x.key]='again';save();if(view==='wrong')idx=0;else idx=(idx+1)%items.length;shown=true;render()};document.querySelector('#known').onclick=()=>{progress[x.key]='known';save();if(view==='wrong')idx=0;else idx=(idx+1)%items.length;shown=true;render()}}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;idx=0;shown=false;search.value='';render()});sel.onchange=()=>{idx=0;render()};search.oninput=render;document.querySelector('#back').onclick=()=>{view='home';sel.value='all';search.value='';idx=0;render()};render();
</script></body></html>
